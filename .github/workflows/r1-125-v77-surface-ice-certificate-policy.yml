name: R1-125 v77 Surface Ice Certificate Policy
on:
  push:
    branches: [work/forever-world-release-push]
    paths:
      - '.github/workflows/r1-125-v77-surface-ice-certificate-policy.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: contains(github.event.head_commit.message, '[v77-fixture]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/forever-world-release-push
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply narrow surface-ice audit and fingerprint policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()

          old='''\t\t\tif (!isCanonicalCanvasWaterState(bs)\n\t\t\t\t\t&& !isPhysicalAuditProtected(world, state.x, y, state.z, bs, state.preservedWholeBounds)) {'''
          new='''\t\t\tif (!isCanonicalCanvasWaterAuditState(bs, y, waterTop)\n\t\t\t\t\t&& !isPhysicalAuditProtected(world, state.x, y, state.z, bs, state.preservedWholeBounds)) {'''
          if old not in s: raise SystemExit('cooperative physical-audit water check not found')
          s=s.replace(old,new,1)

          old='''\t\t\t\t\tif (isPhysicalAuditProtected(world, x, y, z, state, preservedWholeBounds)) continue;\n\t\t\t\t\tif (!isCanonicalCanvasWaterState(state)) {\n\t\t\t\t\t\treturn new PhysicalProfileMismatch(x, y, z, "water column contains non-canvas state: " + state);'''
          new='''\t\t\t\t\tif (isPhysicalAuditProtected(world, x, y, z, state, preservedWholeBounds)) continue;\n\t\t\t\t\tif (!isCanonicalCanvasWaterAuditState(state, y, waterTop)) {\n\t\t\t\t\t\treturn new PhysicalProfileMismatch(x, y, z, "water column contains non-canvas state: " + state);'''
          if old not in s: raise SystemExit('full physical-audit water check not found')
          s=s.replace(old,new,1)

          old='''\t\t\t\t\tBlockState state = chunk.getBlockState(pos);\n\t\t\t\t\tif (isPhysicalAuditProtected(world, x, y, z, state, preservedWholeBounds)) continue;\n\t\t\t\t\tif (!isCanonicalCanvasWaterState(state)) {\n\t\t\t\t\t\tBlockState target = Blocks.WATER.defaultBlockState();'''
          new='''\t\t\t\t\tBlockState state = chunk.getBlockState(pos);\n\t\t\t\t\tif (isPhysicalAuditProtected(world, x, y, z, state, preservedWholeBounds)) continue;\n\t\t\t\t\tif (!isCanonicalCanvasWaterAuditState(state, y, waterTop)) {\n\t\t\t\t\t\tBlockState target = Blocks.WATER.defaultBlockState();'''
          if old not in s: raise SystemExit('physical-profile repair water check not found')
          s=s.replace(old,new,1)

          old='state.boundaryHash ^= (((long)state.x) << 32) ^ (state.z & 0xffffffffL) ^ ((long)y << 17) ^ bs.hashCode();'
          new='state.boundaryHash ^= (((long)state.x) << 32) ^ (state.z & 0xffffffffL) ^ ((long)y << 17) ^ physicalAuditFingerprintStateHash(bs, y, waterTop);'
          if old not in s: raise SystemExit('cooperative physical fingerprint hash not found')
          s=s.replace(old,new,1)

          old='hash ^= (((long)x) << 32) ^ (z & 0xffffffffL) ^ ((long)y << 17) ^ state.hashCode();'
          new='hash ^= (((long)x) << 32) ^ (z & 0xffffffffL) ^ ((long)y << 17) ^ physicalAuditFingerprintStateHash(state, y, waterTop);'
          if old not in s: raise SystemExit('full physical fingerprint hash not found')
          s=s.replace(old,new,1)

          pat=re.compile(r'\tprivate static boolean isCanonicalCanvasWaterState\(BlockState state\) \{.*?\n\t\}',re.S)
          m=pat.search(s)
          if not m: raise SystemExit('canonical-water helper not found')
          helper='''\n\n\t/**\n\t * Natural vanilla freezing is legitimate post-Canvas evolution, not terrain\n\t * corruption. Accept ordinary ICE only in the configured surface cell; every\n\t * submerged cell remains subject to the strict source-water/vegetation policy.\n\t */\n\tstatic boolean isCanonicalCanvasWaterAuditState(BlockState state, int y, int waterTop) {\n\t\treturn isCanonicalCanvasWaterState(state) || (y == waterTop && state.is(Blocks.ICE));\n\t}\n\n\t/** Keep water<->ice surface evolution from reopening a completed physical seal. */\n\tstatic int physicalAuditFingerprintStateHash(BlockState state, int y, int waterTop) {\n\t\tif (y == waterTop && state.is(Blocks.ICE)) return Blocks.WATER.defaultBlockState().hashCode();\n\t\treturn state.hashCode();\n\t}'''
          s=s[:m.end()]+helper+s[m.end():]
          p.write_text(s)

          p=Path('production-src/gradle.properties'); s=p.read_text()
          if 'mod_version=26.2-v253.125.76' not in s: raise SystemExit('expected v76 gradle identity')
          p.write_text(s.replace('mod_version=26.2-v253.125.76','mod_version=26.2-v253.125.77',1))
          p=Path('production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java'); s=p.read_text()
          if 'VERSION = "v253.125.76"' not in s: raise SystemExit('expected v76 runtime identity')
          p.write_text(s.replace('VERSION = "v253.125.76"','VERSION = "v253.125.77"',1))

          test=Path('production-src/src/test/java/net/oceancanvas/mod/worldgen/OceanCanvasNaturalIceAuditPolicyTest.java')
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package net.oceancanvas.mod.worldgen;\n\nimport net.minecraft.world.level.block.Blocks;\nimport org.junit.jupiter.api.Test;\n\nimport static org.junit.jupiter.api.Assertions.*;\n\nfinal class OceanCanvasNaturalIceAuditPolicyTest {\n    @org.junit.jupiter.api.BeforeAll\n    static void initializeMinecraftRegistries() {\n        net.minecraft.SharedConstants.tryDetectVersion();\n        net.minecraft.server.Bootstrap.bootStrap();\n    }\n\n    @Test\n    void vanillaIceIsAcceptedOnlyAtCanvasWaterSurface() {\n        int top = 62;\n        assertTrue(OceanCanvasSurfaceFlattener.isCanonicalCanvasWaterAuditState(Blocks.WATER.defaultBlockState(), top, top));\n        assertTrue(OceanCanvasSurfaceFlattener.isCanonicalCanvasWaterAuditState(Blocks.ICE.defaultBlockState(), top, top));\n        assertFalse(OceanCanvasSurfaceFlattener.isCanonicalCanvasWaterAuditState(Blocks.ICE.defaultBlockState(), top - 1, top));\n        assertFalse(OceanCanvasSurfaceFlattener.isCanonicalCanvasWaterAuditState(Blocks.STONE.defaultBlockState(), top, top));\n    }\n\n    @Test\n    void surfaceWaterAndIceHaveSamePhysicalFingerprintIdentity() {\n        int top = 62;\n        int water = OceanCanvasSurfaceFlattener.physicalAuditFingerprintStateHash(Blocks.WATER.defaultBlockState(), top, top);\n        int ice = OceanCanvasSurfaceFlattener.physicalAuditFingerprintStateHash(Blocks.ICE.defaultBlockState(), top, top);\n        assertEquals(water, ice);\n        assertNotEquals(water, OceanCanvasSurfaceFlattener.physicalAuditFingerprintStateHash(Blocks.ICE.defaultBlockState(), top - 1, top));\n    }\n}\n''')
          PY
      - name: Focused certificate policy tests
        working-directory: production-src
        run: |
          ./gradlew test --tests net.oceancanvas.mod.worldgen.OceanCanvasNaturalIceAuditPolicyTest --tests net.oceancanvas.mod.worldgen.OceanCanvasFloorBandCycleBreakPolicyTest --tests net.oceancanvas.mod.worldgen.OceanCanvasDeepSeamOwnershipTest --tests net.oceancanvas.mod.worldgen.OceanCanvasSkyPathProofTest --no-daemon
      - name: Full build
        working-directory: production-src
        run: ./gradlew build --no-daemon
      - name: Commit, rebase, push tested v77
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/gradle.properties production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java production-src/src/test/java/net/oceancanvas/mod/worldgen/OceanCanvasNaturalIceAuditPolicyTest.java
          git commit -m 'Treat vanilla surface ice as stable post-Canvas state after focused tests'
          git fetch origin work/forever-world-release-push
          git rebase origin/work/forever-world-release-push
          git push origin HEAD:work/forever-world-release-push
