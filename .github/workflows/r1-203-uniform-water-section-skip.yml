name: R1-203 Uniform Water Section Skip
on:
  push:
    branches: [work/r1-203-uniform-water-section-skip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused product transform
        run: python3 scripts/ci/r1-203-uniform-water-section-skip.py
      - name: Run focused regressions
        run: |
          python3 scripts/ci/test-r1-203-uniform-water-section-skip.py
          python3 scripts/ci/test-uniform-water-audit.py
          python3 scripts/ci/test-physical-audit-fastpath.py
          python3 scripts/ci/test-operation-column-scope.py
      - name: Compile and test exact production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build test
      - name: Persist exact tested product mutation
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java; then
            echo 'Expected focused product mutation was absent' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'R1-203: skip proven uniform water sections during physical audit'
          git push origin HEAD:work/r1-203-uniform-water-section-skip
