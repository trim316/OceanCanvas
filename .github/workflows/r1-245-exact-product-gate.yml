name: R1-245 Exact Product Gate
on:
  push:
    branches: [work/r1-245-recovery-liveness-baseline]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fail-closed source assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'performanceRecoveryDebt.arm(restartRecoveryQuarantinePending.size())' production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java
          grep -q 'performanceRecoveryDebt.observe(recoveryPending)' production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java
          grep -q 'never retires debt or grants completion' production-src/src/main/java/net/oceancanvas/mod/performance/RecoveryDebtLiveness.java
          test "$(git status --porcelain | wc -l)" -eq 0
      - name: Java 25 deterministic regression and build
        working-directory: production-src
        run: ./gradlew --no-daemon test build
