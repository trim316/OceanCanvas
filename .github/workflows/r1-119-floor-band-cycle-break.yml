name: R1-119 Floor Band Cycle Break
on:
  push:
    branches:
      - work/forever-world-release-push
    paths:
      - .github/workflows/r1-119-floor-band-cycle-break.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: contains(github.event.head_commit.message, '[r1-119]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/forever-world-release-push
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply bounded mixed-floor-section repair
        run: python3 tools/r1_119_floor_band_patch_v2.py
      - name: Verify build identity and patch invariants
        run: |
          grep -q 'mod_version=26.2-v253.125.74' production-src/gradle.properties
          grep -q 'VERSION = "v253.125.74"' production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java
          grep -q 'LIGHT-FLOOR-BAND-CYCLE-BREAK' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          test "$(grep -c 'floorBandCycleBreakCounts.remove(packed)' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java)" -eq 2
          git diff --check
      - name: Focused lighting recovery tests
        working-directory: production-src
        run: |
          ./gradlew test \
            --tests net.oceancanvas.mod.worldgen.OceanCanvasFloorBandCycleBreakPolicyTest \
            --tests net.oceancanvas.mod.worldgen.OceanCanvasDeepSeamOwnershipTest \
            --tests net.oceancanvas.mod.worldgen.OceanCanvasSkyPathProofTest \
            --no-daemon
      - name: Full build
        working-directory: production-src
        run: ./gradlew build --no-daemon
      - name: Commit tested v253.125.74 source and remove temporary scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/gradle.properties \
                  production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java \
                  production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java \
                  production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasLightRecoverySession.java \
                  production-src/src/test/java/net/oceancanvas/mod/worldgen/OceanCanvasFloorBandCycleBreakPolicyTest.java
          git rm tools/r1_119_floor_band_patch.py tools/r1_119_floor_band_patch_v2.py .github/workflows/r1-119-floor-band-cycle-break.yml
          git commit -m 'Break stale mixed-floor SKY cycles from saved 2k residual [r1-119-tested]'
          git push origin HEAD:work/forever-world-release-push
