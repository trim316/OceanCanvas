name: Ocean Canvas Disposable Block-Entity Restore Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-blockentity-restore-proof.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-disposable-blockentity-restore
  cancel-in-progress: false

jobs:
  blockentity-restore:
    name: Restore real chest NBT and prove immutable cold reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6d1b129d8cf8a9ff6ffff83633f8f2306af3ffc
          persist-credentials: false

      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = a6d1b129d8cf8a9ff6ffff83633f8f2306af3ffc
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Prove real chest author restore and cold reopen
        run: |
          python3 -m py_compile scripts/ci/hosted-blockentity-restore-proof.py
          python3 scripts/ci/hosted-blockentity-restore-proof.py

      - name: Preserve exact recovery and archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-blockentity-restore-proof
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-blockentity-restore-proof/
            runtime-src/run/world/oceancanvas-core/single-chunk/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
