name: R1-116 Seam Fault Ownership Fix
on:
  push:
    branches:
      - work/forever-world-release-push
    paths:
      - .github/workflows/r1-116-seam-fault-ownership-fix.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/forever-world-release-push
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply evidence-driven seam ownership fix
        run: python3 tools/r1_116_patch.py
      - name: Run focused seam regression tests
        working-directory: production-src
        run: ./gradlew test --tests net.oceancanvas.mod.worldgen.OceanCanvasDeepSeamOwnershipTest --tests net.oceancanvas.mod.worldgen.OceanCanvasSkyPathProofTest --no-daemon
      - name: Compile production jar
        working-directory: production-src
        run: ./gradlew build --no-daemon
      - name: Commit tested source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git add production-src/src/test/java/net/oceancanvas/mod/worldgen/OceanCanvasDeepSeamOwnershipTest.java
          git add production-src/gradle.properties
          git diff --cached --check
          git commit -m 'Fix deep seam fault ownership from Build72 evidence [r1-116]'
          git push origin HEAD:work/forever-world-release-push
