name: R1-149 Pressure Artifact Diagnosis
on:
  push:
    branches:
      - work/r1-149-pressure-artifact-diagnosis
    paths:
      - .github/workflows/r1-149-pressure-artifact-diagnosis.yml
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-149-pressure-artifact-diagnosis
      - name: Download preserved exact R1-148 failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r1-148
          gh run download 38096657710 -n r1-146-exact-throughput-profile-38096657710 -D /tmp/r1-148
      - name: Extract bounded scheduler evidence
        run: |
          python3 - <<'PY' > r1-149-pressure-diagnosis.txt
          from pathlib import Path
          root=Path('/tmp/r1-148')
          text_suffixes={'.log','.txt','.json','.md','.csv'}
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in text_suffixes and p.stat().st_size < 100_000_000]
          pats=('LIGHT_BACKPRESSURE','LIGHT-DIAG','LIGHT-RUNTIME-PRESSURE-HOLD','pressurePark','pressureRetry','foreverWorldPressureWakes','lightingPending','pendingLighting','outstanding=','BACKPRESSURE','PRESSURE')
          hits=[]
          for p in files:
              try: text=p.read_text(errors='replace')
              except Exception: continue
              for i,line in enumerate(text.splitlines(),1):
                  if any(x.lower() in line.lower() for x in pats): hits.append((str(p.relative_to(root)),i,line[:2000]))
          print('R1-149 exact R1-148 artifact diagnosis')
          print('source_run=38096657710')
          print('source_sha=0b40409f6bb596ea3bba97cadf2e30f41f50721e')
          print('text_files_scanned=',len(files))
          print('matched_lines=',len(hits))
          for row in hits[-500:]: print(f'{row[0]}:{row[1]}:{row[2]}')
          PY
          test -s r1-149-pressure-diagnosis.txt
          tail -n 120 r1-149-pressure-diagnosis.txt
      - name: Persist bounded diagnosis on diagnostic branch
        run: |
          mkdir -p diagnostics
          cp r1-149-pressure-diagnosis.txt diagnostics/r1-149-pressure-diagnosis.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/r1-149-pressure-diagnosis.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R1-149: persist exact R1-148 pressure diagnosis'
          git push origin HEAD:work/r1-149-pressure-artifact-diagnosis
      - uses: actions/upload-artifact@v4
        with:
          name: r1-149-pressure-diagnosis
          path: r1-149-pressure-diagnosis.txt
          retention-days: 30
