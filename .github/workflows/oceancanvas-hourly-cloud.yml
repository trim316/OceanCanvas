name: Ocean Canvas Hourly Cloud Development Checks

# Scheduled workflows must live on default branch. All work checks out recovery.
# These hosted jobs never touch a local Minecraft process or Windows runner.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oceancanvas-hourly-cloud.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-hourly-cloud
  cancel-in-progress: false

jobs:
  independent-recovery-audit:
    name: Cloud audit and durable queue evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/core-proof
          persist-credentials: false

      - name: Capture exact recovery source SHA
        shell: bash
        run: git rev-parse HEAD | tee RECOVERY_SOURCE_SHA.txt

      - name: Execute independent recovery audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/cloud-recovery-audit.py 2>&1 | tee cloud-audit-console.log

      - name: Preserve cloud-audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-cloud-audit
          path: |
            cloud-audit-evidence/
            cloud-audit-console.log
            RECOVERY_SOURCE_SHA.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Display summarized audit
        if: always()
        shell: bash
        run: |
          echo "## Cloud recovery audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked SHA: $(cat RECOVERY_SOURCE_SHA.txt 2>/dev/null || echo unavailable)" >> "$GITHUB_STEP_SUMMARY"
          if test -f cloud-audit-evidence/cloud-audit.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report=json.load(open('cloud-audit-evidence/cloud-audit.json'))
          print('Verdict: **'+report['verdict']+'**')
          for c in report['checks']:
              print('- '+('PASS' if c['pass'] else 'FAIL')+': '+c['check'])
          PY
          else
            echo "No JSON report. See preserved console output." >> "$GITHUB_STEP_SUMMARY"
          fi

  independent-core-tests:
    name: Hosted Java 25 deterministic core regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/core-proof
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Capture exact core-tested SHA
        shell: bash
        run: git rev-parse HEAD | tee CLOUD_TEST_SOURCE_SHA.txt

      - name: Build and self-test core without Minecraft
        shell: bash
        working-directory: runtime-src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew clean build --warning-mode=fail 2>&1 | tee ../cloud-core-build.log

      - name: Preserve core evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-cloud-core-tests
          path: |
            CLOUD_TEST_SOURCE_SHA.txt
            cloud-core-build.log
            runtime-src/build/test-results/
            runtime-src/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30
