name: Ocean Canvas Disposable Sixteen-Chunk Canary

on:
  workflow_dispatch:
  push:
    branches:
      - work/r1-120-sixteen-chunk-runtime
    paths:
      - '.github/workflows/hosted-sixteen-chunk-proof.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-disposable-sixteen-chunk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-sixteen-chunk:
    name: Sixteen explicitly confirmed chunks with one active ticket
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OCEANCANVAS_SIXTEEN_CHUNK_SEED: '4182036'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record exact sixteen-chunk source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Prove nine sequential chunks and immutable cold restart
        run: |
          python3 -m py_compile scripts/ci/hosted-sixteen-chunk-proof.py
          python3 scripts/ci/hosted-sixteen-chunk-proof.py

      - name: Preserve exact proof and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-sixteen-chunk-canary
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-sixteen-chunk-proof/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
