name: Ocean Canvas Runtime Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/runtime-trigger.txt'
      - '.github/workflows/runtime-gates.yml'
      - 'scripts/ci/run-runtime-gates.ps1'
      - 'scripts/ci/repair-v0.2.23-residency-race.ps1'

concurrency:
  group: oceancanvas-runtime-gates
  cancel-in-progress: false

jobs:
  status:
    name: Control-plane preflight
    runs-on: windows-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Parse PowerShell control scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'scripts/ci/run-runtime-gates.ps1',
            'scripts/ci/repair-v0.2.23-residency-race.ps1'
          )
          foreach ($target in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $target),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$target parser error: $($_.Message) at $($_.Extent.Text)" }
              throw "PowerShell parse preflight failed: $target"
            }
            Write-Host "PARSE PASS: $target"
          }

      - name: Enforce runtime proof fail-closed invariants
        shell: powershell
        run: |
          $bridge = Get-Content scripts/ci/run-runtime-gates.ps1 -Raw
          foreach ($needle in @(
            'CONTROLLER_EXIT_CODE=',
            'FAIL-CLOSED: controller returned 0 but durable ledger is incomplete',
            "G2','G4','G9','G16",
            'Reset-ModrinthLauncher',
            'Resolve-StaleRuntimeOwnership'
          )) {
            if (-not $bridge.Contains($needle)) { throw "Missing fail-closed bridge invariant: $needle" }
          }
          $repair = Get-Content scripts/ci/repair-v0.2.23-residency-race.ps1 -Raw
          foreach ($needle in @(
            'MAX_RESIDENCY_REACQUIRE_ATTEMPTS',
            'validate-all.sh',
            'Gradle build failed',
            'Backup checksum mismatch',
            'Installed candidate checksum mismatch'
          )) {
            if (-not $repair.Contains($needle)) { throw "Missing transactional repair invariant: $needle" }
          }
          Write-Host 'CONTROL-PLANE INVARIANTS PASS'

      - name: Publish dashboard
        shell: powershell
        run: |
          @'
          # Ocean Canvas runtime gate dashboard

          **Control plane:** GitHub Actions
          **Runtime worker:** self-hosted Windows PC
          **Frozen runtime:** 26.2-core-v0.2.23
          **Policy:** no Gradle / no rebuild / maxActiveChunks=1

          This workflow uses the self-hosted Windows runner for the Minecraft/Modrinth portion.
          If the runtime job is queued, the PC runner is offline.
          Once it is online, the runtime job will stream G4/G9/G16 progress here.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

  runtime:
    name: Windows Minecraft runtime gate ladder
    needs: status
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Persist self-hosted runner at login
        shell: cmd
        run: |
          > "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\OceanCanvas-GitHub-Runner.cmd" echo @echo off
          >> "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\OceanCanvas-GitHub-Runner.cmd" echo cd /d C:\actions-runner\actions-runner
          >> "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\OceanCanvas-GitHub-Runner.cmd" echo call run.cmd

      - name: Apply validated runtime repair if needed
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ci\repair-v0.2.23-residency-race.ps1

      - name: Run Ocean Canvas runtime gate ladder
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ci\run-runtime-gates.ps1 -TimeoutMinutes 700

      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-runtime-evidence
          path: runtime-evidence
          if-no-files-found: warn
          retention-days: 30
