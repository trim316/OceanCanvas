name: R1-242 Exact Product Gate

on:
  push:
    branches:
      - work/r1-242-port-retained-selection-scope
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: production-src/gradle/wrapper/gradle-wrapper.properties
      - name: Validate retained-selection safety regression
        run: python3 scripts/ci/test-retained-selection-scope.py
      - name: Test and build production source
        working-directory: production-src
        run: ./gradlew --no-daemon test build
