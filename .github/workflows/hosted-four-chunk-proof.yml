name: Ocean Canvas Disposable Four-Chunk Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-four-chunk-proof.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-disposable-four-chunk
  cancel-in-progress: false

jobs:
  disposable-four-chunk:
    name: Four chunks with third-chunk process-kill recovery
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OCEANCANVAS_FOUR_CHUNK_SEED: '4182031'
      OCEANCANVAS_FOUR_CHUNK_INTERRUPT_INDEX: '2'
      OCEANCANVAS_FOUR_CHUNK_INTERRUPT_AFTER: 'PREIMAGE_CAPTURED'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 080675bc3190320be0a654f95023af5637fc1257
          persist-credentials: false

      - name: Assert exact four-chunk candidate
        run: |
          test "$(git rev-parse HEAD)" = 080675bc3190320be0a654f95023af5637fc1257
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Prove four sequential chunks and immutable cold restart
        run: |
          python3 -m py_compile scripts/ci/hosted-four-chunk-proof.py
          python3 scripts/ci/hosted-four-chunk-proof.py

      - name: Preserve exact proof and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-four-chunk-canary
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-four-chunk-proof/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
