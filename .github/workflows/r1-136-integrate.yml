name: R1-136 Integrate Terrain Light Dormancy
on:
  push:
    branches: [work/r1-136-terrain-phase-light-dormancy]
    paths:
      - scripts/ci/apply-r1-136-integration.py
      - .github/workflows/r1-136-integrate.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-136-terrain-phase-light-dormancy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply scheduler integration
        run: |
          set -o pipefail
          python scripts/ci/apply-r1-136-integration.py 2>&1 | tee r1-136-integration.log
      - name: Preserve first failure context
        if: always()
        run: |
          grep -n -C 4 'pressureParkUntilTick' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java >> r1-136-integration.log || true
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-136-integration-evidence
          path: r1-136-integration.log
      - name: Assert focused source delta
        run: git diff --check
      - name: Commit exact integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'R1-136 integrate terrain-phase light dormancy scheduler'
          git push origin HEAD:work/r1-136-terrain-phase-light-dormancy
