name: R1-136 Integrate Terrain Light Dormancy
on:
  push:
    branches: [work/r1-136-terrain-phase-light-dormancy]
    paths:
      - scripts/ci/apply-r1-136-integration.py
      - .github/workflows/r1-136-integrate.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-136-terrain-phase-light-dormancy
          fetch-depth: 0
      - name: Reconcile authoritative production before mutation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin work/forever-world-release-push
          git merge --no-edit origin/work/forever-world-release-push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply scheduler integration
        run: |
          set -o pipefail
          python scripts/ci/apply-r1-136-integration.py 2>&1 | tee r1-136-integration.log
      - name: Preserve first failure context
        if: always()
        run: |
          grep -n -C 5 -E 'pressureParkUntilTick|pollDuePressure|genericDormantDue' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasLightRetryLedger.java >> r1-136-integration.log || true
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-136-integration-evidence
          path: r1-136-integration.log
      - name: Assert focused source delta
        run: git diff --check
      - name: Compile integrated production source
        run: |
          mkdir -p /tmp/r1-136-classes
          find production-src/src/main/java -name '*.java' -print0 | xargs -0 javac -source 25 -target 25 -d /tmp/r1-136-classes
      - name: Commit exact integration
        run: |
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasLightRetryLedger.java
          if ! git diff --cached --quiet; then
            git commit -m 'R1-136 integrate dedicated terrain-phase light dormancy lane'
          fi
          git push origin HEAD:work/r1-136-terrain-phase-light-dormancy
