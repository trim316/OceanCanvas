name: OceanCanvas 26.3 Physical Gate Repair Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/26-3-physical-gate-repair-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/26.3-physical-gate-repair
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply narrow post-job falling-debris authority repair
        run: python scripts/ci/apply-26-3-physical-gate-repair.py

      - name: Commit repaired 26.3 source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Source already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java production-src/src/test/java/net/oceancanvas/mod/worldgen/OceanCanvasPostJobIntegrityTest.java production-src/gradle.properties production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java
            git commit -m 'fix(26.3): repair sealed falling debris at post-job gate'
            git push origin HEAD:fix/26.3-physical-gate-repair
          fi

      - name: Run production tests and build
        working-directory: production-src
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean test build --warning-mode=all

      - name: Verify candidate identity
        run: |
          set -euo pipefail
          jar="$(find production-src/build/libs -maxdepth 1 -type f -name 'oceancanvas-26.3-v253.125.84.jar' -print -quit)"
          test -n "$jar"
          echo "JAR=$jar" >> "$GITHUB_ENV"
          sha256sum "$jar"
          unzip -p "$jar" fabric.mod.json | grep -F '26.3-v253.125.84'

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-26.3-v253.125.84
          path: ${{ env.JAR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish scoped 26.3 fix release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='minecraft-26.3-v253.125.84'
          head="$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "$JAR" --target "$head" --title 'OceanCanvas v253.125.84 - 26.3 post-job physical gate fix' --notes 'Minecraft 26.3 hotfix for the post-job physical-integrity stall observed on recovered pregens. Physically verified sealed OceanCanvas chunks may now remove settled falling-block debris such as gravel during the active operation even after the short-lived repair lease has ended. Unsealed historical chunks still fail closed, and existing player and structure protection checks remain unchanged. Includes regression tests for authority boundaries. This is a scoped 26.3 hotfix; it does not expand the existing 20k or full-v1.0 certification scope.'
          fi
