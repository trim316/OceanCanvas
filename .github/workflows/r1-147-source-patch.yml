name: R1-147 Source Patch
on:
  push:
    branches: [work/r1-147-post-terrain-pressure-wake]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused source repair and regression
        shell: python
        run: |
          from pathlib import Path
          src = Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          text = src.read_text()
          old = '''\t\tint globalHeadroom = Math.max(0,\n\t\t\t\tLIGHT_FINALIZATION_BACKPRESSURE_LOW_WATER - lightFinalizerSession().pendingTicks.size());\n\t\tif (globalHeadroom <= 0) return fastCompleted;'''
          new = '''\t\t// R1-147: while terrain is still being authored, keep the conservative low-water\n\t\t// admission boundary. Once terrain ownership is fully retired, the pressure lane\n\t\t// becomes the completion tail itself: permit bounded wakes up to the existing\n\t\t// high-water ceiling instead of requiring active work to fall below low-water.\n\t\t// This changes scheduling only; every woken chunk still traverses the unchanged\n\t\t// strict finalizer/certificate path and the existing per-call wake budgets.\n\t\tboolean terrainCompleteForPressureWake =\n\t\t\t\tnet.oceancanvas.mod.lifecycle.OceanCanvasTerrainOperationActivity.outstandingPregenTargets() == 0;\n\t\tint pressureWakeCeiling = terrainCompleteForPressureWake\n\t\t\t\t? LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER\n\t\t\t\t: LIGHT_FINALIZATION_BACKPRESSURE_LOW_WATER;\n\t\tint globalHeadroom = Math.max(0,\n\t\t\t\tpressureWakeCeiling - lightFinalizerSession().pendingTicks.size());\n\t\tif (globalHeadroom <= 0) return fastCompleted;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one wake-headroom site, found {text.count(old)}')
          src.write_text(text.replace(old, new))
          test = Path('scripts/ci/test-r1-147-post-terrain-pressure-wake.py')
          test.write_text('''from pathlib import Path\n\nsrc = Path("production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java").read_text()\nmethod = src.split("public static int wakePressureParkedRecoveryForPressure(", 1)[1].split("public static", 1)[0]\nassert "terrainCompleteForPressureWake" in method\nassert "outstandingPregenTargets() == 0" in method\nassert "? LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER" in method\nassert ": LIGHT_FINALIZATION_BACKPRESSURE_LOW_WATER" in method\nassert "pressureWakeCeiling - lightFinalizerSession().pendingTicks.size()" in method\nassert "while (woken < globalHeadroom" in method\nassert "maxLightOnlyWake" in method and "maxPhysicalWake" in method\n# Fail closed during terrain authoring: low-water remains the selected ceiling.\nassert method.index("outstandingPregenTargets() == 0") < method.index(": LIGHT_FINALIZATION_BACKPRESSURE_LOW_WATER")\n# Do not weaken strict certification or turn pressure wake into completion credit.\nassert "LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER - lightFinalizerSession().pendingTicks.size()" not in src\nprint("R1-147 post-terrain pressure wake contract PASS")\n''')
      - name: Deterministic R1-147 regression
        run: python scripts/ci/test-r1-147-post-terrain-pressure-wake.py
      - name: Production compile and tests
        working-directory: production-src
        run: ./gradlew --no-daemon test
      - name: Commit validated source repair
        run: |
          git rm .github/workflows/r1-147-source-patch.yml
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java scripts/ci/test-r1-147-post-terrain-pressure-wake.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "R1-147: wake parked lighting after terrain retirement"
          git push origin HEAD:work/r1-147-post-terrain-pressure-wake
