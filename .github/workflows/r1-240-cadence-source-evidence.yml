name: R1-240 Cadence Source Evidence

on:
  push:
    branches:
      - work/r1-240-cadence-source-evidence
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download preserved R1-238 diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12428059068/zip > r1-238.zip
          unzip -q r1-238.zip -d r1-238

      - name: Extract cadence and scheduler evidence
        run: |
          set -euo pipefail
          mkdir -p out
          find r1-238 -type f | sort > out/file-inventory.txt
          grep -RInE 'p95|cadence|performance-budget|PERFORMANCE|Can.t keep up|SLOW|LIGHT-DIAG|tick' r1-238 \
            --include='*.txt' --include='*.log' --include='*.json' --include='*.properties' \
            > out/cadence-evidence.txt || true
          python3 - <<'PY'
          from pathlib import Path
          src=Path('out/cadence-evidence.txt')
          lines=src.read_text(errors='replace').splitlines() if src.exists() else []
          keys=('p95','cadence','performance-budget','PERFORMANCE','Can\'t keep up','SLOW-PHASE','LIGHT-DIAG')
          chosen=[x for x in lines if any(k in x for k in keys)]
          Path('out/cadence-summary.txt').write_text('\n'.join(chosen[-400:])+'\n')
          PY
          test -s out/file-inventory.txt
          test -s out/cadence-summary.txt

      - name: Upload small evidence
        uses: actions/upload-artifact@v4
        with:
          name: r1-240-cadence-source-evidence
          path: out/
          retention-days: 30

      - name: Persist bounded summary on diagnostic branch
        run: |
          set -euo pipefail
          mkdir -p evidence/r1-240
          cp out/cadence-summary.txt evidence/r1-240/cadence-summary.txt
          cp out/file-inventory.txt evidence/r1-240/file-inventory.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/r1-240/cadence-summary.txt evidence/r1-240/file-inventory.txt
          if git diff --cached --quiet; then
            echo 'Exact extracted evidence already persisted.'
            exit 0
          fi
          git commit -m 'R1-240: persist extracted cadence evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
