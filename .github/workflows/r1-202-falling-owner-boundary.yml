name: R1-202 Falling Write Owner Boundary

on:
  push:
    branches: [work/r1-202-falling-owner-boundary]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused owner-boundary repair
        run: python3 scripts/ci/r1-202-falling-owner-boundary.py
      - name: Verify falling write authority matrix
        run: python3 scripts/ci/test-falling-edge-authority.py
      - name: Verify decoration reproof retirement
        run: python3 scripts/ci/test-decoration-reproof-retirement.py
      - name: Verify physical audit fast paths
        run: python3 scripts/ci/test-physical-audit-fastpath.py
      - name: Assert focused production delta
        run: |
          changed="$(git diff --name-only -- production-src | wc -l)"
          test "$changed" -le 1
          git diff --check
          grep -F 'return currentPhysicalOwner && (sealedCanvas || currentEpochAuditComplete || authoredWaterHistory);' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
      - name: Build exact transformed production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build
      - name: Persist exact tested product mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          if ! git diff --cached --quiet; then
            git commit -m 'R1-202: require live physical owner for falling writes'
            git push
          fi
