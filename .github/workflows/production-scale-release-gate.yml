name: Ocean Canvas Production Checks and Scoped Release

on:
  push:
    branches:
      - release/v1-scale-engine-integration
      - work/forever-world-release-push
    paths:
      - 'production-src/**'
      - 'scripts/ci/production-runtime.py'
      - 'scripts/ci/publish-production-500.py'
      - 'scripts/ci/test-production-candidate.py'
      - 'scripts/ci/test-pressure-wake.py'
      - 'scripts/windows/run-modrinth-local-test.cmd'
      - '.github/workflows/production-scale-release-gate.yml'
      - '.github/workflows/production-acceptance.yml'
      - '.github/workflows/production-finalize.yml'
      - 'scripts/ci/production-scale.py'
      - 'scripts/ci/runtime_support.py'
      - 'scripts/ci/scale_evidence.py'
      - 'scripts/ci/candidate_verifier.py'
      - 'scripts/ci/runtime_stall.py'
      - 'scripts/ci/test-runtime-stall.py'
      - 'scripts/ci/test-scale-stall.py'
      - 'scripts/ci/test-scale-geometry.py'
      - 'scripts/ci/scale_geometry.py'
      - 'scripts/ci/test-pregen-start-geometry.py'
      - 'scripts/ci/test-scale-candidate.py'
      - 'scripts/ci/test-scale-evidence.py'
      - 'scripts/ci/test-physical-audit-fastpath.py'
      - 'scripts/ci/test-operation-column-scope.py'
      - 'scripts/ci/test-pregen-border.py'
      - 'scripts/ci/test-border-player-protection.py'
      - 'scripts/ci/test-runtime-support.py'
      - 'scripts/ci/backlog-report.py'
      - 'scripts/ci/test-fluid-scan.py'
      - 'scripts/ci/test-fixture-readiness.py'
      - 'scripts/ci/test-status-report.py'
      - '.github/workflows/production-staged-scale.yml'
      - '.github/workflows/production-endurance-checkpoint.yml'
  workflow_dispatch:
    inputs:
      endurance:
        description: Run optional 5k and 20k endurance certification
        type: boolean
        default: false
      staged_scale:
        description: Attempt bounded 2k then 5k after all short diagnostics pass
        type: boolean
        default: false
      publish_500:
        description: Publish the candidate with a 500-block validated scope
        type: boolean
        default: false

# Superseded push checks can stop; dispatch/endurance/release jobs keep their
# own run group so a newer development push cannot discard checkpoints.
concurrency:
  group: production-${{ github.ref }}-${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-500]') && !contains(github.event.head_commit.message, '[preserve-running-tests]') && 'development' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-500]') && !contains(github.event.head_commit.message, '[preserve-running-tests]') }}

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  independent-checks:
    name: Independent candidate and recovery checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 scripts/ci/test-production-candidate.py
      - run: python3 scripts/ci/test-production-500-release.py
      - run: python3 scripts/ci/test-pressure-wake.py
      - run: python3 scripts/ci/test-light-pressure-escape.py
      - run: python3 scripts/ci/test-early-light-quiescence.py
      - run: python3 scripts/ci/test-light-retry-clock.py
      - run: python3 scripts/ci/test-runtime-support.py
      - run: python3 scripts/ci/test-fluid-scan.py
      - run: python3 scripts/ci/test-fixture-readiness.py
      - run: python3 scripts/ci/test-scale-evidence.py
      - run: python3 scripts/ci/test-scale-candidate.py
      - run: python3 scripts/ci/test-runtime-stall.py
      - run: python3 scripts/ci/test-scale-stall.py
      - run: python3 scripts/ci/test-scale-geometry.py
      - run: python3 scripts/ci/test-pregen-start-geometry.py
      - run: python3 scripts/ci/test-physical-audit-fastpath.py
      - run: python3 scripts/ci/test-operation-column-scope.py
      - run: python3 scripts/ci/test-pregen-border.py
      - run: python3 scripts/ci/test-border-player-protection.py

  production-build:
    name: Build mature production mod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      runtime_build: ${{ steps.candidate.outputs.runtime_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test candidate identity rejection cases
        run: python3 scripts/ci/test-production-candidate.py
      - name: Test limited release rejection cases
        run: python3 scripts/ci/test-production-500-release.py
      - name: Test actual pressure-repair wake transitions
        run: python3 scripts/ci/test-pressure-wake.py
      - name: Check local Windows launcher syntax
        shell: pwsh
        run: |
          $text = Get-Content scripts/windows/run-modrinth-local-test.cmd -Raw
          $tag = '# POWERSHELL_' + 'PAYLOAD'
          $body = $text.Substring($text.LastIndexOf($tag) + $tag.Length)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($body, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew build --warning-mode=fail
      - name: Resolve production build identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' production-src/gradle.properties)"
          runtime_build="$(sed -n 's/.*public static final String VERSION = "\(v[^"]*\)".*/\1/p' production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java)"
          test -n "$mod_version"
          test -n "$runtime_build"
          test "$mod_version" = "26.2-$runtime_build"
          jar="production-src/build/libs/oceancanvas-$mod_version.jar"
          test -f "$jar"
          printf 'jar=%s\n' "$jar" >> "$GITHUB_OUTPUT"
          printf 'runtime_build=%s\n' "$runtime_build" >> "$GITHUB_OUTPUT"
      - name: Bind candidate to exact artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-candidate
          cp scripts/windows/run-modrinth-local-test.cmd production-candidate/
          jar='${{ steps.candidate.outputs.jar }}'
          test -f "$jar"
          cp "$jar" production-candidate/
          sha256sum "$jar" > production-candidate/JAR-SHA256.txt
          printf 'sourceCommit=%s\nbuildRunId=%s\nruntimeBuild=%s\nreleaseStatus=HOLD\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" '${{ steps.candidate.outputs.runtime_build }}' > production-candidate/candidate.properties
      - uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-production-candidate
          path: production-candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - name: Test newly built candidate on a fresh 500-block server
        env:
          EXPECTED_BUILD: ${{ steps.candidate.outputs.runtime_build }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/ci/production-runtime.py
      - name: Summarize observed lighting backlog
        if: always() && hashFiles('production-runtime-evidence/console.log') != ''
        run: python3 scripts/ci/backlog-report.py production-runtime-evidence/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-runtime-500
          path: production-runtime-evidence/
          if-no-files-found: ignore
          retention-days: 30

  parallel-runtime:
    name: Fresh 500-block world / seed ${{ matrix.seed }}
    needs: [production-build, independent-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [0, 8675309]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          path: production-candidate
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - name: Test the exact candidate on an independent seed
        env:
          EXPECTED_BUILD: ${{ needs.production-build.outputs.runtime_build }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          OC_TEST_SEED: ${{ matrix.seed }}
        run: python3 scripts/ci/production-runtime.py
      - name: Summarize observed lighting backlog
        if: always() && hashFiles('production-runtime-evidence/console.log') != ''
        run: python3 scripts/ci/backlog-report.py production-runtime-evidence/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-runtime-500-seed-${{ matrix.seed }}
          path: production-runtime-evidence/
          if-no-files-found: error
          retention-days: 30

  diagnostic-runtime:
    name: Focused runtime / ${{ matrix.case.name }}
    needs: [production-build, independent-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case:
          - {name: controlled-waterfall-inflow, width: 128, x: -464, z: 436, profile: 'false', fixture: 'true', border: 'true', seconds: 240}
          - {name: building-water-persistence, width: 128, x: 0, z: 0, profile: 'false', gameplay: 'true', seconds: 240}
          - {name: lighting-hotspot-east, width: 128, x: 134, z: 14, profile: 'false', seconds: 240}
          - {name: lighting-hotspot-edge, width: 128, x: 186, z: -246, profile: 'false', seconds: 240}
          - {name: waterfall-frontier, width: 128, x: -464, z: 436, profile: 'false', border: 'true', seconds: 240}
          - {name: throughput-profile, width: 1000, x: 0, z: 0, profile: 'true', border: 'true', seconds: 900}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          path: production-candidate
      - name: Reproduce hotspot or capture performance profile
        env:
          EXPECTED_BUILD: ${{ needs.production-build.outputs.runtime_build }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          OC_TEST_WIDTH: ${{ matrix.case.width }}
          OC_CENTER_X: ${{ matrix.case.x }}
          OC_CENTER_Z: ${{ matrix.case.z }}
          OC_PROFILE: ${{ matrix.case.profile }}
          OC_WATERFALL_FIXTURE: ${{ matrix.case.fixture }}
          OC_NATURAL_BORDER: ${{ matrix.case.border }}
          OC_GAMEPLAY_FIXTURE: ${{ matrix.case.gameplay }}
          OC_STAGE_SECONDS: ${{ matrix.case.seconds }}
        run: python3 scripts/ci/production-runtime.py
      - name: Summarize observed lighting backlog
        if: always() && hashFiles('production-runtime-evidence/console.log') != ''
        run: python3 scripts/ci/backlog-report.py production-runtime-evidence/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.case.name }}
          path: production-runtime-evidence/
          if-no-files-found: error
          retention-days: 30

  checkpoint-smoke:
    name: Actual interruption and saved-job resume
    needs: [production-build, independent-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          path: production-candidate
      - name: Interrupt, save, restart, resume and certify the original small world
        env:
          EXPECTED_BUILD: ${{ needs.production-build.outputs.runtime_build }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/ci/test-checkpoint-runtime.py
      - name: Summarize observed lighting backlog
        if: always() && hashFiles('production-runtime-evidence/console.log') != ''
        run: python3 scripts/ci/backlog-report.py production-runtime-evidence/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-resume-smoke-evidence
          path: |
            production-runtime-evidence/*.log
            production-runtime-evidence/*.json
            production-runtime-evidence/*.zip
          if-no-files-found: error
          retention-days: 30

  staged-2000:
    name: Attempt 2k only after short tests pass
    if: (github.event_name == 'workflow_dispatch' && inputs.staged_scale) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-2k]'))
    needs: [production-build, independent-checks, parallel-runtime, diagnostic-runtime, checkpoint-smoke]
    uses: ./.github/workflows/production-staged-scale.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      expected_build: ${{ needs.production-build.outputs.runtime_build }}
      expected_source_commit: ${{ github.sha }}
      width: '2000'

  staged-5000:
    name: Attempt 5k only after 2k completes
    needs: [production-build, staged-2000]
    uses: ./.github/workflows/production-staged-scale.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      expected_build: ${{ needs.production-build.outputs.runtime_build }}
      expected_source_commit: ${{ github.sha }}
      width: '5000'

  status-report:
    name: Consolidated test report
    if: always()
    needs: [production-build, independent-checks, parallel-runtime, diagnostic-runtime, checkpoint-smoke, staged-2000, staged-5000]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect source-bound results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/test-status-report.py
      - uses: actions/upload-artifact@v4
        with:
          name: consolidated-test-status
          path: test-status-report/
          if-no-files-found: error
          retention-days: 30

  publish-500:
    name: Publish only the validated 500-block scope
    if: github.ref_name == 'work/forever-world-release-push' && ((github.event_name == 'workflow_dispatch' && inputs.publish_500 && !inputs.endurance) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-500]')))
    needs: [production-build, parallel-runtime, independent-checks, diagnostic-runtime, checkpoint-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          path: production-candidate
      - uses: actions/download-artifact@v4
        with:
          name: production-runtime-500
          path: production-runtime-evidence
      - name: Verify artifact and publish the limited scope
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUILD: ${{ needs.production-build.outputs.runtime_build }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/ci/publish-production-500.py

  production-acceptance:
    name: Certify the same immutable candidate at 5k and 20k
    if: github.event_name == 'workflow_dispatch' && inputs.endurance
    needs: production-build
    uses: ./.github/workflows/production-acceptance.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      expected_build: ${{ needs.production-build.outputs.runtime_build }}
      expected_source_commit: ${{ github.sha }}

  production-finalize:
    name: Publish only the candidate that passed the complete ladder
    needs: [production-build, production-acceptance]
    uses: ./.github/workflows/production-finalize.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      expected_build: ${{ needs.production-build.outputs.runtime_build }}
      expected_source_commit: ${{ github.sha }}

  production-release-gate:
    name: Production-scale release gate
    if: github.event_name == 'workflow_dispatch' && inputs.endurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classify release readiness
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f release/v1.0/READY ]]; then
            echo 'PRODUCTION_SCALE_HOLD: release/v1.0/READY is absent.'
            echo 'This is expected until the mature production engine and fresh-world 20k evidence exist.'
            exit 0
          fi

          test -f production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          test -f production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java
          test -f release/v1.0/PRODUCTION_ENGINE.properties
          test -f release-evidence/v1.0.properties

          grep -qx 'productionEngine=v253.125.54' release/v1.0/PRODUCTION_ENGINE.properties
          grep -qx 'sourceTreeSha256=b96e263e6cd74a4f8188e2b00b5dce2f6d8722c825174d98b6929b4c70e29d8f' release/v1.0/PRODUCTION_ENGINE.properties

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('release-evidence/v1.0.properties')
          props = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid evidence line: {raw!r}')
              key, value = line.split('=', 1)
              if key in props:
                  raise SystemExit(f'duplicate evidence key: {key}')
              props[key] = value

          required = {
              'releaseVerdict': 'PASS',
              'productionEngine': 'v253.125.54',
              'freshWorld': 'true',
              'targetBlocks': '20000',
              'targetChunks': '1562500',
              'maxHours': '8',
              'diagnosticVerdict': 'PASS',
              'exactBuild': 'true',
          }
          for key, expected in required.items():
              actual = props.get(key)
              if actual != expected:
                  raise SystemExit(f'{key}: expected {expected!r}, got {actual!r}')

          try:
              completed = float(props['completedHours'])
          except (KeyError, ValueError):
              raise SystemExit('completedHours must be numeric')
          if completed < 0 or completed > 8:
              raise SystemExit(f'completedHours exceeds overnight SLO: {completed}')

          jar_sha = props.get('jarSha256', '')
          if not re.fullmatch(r'[0-9a-f]{64}', jar_sha):
              raise SystemExit('jarSha256 must be a lowercase SHA-256 digest')

          print('PRODUCTION_SCALE_EVIDENCE_CONTRACT_PASS')
          PY

          echo 'PRODUCTION_SCALE_RELEASE_GATE_PASS'
