name: Ocean Canvas Production Scale Release Gate

on:
  push:
    branches:
      - release/v1-scale-engine-integration
      - work/forever-world-release-push
    paths:
      - 'production-src/**'
      - 'scripts/ci/production-runtime.py'
      - 'scripts/ci/test-production-candidate.py'
      - 'scripts/ci/test-pressure-wake.py'
      - 'scripts/windows/run-modrinth-local-test.cmd'
      - '.github/workflows/production-scale-release-gate.yml'
      - '.github/workflows/production-acceptance.yml'
      - '.github/workflows/production-finalize.yml'
      - 'scripts/ci/production-scale.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  production-build:
    name: Build mature production mod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      runtime_build: ${{ steps.candidate.outputs.runtime_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test candidate identity rejection cases
        run: python3 scripts/ci/test-production-candidate.py
      - name: Test actual pressure-repair wake transitions
        run: python3 scripts/ci/test-pressure-wake.py
      - name: Check local Windows launcher syntax
        shell: pwsh
        run: |
          $text = Get-Content scripts/windows/run-modrinth-local-test.cmd -Raw
          $tag = '# POWERSHELL_' + 'PAYLOAD'
          $body = $text.Substring($text.LastIndexOf($tag) + $tag.Length)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($body, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew build --warning-mode=fail
      - name: Resolve production build identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' production-src/gradle.properties)"
          runtime_build="$(sed -n 's/.*public static final String VERSION = "\(v[^"]*\)".*/\1/p' production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java)"
          test -n "$mod_version"
          test -n "$runtime_build"
          test "$mod_version" = "26.2-$runtime_build"
          jar="production-src/build/libs/oceancanvas-$mod_version.jar"
          test -f "$jar"
          printf 'jar=%s\n' "$jar" >> "$GITHUB_OUTPUT"
          printf 'runtime_build=%s\n' "$runtime_build" >> "$GITHUB_OUTPUT"
      - name: Bind candidate to exact artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-candidate
          cp scripts/windows/run-modrinth-local-test.cmd production-candidate/
          jar='${{ steps.candidate.outputs.jar }}'
          test -f "$jar"
          cp "$jar" production-candidate/
          sha256sum "$jar" > production-candidate/JAR-SHA256.txt
          printf 'sourceCommit=%s\nbuildRunId=%s\nruntimeBuild=%s\nreleaseStatus=HOLD\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" '${{ steps.candidate.outputs.runtime_build }}' > production-candidate/candidate.properties
      - uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-production-candidate
          path: production-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Test newly built candidate on a fresh 500-block server
        env:
          EXPECTED_BUILD: ${{ steps.candidate.outputs.runtime_build }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/ci/production-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-runtime-500
          path: production-runtime-evidence/
          if-no-files-found: ignore
          retention-days: 30

  production-acceptance:
    name: Certify the same immutable candidate at 5k and 20k
    needs: production-build
    uses: ./.github/workflows/production-acceptance.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      expected_build: ${{ needs.production-build.outputs.runtime_build }}
      expected_source_commit: ${{ github.sha }}

  production-finalize:
    name: Publish only the candidate that passed the complete ladder
    needs: [production-build, production-acceptance]
    uses: ./.github/workflows/production-finalize.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      expected_build: ${{ needs.production-build.outputs.runtime_build }}
      expected_source_commit: ${{ github.sha }}

  production-release-gate:
    name: Production-scale release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classify release readiness
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f release/v1.0/READY ]]; then
            echo 'PRODUCTION_SCALE_HOLD: release/v1.0/READY is absent.'
            echo 'This is expected until the mature production engine and fresh-world 20k evidence exist.'
            exit 0
          fi

          test -f production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          test -f production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java
          test -f release/v1.0/PRODUCTION_ENGINE.properties
          test -f release-evidence/v1.0.properties

          grep -qx 'productionEngine=v253.125.54' release/v1.0/PRODUCTION_ENGINE.properties
          grep -qx 'sourceTreeSha256=b96e263e6cd74a4f8188e2b00b5dce2f6d8722c825174d98b6929b4c70e29d8f' release/v1.0/PRODUCTION_ENGINE.properties

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('release-evidence/v1.0.properties')
          props = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid evidence line: {raw!r}')
              key, value = line.split('=', 1)
              if key in props:
                  raise SystemExit(f'duplicate evidence key: {key}')
              props[key] = value

          required = {
              'releaseVerdict': 'PASS',
              'productionEngine': 'v253.125.54',
              'freshWorld': 'true',
              'targetBlocks': '20000',
              'targetChunks': '1562500',
              'maxHours': '8',
              'diagnosticVerdict': 'PASS',
              'exactBuild': 'true',
          }
          for key, expected in required.items():
              actual = props.get(key)
              if actual != expected:
                  raise SystemExit(f'{key}: expected {expected!r}, got {actual!r}')

          try:
              completed = float(props['completedHours'])
          except (KeyError, ValueError):
              raise SystemExit('completedHours must be numeric')
          if completed < 0 or completed > 8:
              raise SystemExit(f'completedHours exceeds overnight SLO: {completed}')

          jar_sha = props.get('jarSha256', '')
          if not re.fullmatch(r'[0-9a-f]{64}', jar_sha):
              raise SystemExit('jarSha256 must be a lowercase SHA-256 digest')

          print('PRODUCTION_SCALE_EVIDENCE_CONTRACT_PASS')
          PY

          echo 'PRODUCTION_SCALE_RELEASE_GATE_PASS'
