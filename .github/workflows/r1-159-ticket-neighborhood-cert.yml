name: R1-159 ticket-neighborhood certification

on:
  push:
    branches:
      - work/r1-159-ticket-neighborhood-cert

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused R1-159 source change and deterministic regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s = p.read_text()

          helper_name = 'fastCertifyResidentPressureParkedInTicketNeighborhoods'
          helper = r'''
	/**
	 * R1-159: consume strict LIGHT_ONLY pressure debt from residency that is already
	 * owned by the bounded relight-ticket pool before scanning the generic dormant
	 * scheduler. A radius-1 relight ticket already pays for a 3x3 chunk neighborhood;
	 * using getChunkNow here recycles that residency without installing, widening, or
	 * force-loading any ticket. Every completion still requires the same strict
	 * current-field proof and centralized retirement used by the existing fast lane.
	 */
	private static int fastCertifyResidentPressureParkedInTicketNeighborhoods(ServerLevel world, int maxProofs) {
		if (world == null || maxProofs <= 0 || lightRecoverySession().pressureParkUntilTick.isEmpty()) return 0;
		if (net.oceancanvas.mod.lifecycle.OceanCanvasTerrainOperationActivity.outstandingPregenTargets() > 0) return 0;
		long[] ticketAnchors = lightFinalizerSession().relightResidencyLedger.activeSnapshot();
		if (ticketAnchors.length == 0) return 0;
		int attempted = 0, completed = 0, scanned = 0;
		int maxScans = Math.max(maxProofs, maxProofs * 9);
		it.unimi.dsi.fastutil.longs.LongOpenHashSet seen =
				new it.unimi.dsi.fastutil.longs.LongOpenHashSet(Math.min(maxScans, ticketAnchors.length * 9));
		outer:
		for (long anchor : ticketAnchors) {
			int ax = ChunkPos.getX(anchor), az = ChunkPos.getZ(anchor);
			for (int dx = -1; dx <= 1; dx++) {
				for (int dz = -1; dz <= 1; dz++) {
					if (attempted >= maxProofs || scanned >= maxScans) break outer;
					long packed = ChunkPos.pack(ax + dx, az + dz);
					if (!seen.add(packed)) continue;
					scanned++;
					long due = lightRecoverySession().pressureParkUntilTick.get(packed);
					if (due == OceanCanvasPrimitiveLongLongMap.ABSENT) continue;
					boolean physical = pregenSession().PREGEN_CRASH_RECOVERY_PHYSICAL_TRACKED.contains(packed);
					boolean trackedLightOnly = !physical
							&& pregenSession().PREGEN_CRASH_RECOVERY_LIGHT_ONLY_TRACKED.contains(packed);
					boolean genericLightOnly = !physical && !trackedLightOnly
							&& !lightFinalizerSession().allowPhysicalRepair.contains(packed)
							&& !pregenSession().PREGEN_TARGET_CHUNKS.contains(packed);
					if (!trackedLightOnly && !genericLightOnly) continue;
					LevelChunk live = world.getChunkSource().getChunkNow(ChunkPos.getX(packed), ChunkPos.getZ(packed));
					if (live == null) continue;
					attempted++;
					if (tryFastCertifyResidentCanvasLighting(
							world, live, false, Long.MAX_VALUE, "PRESSURE_PARK_TICKET_NEIGHBORHOOD")) {
						lightTelemetrySession().LIGHT_DIAG_PRESSURE_FAST_CERTIFIED.incrementAndGet();
						completed++;
					}
				}
			}
		}
		return completed;
	}
'''

          if helper_name not in s:
              marker = '\n\tprivate static int fastCertifyResidentPressureParked(ServerLevel world, int maxProofs) {'
              start = s.index(marker) + 1
              brace = s.index('{', start)
              depth = 0
              end = None
              in_str = False
              esc = False
              quote = ''
              for i in range(brace, len(s)):
                  c = s[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          in_str = False
                      continue
                  if c in ('"', "'"):
                      in_str = True
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('could not bound existing resident pressure certification method')
              s = s[:end] + '\n' + helper + s[end:]

          old_call = '''\t\tint fastCompleted = terrainCompleteForResidentProof && residentProofBudget > 0
\t\t\t\t? fastCertifyResidentPressureParked(world, residentProofBudget)
\t\t\t\t: 0;'''
          new_call = '''\t\tint fastCompleted = 0;
\t\tif (terrainCompleteForResidentProof && residentProofBudget > 0) {
\t\t\tfastCompleted = fastCertifyResidentPressureParkedInTicketNeighborhoods(world, residentProofBudget);
\t\t\tint remainingResidentProofBudget = Math.max(0, residentProofBudget - fastCompleted);
\t\t\tif (remainingResidentProofBudget > 0) {
\t\t\t\tfastCompleted += fastCertifyResidentPressureParked(world, remainingResidentProofBudget);
\t\t\t}
\t\t}'''
          if new_call not in s:
              if s.count(old_call) != 1:
                  raise SystemExit(f'expected one resident proof call site, found {s.count(old_call)}')
              s = s.replace(old_call, new_call, 1)

          p.write_text(s)

          # Deterministic source regression: this tranche may exploit only residency
          # already owned by the relight pool and must retain exact strict proof semantics.
          s = p.read_text()
          start = s.index('private static int ' + helper_name)
          brace = s.index('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          method = s[start:end]
          required = [
              'outstandingPregenTargets() > 0',
              'relightResidencyLedger.activeSnapshot()',
              'maxProofs * 9',
              'dx = -1; dx <= 1',
              'dz = -1; dz <= 1',
              'LongOpenHashSet',
              'pressureParkUntilTick.get(packed)',
              'getChunkNow',
              'tryFastCertifyResidentCanvasLighting',
              'PRESSURE_PARK_TICKET_NEIGHBORHOOD',
          ]
          for needle in required:
              if needle not in method:
                  raise SystemExit(f'missing R1-159 invariant: {needle}')
          forbidden = [
              'ensureLightRelightResidencyTicket',
              'addForcedTicket',
              'getChunk(',
              'getChunkFuture',
              'offerPressurePark',
              'offerGenericDormant',
          ]
          for needle in forbidden:
              if needle in method:
                  raise SystemExit(f'R1-159 illegally mutates/loads scheduler residency: {needle}')
          if 'fastCertifyResidentPressureParkedInTicketNeighborhoods(world, residentProofBudget)' not in s:
              raise SystemExit('R1-159 ticket-neighborhood lane is not wired ahead of generic resident scan')
          if 'fastCertifyResidentPressureParked(world, remainingResidentProofBudget)' not in s:
              raise SystemExit('R1-158 fallback lane was not preserved under remaining proof budget')
          if 'int residentProofBudget = Math.min(64, Math.max(0, maxLightOnlyWake * 16));' not in s:
              raise SystemExit('R1-156 64-proof ceiling changed unexpectedly')
          print('R1-159 deterministic source regression PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run production Java tests
        working-directory: production-src
        run: ./gradlew test --no-daemon --stacktrace

      - name: Commit exact tested product source
        shell: bash
        run: |
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java; then
            echo 'Exact R1-159 product source already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'R1-159: certify pressure debt from owned ticket neighborhoods'
          git push origin HEAD:work/r1-159-ticket-neighborhood-cert
