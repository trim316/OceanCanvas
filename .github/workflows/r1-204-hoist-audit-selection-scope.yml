name: R1-204 Hoist Audit Selection Scope
on:
  push:
    branches: [work/r1-204-hoist-audit-selection-scope]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-exact-product-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Require exact R1-204 product mutation
        run: python3 scripts/ci/test-r1-204-hoist-audit-selection-scope.py
      - name: Run existing authority and physical-audit regressions
        run: |
          python3 scripts/ci/test-operation-column-scope.py
          python3 scripts/ci/test-physical-audit-fastpath.py
      - name: Compile and test exact production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build test
      - name: Require read-only validation
        run: git diff --exit-code
