name: Ocean Canvas Recovery Core Proof

# Single authoritative automatic trigger for recovery/core-proof.

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/core-proof
      - 'work/**'
    paths:
      - 'runtime-src/**'
      - 'scripts/ci/run-recovery-one-chunk.ps1'
      - 'scripts/ci/cloud-recovery-audit.py'
      - 'scripts/ci/install-runtime-candidate-v2.ps1'
      - 'scripts/ci/recovery_candidate_identity.py'
      - 'scripts/ci/test-recovery-candidate-identity.py'
      - 'scripts/ci/hosted-minecraft-proof.py'
      - 'scripts/ci/disposable_world_guard.py'
      - 'scripts/ci/test-disposable-world-guard.py'
      - 'scripts/ci/test-hosted-controller-disposable-guards.py'
      - 'scripts/ci/hosted-*.py'
      - 'scripts/ci/hosted-two-chunk-proof.py'
      - 'scripts/ci/test-hosted-first-failure.py'
      - 'scripts/ci/test-world-identity-archive-isolation.py'
      - '.github/workflows/recovery-core-proof.yml'

permissions:
  contents: read

concurrency:
  # Serialize each candidate branch independently; a source push on one
  # work branch must not replace another branch's pending exact-head proof.
  # Manual recovery dispatch remains serialized with recovery/core-proof only.
  group: oceancanvas-recovery-core-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-proof:
    name: Core correctness before scale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prove cloud first-failure extraction
        run: |
          python3 -m py_compile scripts/ci/hosted-minecraft-proof.py
          python3 scripts/ci/test-hosted-first-failure.py

      - name: Prove R1-88 world-identity archive isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/test-world-identity-archive-isolation.py
          python3 scripts/ci/test-world-identity-archive-isolation.py

      - name: Prove R1-31/R1-71 pristine disposable-world preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/disposable_world_guard.py
          python3 -m py_compile scripts/ci/hosted-minecraft-proof.py
          python3 -m py_compile scripts/ci/test-disposable-world-guard.py
          python3 -m py_compile scripts/ci/test-hosted-controller-disposable-guards.py
          python3 scripts/ci/test-disposable-world-guard.py
          python3 scripts/ci/test-hosted-controller-disposable-guards.py

      - name: Parse guarded disposable two-chunk controller
        shell: bash
        run: |
          python3 -m py_compile scripts/ci/hosted-two-chunk-proof.py

      - name: Prove R1-49 immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/recovery_candidate_identity.py
          python3 -m py_compile scripts/ci/test-recovery-candidate-identity.py
          python3 scripts/ci/test-recovery-candidate-identity.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Assert recovery branch scope
        shell: bash
        run: |
          set -euo pipefail
          test -f RECOVERY_PROGRAM.md
          grep -q '1 chunk repeated -> 2 -> 4 -> 9 -> 16' RECOVERY_PROGRAM.md
          grep -q 'mod_version=26.2-core-v0.2.26-recovery.3' runtime-src/gradle.properties
          grep -q 'core-v0.2.26-recovery.3' runtime-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java
          grep -q 'ResidencyReacquirePolicy' runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          grep -q 'testResidencyReacquirePolicy' runtime-src/src/test/java/net/oceancanvas/core/CoreSelfTest.java
          grep -q 'testBlockStatePreimageStore' runtime-src/src/test/java/net/oceancanvas/core/CoreSelfTest.java
          grep -q 'PREIMAGE_CAPTURED' runtime-src/src/main/java/net/oceancanvas/core/pipeline/ChunkStage.java
          grep -q 'RESTORE_VERIFIED' runtime-src/src/main/java/net/oceancanvas/core/pipeline/ChunkStage.java
          grep -q 'preimageSha256' runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          grep -q 'RECOVERY_ONE_CHUNK_PASS' scripts/ci/run-recovery-one-chunk.ps1

      - name: Build and run core self-tests
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --warning-mode=fail

      - name: Run cloud recovery audit regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/cloud-recovery-audit.py

      - name: Assemble immutable recovery candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate
          python3 scripts/ci/recovery_candidate_identity.py assemble \
            --repo-root . \
            --candidate-dir candidate \
            --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID"
          python3 scripts/ci/recovery_candidate_identity.py verify \
            --repo-root . \
            --candidate-dir candidate \
            --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID"
          cat candidate/candidate.properties

      - name: Upload recovery candidate
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-recovery-3-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 30

      - name: Publish core status
        shell: bash
        run: |
          {
            echo '## Ocean Canvas recovery core proof'
            echo
            echo '- Scope: one-chunk correctness only'
            echo '- Scale runtime gates: frozen'
            echo '- Java/Fabric build: PASS'
            echo '- Core deterministic self-tests: PASS'
            echo '- Runtime candidate: 26.2-core-v0.2.26-recovery.3'
          } >> "$GITHUB_STEP_SUMMARY"

  recovery-control-preflight:
    name: Recovery runner PowerShell preflight
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse recovery control scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($target in @(
            'scripts/ci/run-recovery-one-chunk.ps1',
            'scripts/ci/install-runtime-candidate-v2.ps1'
          )){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $target),[ref]$tokens,[ref]$errors
            )
            if($errors.Count -gt 0){
              $errors | ForEach-Object { Write-Error "$target :: $($_.Message)" }
              throw "PowerShell parser preflight failed: $target"
            }
            Write-Host "PARSE PASS: $target"
          }

      - name: Enforce recovery-only invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $runner=Get-Content scripts/ci/run-recovery-one-chunk.ps1 -Raw
          foreach($needle in @(
            "ExpectedRuntime = '26.2-core-v0.2.26-recovery.3'",
            'expansionEnabled=false',
            'acceptanceHarnessEnabled=true',
            'PREIMAGE_CAPTURED',
            'RESTORE_COMPLETE',
            'RESTORE_VERIFIED',
            'RECOVERY_ONE_CHUNK_PASS',
            'Refusing further mutation',
            'Invoke-PermanentAuto'
          )){
            if(-not $runner.Contains($needle)){ throw "Missing recovery invariant: $needle" }
          }
          foreach($forbidden in @('G2','G4','G9','G16','Run-PermanentGate','Invoke-Watch')){
            if($runner.Contains($forbidden)){ throw "Scale/controller logic leaked into recovery runner: $forbidden" }
          }
          # The embedded here-string body is not AST-parsed as executable code.
          # Detect case-insensitive references to PowerShell's read-only $PID.
          if($runner -match '(?im)^\s*\$pid\s*='){
            throw 'Recovery close regression: assignment to reserved PowerShell $PID variable.'
          }
          $closeMatch=[regex]::Match($runner,'(?s)\$closeBody\s*=\s*@''(?<body>.*?)''@')
          if(-not $closeMatch.Success){ throw 'Missing embedded recovery close body.' }
          if($closeMatch.Groups['body'].Value -match '(?i)\$pid\b'){
            throw 'Recovery close regression: reserved PowerShell $PID reference inside close body.'
          }
          Write-Host 'RECOVERY SCOPE PASS: no scale gate logic present.'

  recovery-runtime:
    name: One-chunk Minecraft recovery proof (explicit disposable-world gate)
    # Pushes validate code in the cloud only. Manual dispatch explicitly opts in
    # to the designated runner after its isolated test profile is confirmed safe.
    if: github.event_name == 'workflow_dispatch'
    needs: [core-proof, recovery-control-preflight]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable recovery candidate
        uses: actions/download-artifact@v4
        with:
          name: oceancanvas-recovery-3-candidate
          path: candidate

      - name: Install recovery candidate transactionally
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ci\install-runtime-candidate-v2.ps1 -CandidateDir candidate

      - name: Prove one chunk through restart and restore
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ci\run-recovery-one-chunk.ps1 -ChunkX 32 -ChunkZ 32

      - name: Upload one-chunk recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-recovery-3-one-chunk-proof
          path: recovery-runtime-proof
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
