name: Ocean Canvas Disposable Immutable Pair Refusal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-two-chunk-identity-refusal.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-disposable-pair-refusal
  cancel-in-progress: false

jobs:
  immutable-pair-refusal:
    name: Refuse changed second target without altering completed chunk evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCEANCANVAS_TWO_CHUNK_SEED: '4182026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d084294bda1f951cf1ac6b781fbef4c7e29c9d3c
          persist-credentials: false

      - name: Prove exact negative-test candidate
        run: |
          test "$(git rev-parse HEAD)" = d084294bda1f951cf1ac6b781fbef4c7e29c9d3c
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Prove immutable pair rejects redirected target on fresh Minecraft restart
        run: |
          python3 -m py_compile scripts/ci/hosted-two-chunk-proof.py scripts/ci/hosted-two-chunk-identity-refusal.py
          python3 scripts/ci/hosted-two-chunk-identity-refusal.py

      - name: Preserve full baseline and negative-refusal proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-immutable-pair-refusal
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-two-chunk-proof/
            hosted-two-chunk-identity-refusal/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
