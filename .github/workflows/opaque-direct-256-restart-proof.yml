name: Opaque direct 256 restart durability A/B
on:
  push:
    branches: [work/perf-opaque-direct-restart-20261116]
    paths: ['.github/workflows/opaque-direct-256-restart-proof.yml', 'scripts/ci/full-canvas-restart-throughput-benchmark.py', 'runtime-src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, direct-section]
    env:
      OC_BENCH_NAME: opaque-direct-restart-${{ matrix.mode }}
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '256'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: "-Doceancanvas.flattenInflight=8 -Doceancanvas.experimentalDirectSectionAuthor=${{ matrix.mode == 'direct-section' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record isolated runtime and pinned main harness
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SHA=$(git rev-parse HEAD)
          HARNESS_SHA=$(git rev-parse origin/main)
          git archive "$HARNESS_SHA" scripts/ci | tar -x -C .
          git checkout "$RUNTIME_SHA" -- scripts/ci/full-canvas-restart-throughput-benchmark.py
          echo "$RUNTIME_SHA" > RUNTIME_SOURCE_SHA.txt
          echo "$HARNESS_SHA" > HARNESS_SOURCE_SHA.txt
          git diff --quiet "$RUNTIME_SHA" -- runtime-src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact candidate
        working-directory: runtime-src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
          sha256sum build/libs/*.jar > ../RUNTIME_JAR_SHA256.txt
      - name: Verify disposable 256-block restart and durable journals
        shell: bash
        run: python3 scripts/ci/full-canvas-restart-throughput-benchmark.py
      - name: Preserve full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opaque-direct-restart-${{ matrix.mode }}
          path: |
            RUNTIME_SOURCE_SHA.txt
            HARNESS_SOURCE_SHA.txt
            RUNTIME_JAR_SHA256.txt
            throughput-benchmark-opaque-direct-restart-${{ matrix.mode }}/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
