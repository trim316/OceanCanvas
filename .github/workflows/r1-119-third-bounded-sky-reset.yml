name: R1-119 Third Bounded SKY Reset

on:
  push:
    branches: [work/forever-world-release-push]
    paths:
      - '.github/workflows/r1-119-third-bounded-sky-reset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/forever-world-release-push
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply evidence-driven bounded recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()
          old='''// hard-reset SKY storage every eight failed proofs forever. Bound destructive\n\t// light-storage recovery to two attempts per physical epoch; after that, wait\n\t// passively for five seconds at a time until blocks change or C2ME converges.\n\tprivate static final int LIGHT_MAX_HARD_SKY_RESETS_PER_PHYSICAL_EPOCH = 2;'''
          new='''// hard-reset SKY storage every eight failed proofs forever. Bound destructive\n\t// light-storage recovery to three attempts per physical epoch. Build73 saved-world\n\t// evidence left one genuine PROPAGATION_OR_STORAGE_STALE graph after two resets;\n\t// the third attempt remains radius-1 and bounded, then debt still goes dormant.\n\tprivate static final int LIGHT_MAX_HARD_SKY_RESETS_PER_PHYSICAL_EPOCH = 3;'''
          if old not in s: raise SystemExit('reset-cap source block not found')
          p.write_text(s.replace(old,new,1))
          p=Path('production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java')
          s=p.read_text()
          if 'VERSION = "v253.125.73"' not in s: raise SystemExit('expected v73 identity not found')
          p.write_text(s.replace('VERSION = "v253.125.73"','VERSION = "v253.125.74"',1))
          p=Path('production-src/gradle.properties')
          s=p.read_text()
          if 'mod_version=26.2-v253.125.73' not in s: raise SystemExit('expected gradle v73 not found')
          p.write_text(s.replace('mod_version=26.2-v253.125.73','mod_version=26.2-v253.125.74',1))
          p=Path('production-src/src/main/resources/fabric.mod.json')
          s=p.read_text()
          if '26.2-v253.125.73' not in s: raise SystemExit('expected fabric v73 not found')
          p.write_text(s.replace('26.2-v253.125.73','26.2-v253.125.74'))
          PY
      - name: Build and test v253.125.74
        working-directory: production-src
        run: ./gradlew build --no-daemon
      - name: Commit tested recovery change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java production-src/gradle.properties production-src/src/main/resources/fabric.mod.json
          git commit -m 'Allow third bounded SKY reset from saved-world evidence [r1-119]'
          git push origin HEAD:work/forever-world-release-push
