name: Release Skylight Oracle Regression

on:
  push:
    branches:
      - work/release-skylight-oracle-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Run focused skylight oracle regression with project test classpath
        working-directory: production-src
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test --tests net.oceancanvas.mod.worldgen.OceanCanvasSkyPropagationOracleTest
