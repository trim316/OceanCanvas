name: R1-152 Resident Pressure Proof Drain

on:
  push:
    branches: [ work/r1-151-pressure-wake-microband ]

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply measured resident-proof drain repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()
          old='''\t\t// Activate due debt before a resident shortcut can consume/repostpone its\n\t\t// heap node. The ordinary cooperative finalizer remains the proof authority.\n\t\tint fastCompleted = 0;'''
          new='''\t\t// R1-152: exact R1-151 throughput evidence shows terrain submission is fully\n\t\t// complete while ~3.8k generic LIGHT_ONLY debts remain pressure-parked and\n\t\t// pressureFastCertified stays zero. Use the already-strict, loaded-only resident\n\t\t// proof lane before reactivation so valid parked debt can retire without\n\t\t// consuming another 449..512 controller cycle. Never run this shortcut while\n\t\t// terrain targets remain outstanding; the ordinary cooperative finalizer remains\n\t\t// authoritative for anything that does not pass the strict current-field proof.\n\t\tboolean terrainCompleteForResidentProof =\n\t\t\t\tnet.oceancanvas.mod.lifecycle.OceanCanvasTerrainOperationActivity.outstandingPregenTargets() == 0;\n\t\tint residentProofBudget = Math.min(4, Math.max(0, maxLightOnlyWake));\n\t\tint fastCompleted = terrainCompleteForResidentProof && residentProofBudget > 0\n\t\t\t\t? fastCertifyResidentPressureParked(world, residentProofBudget)\n\t\t\t\t: 0;'''
          if new in s:
              print('R1-152 product repair already present; validating exact head')
          elif s.count(old) == 1:
              p.write_text(s.replace(old,new))
          else:
              raise SystemExit(f'expected R1-151 source or exact R1-152 repair; old count={s.count(old)}')
      - name: Deterministic source regression
        shell: python
        run: |
          from pathlib import Path
          s=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java').read_text()
          assert 'terrainCompleteForResidentProof' in s
          assert 'fastCertifyResidentPressureParked(world, residentProofBudget)' in s
          assert 'residentProofBudget = Math.min(4, Math.max(0, maxLightOnlyWake))' in s
          assert 'LIGHT_FINALIZATION_BACKPRESSURE_RESUME_WATER + 8' in s
          assert 'LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER - 1' in s
          print('R1-152 source regression PASS')
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew --no-daemon clean test
      - name: Commit exact tested product source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          if git diff --cached --quiet; then
            echo 'No product source delta to commit'
            exit 0
          fi
          git commit -m 'R1-152: retire resident pressure debt before wake'
          git push origin HEAD:work/r1-151-pressure-wake-microband
