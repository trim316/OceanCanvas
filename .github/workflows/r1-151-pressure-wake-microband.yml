name: R1-153 Resident Proof Independent Budget

on:
  push:
    branches: [ work/r1-151-pressure-wake-microband ]

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply measured independent resident-proof budget repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()
          old='''\t\tint residentProofBudget = Math.min(4, Math.max(0, maxLightOnlyWake));\n\t\tint fastCompleted = terrainCompleteForResidentProof && residentProofBudget > 0\n\t\t\t\t? fastCertifyResidentPressureParked(world, residentProofBudget)\n\t\t\t\t: 0;'''
          new='''\t\t// R1-153: exact R1-152 throughput evidence shows the strict resident proof\n\t\t// still never executes (pressureFastCertified=0) because its budget was tied\n\t\t// to maxLightOnlyWake, which is intentionally zero while active pressure is\n\t\t// saturated. Proof retirement is not wake admission: after terrain completion\n\t\t// give the existing loaded-only strict proof its own tiny four-item budget.\n\t\tint residentProofBudget = terrainCompleteForResidentProof ? 4 : 0;\n\t\tint fastCompleted = residentProofBudget > 0\n\t\t\t\t? fastCertifyResidentPressureParked(world, residentProofBudget)\n\t\t\t\t: 0;'''
          if new in s:
              print('R1-153 product repair already present; validating exact head')
          elif s.count(old) == 1:
              p.write_text(s.replace(old,new))
          else:
              raise SystemExit(f'expected exact R1-152 source; old count={s.count(old)}')
      - name: Deterministic source regression
        shell: python
        run: |
          from pathlib import Path
          s=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java').read_text()
          assert 'terrainCompleteForResidentProof ? 4 : 0' in s
          assert 'Math.min(4, Math.max(0, maxLightOnlyWake))' not in s
          assert 'fastCertifyResidentPressureParked(world, residentProofBudget)' in s
          assert 'LIGHT_FINALIZATION_BACKPRESSURE_RESUME_WATER + 8' in s
          assert 'LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER - 1' in s
          print('R1-153 source regression PASS')
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew --no-daemon clean test
      - name: Commit exact tested product source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          if git diff --cached --quiet; then
            echo 'No product source delta to commit'
            exit 0
          fi
          git commit -m 'R1-153: decouple resident proof from wake admission'
          git push origin HEAD:work/r1-151-pressure-wake-microband
