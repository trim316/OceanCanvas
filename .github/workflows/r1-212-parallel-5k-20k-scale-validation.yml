name: R1-212 Parallel Exact v80 5k and 20k Scale Validation

on:
  push:
    branches:
      - work/r1-212-parallel-5k-20k-scale-validation
    paths:
      - '.github/workflows/r1-212-parallel-5k-20k-scale-validation.yml'
  workflow_dispatch:
    inputs:
      width:
        description: Exact incomplete scale campaign to resume
        required: true
        type: choice
        options:
          - '5000'
          - '20000'
      checkpoint_run_id:
        description: Run containing the exact prior checkpoint artifact
        required: true
        type: string
      checkpoint_artifact:
        description: Exact prior checkpoint artifact name
        required: true
        type: string
      segment_label:
        description: Output checkpoint suffix, for example s2
        required: true
        type: string

env:
  CANDIDATE_SOURCE: 9d6048f356f981e670556b2d07e5adec7147fe57
  EXPECTED_BUILD: v253.125.80
  CANDIDATE_RUN_ID: '39032710433'

permissions:
  contents: read
  actions: read

jobs:
  fresh-parallel-scale:
    name: Fresh exact v80 ${{ matrix.width }}-block checkpointed campaign
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        width: ['5000', '20000']
    steps:
      - name: Checkout immutable production candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-source
      - name: Checkout current validation harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: candidate-source/.runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - name: Download retained immutable v253.125.80 candidate
        uses: actions/download-artifact@v4
        with:
          name: r1-210-retained-v80-candidate
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: candidate-source/production-candidate
      - name: Overlay validation harness only; never rebuild product
        shell: bash
        run: |
          set -euo pipefail
          for f in production-scale.py production-acceptance.py runtime_support.py runtime_stall.py candidate_verifier.py scale_evidence.py scale_geometry.py checkpoint_bundle.py; do
            cp "harness/scripts/ci/$f" "candidate-source/scripts/ci/$f"
          done
      - name: Run exact fresh scale campaign with fail-safe checkpointing
        working-directory: candidate-source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.CANDIDATE_SOURCE }}
          OC_TEST_WIDTH: ${{ matrix.width }}
          OC_STAGE_SECONDS: ${{ matrix.width == '5000' && '9600' || '19800' }}
          OC_CHECKPOINT_SEGMENT: 'true'
        run: python3 scripts/ci/production-scale.py
      - name: Upload exact stopped world and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-212-v80-scale-${{ matrix.width }}-checkpoint-s1
          path: candidate-source/production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  resume-one-scale:
    name: Resume exact v80 ${{ inputs.width }}-block checkpoint only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout immutable production candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-source
      - name: Checkout current validation harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: candidate-source/.runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - name: Download retained immutable v253.125.80 candidate
        uses: actions/download-artifact@v4
        with:
          name: r1-210-retained-v80-candidate
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: candidate-source/production-candidate
      - name: Restore only the requested exact checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_artifact }}
          run-id: ${{ inputs.checkpoint_run_id }}
          github-token: ${{ github.token }}
          path: candidate-source/production-runtime-evidence
      - name: Overlay validation harness only; never rebuild product
        shell: bash
        run: |
          set -euo pipefail
          for f in production-scale.py production-acceptance.py runtime_support.py runtime_stall.py candidate_verifier.py scale_evidence.py scale_geometry.py checkpoint_bundle.py; do
            cp "harness/scripts/ci/$f" "candidate-source/scripts/ci/$f"
          done
      - name: Resume exact saved world; fail closed on identity mismatch
        working-directory: candidate-source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.CANDIDATE_SOURCE }}
          OC_TEST_WIDTH: ${{ inputs.width }}
          OC_STAGE_SECONDS: ${{ inputs.width == '5000' && '9600' || '19800' }}
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_REQUIRE_CHECKPOINT_MANIFEST: 'true'
          OC_RESUME: 'true'
        run: python3 scripts/ci/production-scale.py
      - name: Upload only the resumed exact world and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-212-v80-scale-${{ inputs.width }}-checkpoint-${{ inputs.segment_label }}
          path: candidate-source/production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
