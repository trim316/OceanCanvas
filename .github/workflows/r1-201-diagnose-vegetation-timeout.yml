name: R1-201 Diagnose Vegetation Timeout

on:
  push:
    branches:
      - work/r1-201-diagnose-vegetation-timeout

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact failed evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2d055fdf00d4b6b2fb80c708bbbac49a851b652b"
          test "$(git diff --name-only HEAD^ HEAD -- production-src | wc -l)" -eq 0
      - name: Download exact failed artifact
        uses: actions/download-artifact@v4
        with:
          name: r1-138-ocean-vegetation-1k-38643783627
          path: evidence
          github-token: ${{ github.token }}
          repository: trim316/OceanCanvas
          run-id: 38643783627
      - name: Attribute first failure without mutating evidence
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f -printf '%s %p\n' | sort -nr | head -80 | tee evidence-files.txt
          find evidence -type f \( -name '*.log' -o -name '*.txt' -o -name '*.json' -o -name '*.properties' \) -print0 |
            xargs -0 -r grep -Ein -m 8 'timeout|timed out|exception|error|failed|FAIL|lightingPending|pressureParked|lastTerrainSubmitted|terrain|vegetation|kelp|seagrass|watchdog|stalled|progress' 2>/dev/null |
            tail -1200 > attribution.txt || true
          tail -400 attribution.txt
          test -s attribution.txt
      - name: Preserve compact attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-201-vegetation-timeout-attribution-${{ github.run_id }}
          path: |
            evidence-files.txt
            attribution.txt
          retention-days: 30
