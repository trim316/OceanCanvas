name: Diagnostic 20k failed S4 exact v87 with complete runtime inventory
on:
  push:
    branches: [work/v87-20k-s4-copy-proof]
    paths: ['.github/workflows/diagnostic-20k-s4-exact-v87.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-20k-s4-exact-v87
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate]
    env:
      PROFILE_MODE: ${{ matrix.mode }}
    steps:
      - name: Refuse blind rerun
        run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Profile immutable failed checkpoint copy at original 14 GiB heap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/profile_20k_s4_exact_v87.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-20k-s4-exact-v87-${{ matrix.mode }}-14g
          path: profile-${{ matrix.mode }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
