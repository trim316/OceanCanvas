name: Group durability throughput prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/group-durability-throughput-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OC_BENCH_NAME: no-per-chunk-global-save
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '128'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/perf-group-durability
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'

      - name: Build experimental runtime
        working-directory: runtime-src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Fetch benchmark harness from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: benchmark-harness
          persist-credentials: false

      - name: Install benchmark harness alongside experimental runtime
        shell: bash
        run: |
          test -f benchmark-harness/scripts/ci/full-canvas-throughput-benchmark.py
          test -f benchmark-harness/scripts/ci/hosted-full-canvas-command-proof.py
          mkdir -p scripts/ci
          cp -a benchmark-harness/scripts/ci/. scripts/ci/

      - name: Run disposable benchmark
        shell: bash
        run: python3 scripts/ci/full-canvas-throughput-benchmark.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-durability-throughput-prototype
          path: |
            throughput-benchmark-no-per-chunk-global-save/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
