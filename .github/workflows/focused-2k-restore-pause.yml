name: Focused 2k restore pause controller regression
on:
  push:
    branches: [work/restore-paused-fail-closed-20261121]
    paths:
      - 'scripts/ci/current-2k-radius-controller.py'
      - 'scripts/ci/test_current_2k_restore_pause.py'
      - '.github/workflows/focused-2k-restore-pause.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/current-2k-radius-controller.py'
      - 'scripts/ci/test_current_2k_restore_pause.py'
      - '.github/workflows/focused-2k-restore-pause.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-minecraft-controller-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test actual controller restore function without Minecraft or Gradle
        run: python3 -m unittest discover -s scripts/ci -p 'test_current_2k_restore_pause.py' -v
