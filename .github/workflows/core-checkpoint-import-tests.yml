name: Core checkpoint import regression
on:
  push:
    branches: [work/core-1k-checkpoint-import]
    paths: ['scripts/ci/import_core_checkpoint.py', 'scripts/ci/test_core_checkpoint_import.py', 'scripts/ci/hosted-1k-checkpointed-live.py', '.github/workflows/core-checkpoint-import-tests.yml']
  pull_request:
    paths: ['scripts/ci/import_core_checkpoint.py', 'scripts/ci/test_core_checkpoint_import.py']
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/test_core_checkpoint_import.py
      - run: python scripts/ci/test-core-runtime-retention.py
  actual-parent-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCEANCANVAS_PRODUCT_SOURCE: 666a4def8e43abaae287f71753c34c5eb2a81fad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare build classpath without launching Minecraft
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build --warning-mode=fail
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-2
          run-id: '39355868620'
          github-token: ${{ github.token }}
          path: parent-core-checkpoint
      - name: Verify actual parent import and exact Java/runtime binding, no server launch
        run: |
          python3 scripts/ci/import_core_checkpoint.py --parent parent-core-checkpoint --workspace . --identity-file scripts/ci/core1k-parent50-identity.json --started '2026-10-20T01:54:02.811423+00:00'
          python3 scripts/ci/hosted-1k-checkpointed-live.py bind 2
