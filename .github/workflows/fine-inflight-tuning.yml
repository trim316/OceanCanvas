name: Fine-grained inflight tuning

on:
  push:
    branches:
      - work/perf-dedup-batched-durability-20261111
    paths:
      - '.github/workflows/fine-inflight-tuning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fine-inflight-tuning
  cancel-in-progress: true

jobs:
  benchmark:
    name: inflight-${{ matrix.window }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        window: [10, 12, 14]
    env:
      OC_BENCH_NAME: fine-inflight-${{ matrix.window }}
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '128'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: '-Doceancanvas.flattenInflight=${{ matrix.window }} -Doceancanvas.persistBatch=${{ matrix.window }} -Doceancanvas.persistBatchMaxWaitTicks=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Build candidate
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
      - name: Run corrected benchmark
        run: python3 scripts/ci/full-canvas-throughput-benchmark.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fine-inflight-${{ matrix.window }}
          path: |
            throughput-benchmark-fine-inflight-${{ matrix.window }}/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
