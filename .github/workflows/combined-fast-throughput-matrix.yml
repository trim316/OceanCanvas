name: Combined fast-path throughput matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combined-fast-throughput-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: inflight-${{ matrix.window }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        window: [2, 4, 8]
    env:
      OC_BENCH_NAME: combined-inflight-${{ matrix.window }}
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '128'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: '-Doceancanvas.flattenInflight=${{ matrix.window }}'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/perf-combined-fast
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'

      - name: Build experimental runtime
        working-directory: runtime-src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Run disposable benchmark
        shell: bash
        run: python3 scripts/ci/full-canvas-throughput-benchmark.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-fast-inflight-${{ matrix.window }}
          path: |
            throughput-benchmark-combined-inflight-${{ matrix.window }}/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
