name: v139 scoped native mix and operator receipt cold proof
on:
  push:
    branches: [work/v139-scoped-cell-receipt-proof]
    paths: ['.github/workflows/v139-cell-receipt-proof.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  receipt-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_BUILD: v253.125.139
      EXPECTED_SOURCE_COMMIT: fb84e2d10722ccb30ea2f67f192678dc81c76bc4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime and collector
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
          java -Xms512M -Xmx3G -XX:+UseZGC -XX:+PrintFlagsFinal -version > zgc-flags.txt 2>&1
          grep -E 'UseZGC.*= true ' zgc-flags.txt
      - name: Build changed source and compile native integration addon
        run: |
          set -euo pipefail
          chmod +x production-src/gradlew
          (cd production-src && ./gradlew build --console=plain) 2>&1 | tee production-build.log
          (cd production-src && ./gradlew -I ../scripts/ci/fixtures/cell-receipts/build.init.gradle cellReceiptFixtureJar --console=plain)
          python3 scripts/ci/prepare_cell_receipt_candidate.py
      - name: Install native NBT oracle dependency
        run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Reuse existing verified R1 saved world for new receipt path only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41124777587
          name: physical-radius-1k-v138-r1-candidate
          path: verified-cell-receipt-parent
      - name: Exercise native receipt plus explicit operator receipt and addon-free cold reproof
        run: python3 scripts/ci/cell-receipt-cold-fixture.py
      - name: Preserve full fixture regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v139-cell-receipt-native-proof
          path: |
            cell-receipt-fixture-evidence/
            production-candidate/
            production-build.log
            java-identity.txt
            zgc-flags.txt
            production-src/build/test-results/test/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
