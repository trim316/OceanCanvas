          PY
      - name: Compile actual production APIs without starting Minecraft
        working-directory: production-src
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2G" 2>&1 | tee ../draft-compile.log
      - name: Run isolated policy regressions and actual saved graph replay
        run: |
          java -cp production-src/build/classes/java/main net.oceancanvas.mod.worldgen.UnsupportedSkyRepairPolicy
          javac -cp production-src/build/classes/java/main -d replay-classes SavedSkyRepairReplay.java
          java -cp production-src/build/classes/java/main:replay-classes net.oceancanvas.mod.worldgen.SavedSkyRepairReplay repair-replay.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsupported-sky-draft-compile
          path: |
            draft-compile.log
            production-src/src/main/java/net/oceancanvas/mod/worldgen/UnsupportedSkyRepairPolicy.java
            production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
