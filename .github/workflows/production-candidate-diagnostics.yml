name: Ocean Canvas Test Existing Candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Existing immutable candidate artifact run; no rebuild
        required: true
        type: string
      source_commit:
        description: Exact source recorded in candidate.properties
        required: true
        type: string
      build:
        description: Runtime build recorded in candidate.properties
        required: true
        type: string
      cases:
        description: 'JSON case names; choose only the cases needing investigation'
        default: '["controlled-waterfall-inflow","building-water-persistence","throughput-profile","checkpoint-resume"]'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pinned-diagnostics-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cases:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          REQUESTED_CASES: ${{ inputs.cases }}
        run: python3 scripts/ci/diagnostic_cases.py
  runtime:
    needs: cases
    name: Pinned candidate / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: production-candidate
      - name: Run selected proof on the pinned artifact with current harness
        env:
          EXPECTED_BUILD: ${{ inputs.build }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          OC_TEST_WIDTH: ${{ matrix.case.width }}
          OC_CENTER_X: ${{ matrix.case.x }}
          OC_CENTER_Z: ${{ matrix.case.z }}
          OC_PROFILE: ${{ matrix.case.profile }}
          OC_WATERFALL_FIXTURE: ${{ matrix.case.fixture }}
          OC_NATURAL_BORDER: ${{ matrix.case.border }}
          OC_GAMEPLAY_FIXTURE: ${{ matrix.case.gameplay }}
          OC_STAGE_SECONDS: ${{ matrix.case.seconds }}
          CASE_NAME: ${{ matrix.case.name }}
        run: |
          if [ "$CASE_NAME" = checkpoint-resume ]; then
            python3 scripts/ci/test-checkpoint-runtime.py
          else
            python3 scripts/ci/production-runtime.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-${{ matrix.case.name }}
          path: production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
