name: Dedup batched durability restart proof

on:
  push:
    branches:
      - work/perf-dedup-batched-durability-20261111
    paths:
      - 'runtime-src/**'
      - 'scripts/ci/full-canvas-restart-throughput-benchmark.py'
      - '.github/workflows/dedup-batched-restart-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dedup-batched-restart
  cancel-in-progress: true

jobs:
  restart-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OC_BENCH_NAME: dedup-batched-256-restart
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '256'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: '-Doceancanvas.flattenInflight=8 -Doceancanvas.persistBatch=8 -Doceancanvas.persistBatchMaxWaitTicks=2'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Build candidate
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
      - name: Run restart proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/full-canvas-restart-throughput-benchmark.py
          python3 scripts/ci/full-canvas-restart-throughput-benchmark.py
      - name: Upload restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedup-batched-256-restart
          path: |
            throughput-benchmark-dedup-batched-256-restart/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
