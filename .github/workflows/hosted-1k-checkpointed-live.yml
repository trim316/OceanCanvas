name: Ocean Canvas Checkpointed Live 1k Integrated Proof

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ci/hosted-1k-checkpointed-live.py'
      - '.github/workflows/hosted-1k-checkpointed-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oceancanvas-checkpointed-live-1k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    name: 1k live progress + resumable checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OCEANCANVAS_1K_SEED: '4182042'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact current candidate
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Bind candidate and actual development runtime before generation
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py bind 0
      - name: Preserve immutable runtime context before generation
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-runtime-context
          path: hosted-1k-checkpointed-live/runtime-context-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Flatten to 25% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py flatten 25 1
      - name: Preserve checkpoint 1
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-1
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Flatten to 50% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py flatten 50 2
      - name: Preserve checkpoint 2
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-2
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Flatten to 75% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py flatten 75 3
      - name: Preserve checkpoint 3
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-3
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Flatten to 100% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py flatten 100 4
      - name: Preserve checkpoint 4
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-4
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Structures and deep health checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py postflat 5
      - name: Preserve checkpoint 5
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-5
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Restore to 25% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py restore 25 6
      - name: Preserve checkpoint 6
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-6
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Restore to 50% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py restore 50 7
      - name: Preserve checkpoint 7
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-7
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Restore to 75% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py restore 75 8
      - name: Preserve checkpoint 8
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-8
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Restore to 100% checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py restore 100 9
      - name: Preserve checkpoint 9
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-9
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Final cold-restart checkpoint
        run: python3 scripts/ci/hosted-1k-checkpointed-live.py final 10
      - name: Preserve final checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-1k-checkpoint-final
          path: checkpoint-1k-evidence/
          if-no-files-found: error
          retention-days: 14
