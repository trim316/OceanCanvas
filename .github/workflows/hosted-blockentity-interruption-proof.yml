name: Ocean Canvas Disposable Block-Entity Interruption Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-blockentity-interruption-proof.yml'

permissions:
  contents: read

jobs:
  interrupted-recovery:
    name: Kill after durable BE preimage, resume, restore and cold reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCEANCANVAS_BLOCKENTITY_INTERRUPT_AFTER: 'PREIMAGE_CAPTURED'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b73688c0f3e59f0f452f18959b86132237db547c
          persist-credentials: false
      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = b73688c0f3e59f0f452f18959b86132237db547c
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
      - name: Prove process-kill recovery and immutable cold reopen
        run: |
          python3 -m py_compile scripts/ci/hosted-blockentity-interruption-proof.py
          python3 scripts/ci/hosted-blockentity-interruption-proof.py
      - name: Preserve exact crash and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-blockentity-interruption-proof
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-blockentity-interruption-proof/
            runtime-src/run/world/oceancanvas-core/single-chunk/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
