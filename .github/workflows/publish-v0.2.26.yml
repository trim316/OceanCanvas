name: Publish OceanCanvas v0.2.26

on:
  push:
    branches:
      - main
    paths:
      - 'release/v0.2.26/**'
      - '.github/workflows/publish-v0.2.26.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oceancanvas-v0.2.26-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish v0.2.26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build exact release JAR
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --warning-mode=fail

      - name: Verify release artifact against captured proof
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          attest='release-evidence/v0.2.26.properties'
          test -f "$attest"
          runtime="$(awk -F= '$1=="runtime"{print substr($0,index($0,"=")+1)}' "$attest")"
          expected="$(awk -F= '$1=="jarSha256"{print substr($0,index($0,"=")+1)}' "$attest")"
          verdict="$(awk -F= '$1=="verdict"{print substr($0,index($0,"=")+1)}' "$attest")"
          final_restart="$(awk -F= '$1=="finalRestartVerified"{print substr($0,index($0,"=")+1)}' "$attest")"
          restore="$(awk -F= '$1=="restoreVerified"{print substr($0,index($0,"=")+1)}' "$attest")"
          restarts="$(awk -F= '$1=="verifiedRestarts"{print substr($0,index($0,"=")+1)}' "$attest")"

          test "$runtime" = '26.2-core-v0.2.26'
          test "$verdict" = 'PASS'
          test "$final_restart" = 'true'
          test "$restore" = 'true'
          test "$restarts" -ge 7

          jar="$(find runtime-src/build/libs -maxdepth 1 -type f -name 'oceancanvas-core-26.2-core-v0.2.26.jar' -print -quit)"
          test -n "$jar"
          actual="$(sha256sum "$jar" | awk '{print $1}')"
          test "$actual" = "$expected"

          mkdir -p release/v0.2.26/dist
          cp "$jar" release/v0.2.26/dist/
          printf '%s  %s\n' "$actual" "$(basename "$jar")" > release/v0.2.26/dist/SHA256SUMS.txt

          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ARTIFACT_VERIFIED runtime=$runtime sha256=$actual verifiedRestarts=$restarts"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.2.26'
          notes='release/v0.2.26/RELEASE_NOTES.md'
          jar='release/v0.2.26/dist/oceancanvas-core-26.2-core-v0.2.26.jar'
          sums='release/v0.2.26/dist/SHA256SUMS.txt'

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; verifying/uploading assets."
            gh release upload "$tag" "$jar" "$sums" --clobber
          else
            gh release create "$tag" "$jar" "$sums" \
              --target "$GITHUB_SHA" \
              --title 'OceanCanvas v0.2.26' \
              --notes-file "$notes"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.2.26 --json tagName,name,isDraft,isPrerelease,assets
