name: R1-150 Pressure Wake High-Water Headroom
on:
  push:
    branches: [work/r1-150-pressure-wake-high-water-headroom]
permissions:
  contents: write
jobs:
  validate-and-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-150-pressure-wake-high-water-headroom
      - name: Verify focused R1-150 implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java').read_text()
          assert 'LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER - pendingPressureWork' in s
          assert 'LIGHT_FINALIZATION_BACKPRESSURE_RESUME_WATER - pendingPressureWork' not in s
          assert 'parkExcessGenericLightOnlyForPressure(world, LIGHT_FINALIZATION_BACKPRESSURE_RESUME_WATER' in s
          assert 'private static final int LIGHT_FINALIZATION_BACKPRESSURE_HIGH_WATER = 512;' in s
          assert 'private static final int LIGHT_FINALIZATION_BACKPRESSURE_RESUME_WATER = 449;' in s
          assert 'while (woken < globalHeadroom' in s
          print('R1-150 regression PASS')
          PY
      - name: Bind branch to unchanged production scale workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-scale-release-gate.yml')
          s=p.read_text()
          branch='      - work/r1-150-pressure-wake-high-water-headroom\n'
          if branch not in s:
              anchor='      - work/forever-world-release-push\n'
              if s.count(anchor) != 1:
                  raise SystemExit('production gate branch anchor changed')
              s=s.replace(anchor, anchor+branch)
              p.write_text(s)
          print('R1-150 exact-throughput branch binding present')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test production source
        working-directory: production-src
        run: ./gradlew --no-daemon test
      - name: Commit validated workflow binding only
        run: |
          if git diff --quiet; then echo 'Exact production gate binding already present'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-scale-release-gate.yml
          git commit -m 'CI: enable exact R1-150 production throughput proof'
          git push origin HEAD:work/r1-150-pressure-wake-high-water-headroom
