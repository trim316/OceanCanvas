name: Specific155 preserved-whole authority collision
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 41fd20b724545b82e9a2e8618015e06b4c6bdce7
      EXPECTED_BUILD: v253.125.156
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local156 candidate and354XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('scripts/ci/frozen/light156-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='c4866062c9265d75984e52fb7e84b9a8a462d09d4ab08275b0a2694b1d3abd00'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          p=Path('scripts/ci/frozen/recovery155-stage-probe-v2-fixture.jar')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='ce2980e088f75eb5538797c6ae63aac108f41c6e669e50aedf2bc18c8a22b971'
          PY
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore latest failed154 fixture with all original bytes retained
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41873761436
          name: recovery155-stage-diagnostic
          path: verified-recovery156-parent
      - name: Actual155 fail-closed protection collision replay
        run: python3 scripts/ci/recovery156.py
      - name: Preserve full original and corrected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery156-proof
          path: |
            recovery156-evidence/
            production-candidate/
            scripts/ci/recovery156-parent.json
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
