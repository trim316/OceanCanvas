name: Frozen159 radius2k checkpointed acceptance
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-2k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 8519872c5f34c5256a25a7b6d7685949beccbc59
      EXPECTED_BUILD: v253.125.159
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local159 candidate and362XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          import json
          root=Path('scripts/ci/frozen'); manifest=json.loads((root/'light159-local-candidate.parts.json').read_text()); pieces=[]
          for item in manifest['parts']:
              b=(root/item['name']).read_bytes(); assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']; pieces.append(b)
          data=b''.join(pieces); assert len(data)==manifest['bytes'] and hashlib.sha256(data).hexdigest()==manifest['wholeSha256']; (root/'light159-local-candidate.zip').write_bytes(data)
          p=Path('scripts/ci/frozen/light159-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='e3fa68a88c328c57095956ffe0570f0b787712839322176971540add1d2252ed'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          p=Path('scripts/ci/frozen/recovery158-publication-probe-v4-fixture.jar')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='71ae47d92ac782696fbbf678292927a0229a60860555ab9ef9f5f5b060bdb290'
          PY
      - name: Validate optional timing and exact radius geometry
        run: |
          python3 scripts/ci/test-scale-evidence.py
          python3 scripts/ci/test-scale-geometry.py
      - name: Run strict radius2k checkpoint segment
        env:
          OC_TEST_WIDTH: '4000'
          OC_STAGE_SECONDS: '900'
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_TIMING_OPTIONAL: 'true'
          OC_EVIDENCE_DIR: physical-radius-2k-evidence
        run: python3 scripts/ci/production-scale.py
      - name: Preserve full checkpoint and frozen identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-radius-2k-v159
          path: |
            physical-radius-2k-evidence/
            production-candidate/
            production-src/build/test-results/test/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
