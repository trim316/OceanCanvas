name: Specific155 preserved-whole authority collision
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 01c838d375281e09aa035579afc60993707742df
      EXPECTED_BUILD: v253.125.155
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local155 candidate and352XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('scripts/ci/frozen/light155-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='891747e9d222bee706182010943391cb2e4296e404f0a11c9b36db35d040f98f'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          p=Path('scripts/ci/frozen/absolute155-whole-s2-fixture.jar')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='2d5ff996adf95a609d5300ac4bcb71b85e4807134a3bc66aa0668645b85e986e'
          PY
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore latest failed154 fixture with all original bytes retained
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41853238642
          name: absolute155-whole-proof
          path: verified-absolute155-whole-s2-parent
      - name: Actual155 fail-closed protection collision replay
        run: python3 scripts/ci/absolute155-whole-s2.py
      - name: Preserve full original and corrected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absolute155-whole-s2-proof
          path: |
            absolute155-whole-s2-evidence/
            production-candidate/
            scripts/ci/absolute155-whole-s2-parent.json
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
