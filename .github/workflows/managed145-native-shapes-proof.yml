name: Changed145 native shipwreck fence geometry and loot conservation and cold proof
on:
  push:
    branches: [work/managed145-native-shapes-proof]
    paths: ['.github/workflows/managed145-native-shapes-proof.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: d2b0a669bb5cf78e5cac76a7d14bcf2d29438aa5
      EXPECTED_BUILD: v253.125.145
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Build changed145 candidate and direct native-neighbor and container regressions
        run: |
          set -euo pipefail
          chmod +x production-src/gradlew
          (cd production-src && ./gradlew build --console=plain) 2>&1 | tee production-build.log
          python3 scripts/ci/prepare_physical_ladder_candidate145.py
      - name: Compile only test observer against exact candidate
        env:
          OC_MANAGED_CANDIDATE_JAR: ${{ github.workspace }}/production-candidate/oceancanvas-26.2-v253.125.145.jar
        run: (cd production-src && ./gradlew -I ../scripts/ci/fixtures/managed-shipwreck/build.init.gradle managedShipwreckFixtureJar --console=plain)
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore immutable existing pre-authoring fixture input for CHANGED native neighbor-shape fix
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41156473165
          name: v139-cell-receipt-cold-proof
          path: verified-managed-parent
      - name: Real generated-before relocation then addonfree cold conservation evidence
        run: python3 scripts/ci/managed-shipwreck-cold-fixture.py
      - name: Preserve full original and corrected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed145-native-shapes-proof
          path: |
            managed-shipwreck-evidence/
            production-candidate/
            scripts/ci/managed-v139-parent.json
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
