name: Specific155 preserved-whole authority collision
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: ad3c62d1acc87dfb8a23302a9545e9e463f9c096
      EXPECTED_BUILD: v253.125.156
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local158 candidate and359XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          import json
          root=Path('scripts/ci/frozen'); manifest=json.loads((root/'light158-local-candidate.parts.json').read_text()); pieces=[]
          for item in manifest['parts']:
              b=(root/item['name']).read_bytes(); assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']; pieces.append(b)
          data=b''.join(pieces); assert len(data)==manifest['bytes'] and hashlib.sha256(data).hexdigest()==manifest['wholeSha256']; (root/'light158-local-candidate.zip').write_bytes(data)
          p=Path('scripts/ci/frozen/light158-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='246b07823759713a2bd6e93d2feabef4c70f4e13c97561ba322de59543762e90'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          p=Path('scripts/ci/frozen/recovery158-publication-probe-fixture.jar')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='5ae20c8aea7aee7c3b0190de15037d7b1c7115f09cdb19eed5097810cf459dc7'
          PY
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore exact latest failed156 snapshot with all bytes retained
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41927337691
          name: recovery158-proof
          path: verified-publication158-parent
      - name: Read-only158 native publication attribution diagnostic
        run: python3 scripts/ci/publication158.py
      - name: Preserve full original and corrected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication158-proof
          path: |
            publication158-evidence/
            production-candidate/
            scripts/ci/publication158-parent.json
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
