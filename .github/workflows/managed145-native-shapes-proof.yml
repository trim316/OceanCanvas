name: Frozen160 native read attribution with exact center exemption
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-2k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: d9fa1d4b5e67f76771231cb32647edc84b1d7989
      EXPECTED_BUILD: v253.125.160
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local160 candidate and365XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          import json
          root=Path('scripts/ci/frozen'); manifest=json.loads((root/'light160-local-candidate.parts.json').read_text()); pieces=[]
          for item in manifest['parts']:
              b=(root/item['name']).read_bytes(); assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']; pieces.append(b)
          data=b''.join(pieces); assert len(data)==manifest['bytes'] and hashlib.sha256(data).hexdigest()==manifest['wholeSha256']; (root/'light160-local-candidate.zip').write_bytes(data)
          p=Path('scripts/ci/frozen/light160-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='9cb91a31a7f0dad30aba893c70a1064836700f22fc6e24e7d239124bf0566c2c'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42342854391
          name: physical-radius-2k-v160-native-read
          path: verified-radius2k-parent
      - name: Observe exact latest checkpoint with bounded native read probe
        env:
          OC_TEST_WIDTH: '4000'
          OC_STAGE_SECONDS: '150'
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_TIMING_OPTIONAL: 'true'
          OC_EVIDENCE_DIR: physical-radius-2k-evidence
          OC_RESUME: 'true'
          OC_REQUIRE_CHECKPOINT_MANIFEST: 'true'
          OC_DIAGNOSTIC_ONLY: 'true'
          OC_NATIVE_READ_PROBE: 'true'
        run: python3 scripts/ci/native160-read-v2-diagnostic.py
      - name: Preserve complete original and source-corrected checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-radius-2k-v160-native-read-v2
          path: |
            physical-radius-2k-evidence/
            production-candidate/
            production-src/build/test-results/test/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
