name: Source-corrected165 radius2k retained checkpoint acceptance
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-2k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 637e03a072c5ff9a3288b80c3e147b5eb5bba233
      EXPECTED_BUILD: v253.125.164
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local165 candidate and371XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          import json
          root=Path('scripts/ci/frozen'); manifest=json.loads((root/'light165-local-candidate.parts.json').read_text()); pieces=[]
          for item in manifest['parts']:
              b=(root/item['name']).read_bytes(); assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']; pieces.append(b)
          data=b''.join(pieces); assert len(data)==manifest['bytes'] and hashlib.sha256(data).hexdigest()==manifest['wholeSha256']; (root/'light165-local-candidate.zip').write_bytes(data)
          p=Path('scripts/ci/frozen/light165-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='b0f34f0c475d13e4c1fe9131a3f45fef193713a21d22327877fb1864cd8af9df'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42678226272
          name: physical-radius-2k-v165-s2
          path: verified-radius2k-parent
      - name: Resume exact saved checkpoint with source-corrected165
        env:
          OC_TEST_WIDTH: '4000'
          OC_STAGE_SECONDS: '900'
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_TIMING_OPTIONAL: 'true'
          OC_EVIDENCE_DIR: physical-radius-2k-evidence
          OC_DIAGNOSTIC_ONLY: 'true'
          OC_FINALIZER_STAGE_PROBE: 'true'
          OC_RESUME: 'true'
          OC_REQUIRE_CHECKPOINT_MANIFEST: 'true'
        run: python3 scripts/ci/stall165-lifecycle-diagnostic.py
      - name: Preserve complete original and source-corrected checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-radius-2k-v165-lifecycle-diagnostic
          path: |
            physical-radius-2k-evidence/
            production-candidate/
            production-src/build/test-results/test/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
