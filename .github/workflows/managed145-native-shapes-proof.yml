name: Specific154 absolute player-zone relocation collision proof
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 0f3be95f7da782763ee2f8aa7417427a2338faf8
      EXPECTED_BUILD: v253.125.154
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local154 candidate and348XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('scripts/ci/frozen/light154-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='17a06b5ae23f455157a44d34cd4e94d01130d850fe75c4f5dda9ae52d4a8f433'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          p=Path('scripts/ci/frozen/absolute154-player-collision-fixture.jar')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='b0f4828e5b7ed62168b009481425016d035d0e9db5e74d650529167d1010a463'
          PY
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore exact existing139 fixture for NEW protected destination collision
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41156473165
          name: v139-cell-receipt-cold-proof
          path: verified-managed-parent
      - name: Specific native absolute player-zone destination collision
        run: python3 scripts/ci/absolute154-player-collision.py
      - name: Preserve full original and corrected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absolute154-player-collision-proof
          path: |
            absolute154-collision-evidence/
            production-candidate/
            scripts/ci/managed-v139-parent.json
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
