name: Specific155 preserved-whole authority collision
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  managed145:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: d5a8f047e727700969c3f7a90aad8d219d303026
      EXPECTED_BUILD: v253.125.156
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Restore frozen local157 candidate and356XML without rebuild
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          import json
          root=Path('scripts/ci/frozen'); manifest=json.loads((root/'light157-local-candidate.parts.json').read_text()); pieces=[]
          for item in manifest['parts']:
              b=(root/item['name']).read_bytes(); assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']; pieces.append(b)
          data=b''.join(pieces); assert len(data)==manifest['bytes'] and hashlib.sha256(data).hexdigest()==manifest['wholeSha256']; (root/'light157-local-candidate.zip').write_bytes(data)
          p=Path('scripts/ci/frozen/light157-local-candidate.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='c52a4596ac568ccdfdaa15450d85eea19c0818a398b072ed681244d6333f2ac8'
          with zipfile.ZipFile(p) as z:z.extractall('.')
          p=Path('scripts/ci/frozen/recovery156-stage-probe-fixture.jar')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='ea0c4702d8a72c725114610e7e030691a6dd287ac0152759c45e8e91eef18fcd'
          PY
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore exact latest failed156 snapshot with all bytes retained
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41896908939
          name: recovery156-stage-proof
          path: verified-recovery157-parent
      - name: Actual157 source-aware failed-checkpoint continuation
        run: python3 scripts/ci/recovery157.py
      - name: Preserve full original and corrected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery157-proof
          path: |
            recovery157-evidence/
            production-candidate/
            scripts/ci/recovery157-parent.json
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
