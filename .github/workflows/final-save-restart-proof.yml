name: Experimental final-save restart durability proof
on:
  push:
    branches: [work/perf-final-save-no-forced-dirty-20261115]
    paths: ['.github/workflows/final-save-restart-proof.yml', 'scripts/ci/full-canvas-restart-throughput-benchmark.py', 'runtime-src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, no-forced-dirty]
    env:
      OC_BENCH_NAME: final-save-restart-${{ matrix.mode }}
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '512'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: "-Doceancanvas.flattenInflight=8 -Doceancanvas.experimentalNoForcedFinalDirty=${{ matrix.mode == 'no-forced-dirty' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact candidate
        working-directory: runtime-src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
          sha256sum build/libs/*.jar > ../RUNTIME_JAR_SHA256.txt
      - name: Prove disposable 512-block restart and durable journals
        shell: bash
        run: python3 scripts/ci/full-canvas-restart-throughput-benchmark.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-save-restart-${{ matrix.mode }}
          path: |
            RUNTIME_JAR_SHA256.txt
            throughput-benchmark-final-save-restart-${{ matrix.mode }}/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
