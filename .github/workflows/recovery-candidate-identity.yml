name: Ocean Canvas Recovery Candidate Identity

on:
  push:
    branches:
      - recovery/core-proof
      - 'work/r1-49-*'
    paths:
      - 'runtime-src/**'
      - 'scripts/ci/recovery_candidate_identity.py'
      - 'scripts/ci/test-recovery-candidate-identity.py'
      - '.github/workflows/recovery-candidate-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oceancanvas-recovery-candidate-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-identity:
    name: Immutable recovery candidate identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prove candidate identity fail-closed regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/recovery_candidate_identity.py
          python3 -m py_compile scripts/ci/test-recovery-candidate-identity.py
          python3 scripts/ci/test-recovery-candidate-identity.py

      - name: Build exact candidate JAR
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --warning-mode=fail

      - name: Assemble and independently reverify immutable identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate
          python3 scripts/ci/recovery_candidate_identity.py assemble \
            --repo-root . \
            --candidate-dir candidate \
            --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID"
          python3 scripts/ci/recovery_candidate_identity.py verify \
            --repo-root . \
            --candidate-dir candidate \
            --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID"
          cat candidate/candidate.properties

      - name: Upload immutable identity-bound candidate
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-recovery-identity-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
