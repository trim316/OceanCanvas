name: Saved 20k checkpoint local revalidation cooperation
on:
  push:
    branches: [work/v127-local-revalidation-cooperation]
    paths: ['.github/workflows/release127-local-revalidation-cooperation.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: release127-local-revalidation-cooperation-20k
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCALE: 20k
      PROFILE_MODE: candidate
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original hosted Java identity
        run: java -version 2>&1 | tee java-identity.txt; grep -F '25.0.4.1+1' java-identity.txt
      - name: Verify exact Java ZGC runtime support before world load
        run: |
          java -Xms1G -Xmx14G -XX:+UseZGC -XX:+PrintFlagsFinal -version > zgc-flags.txt 2>&1
          grep -E 'UseZGC.*= true ' zgc-flags.txt
          grep -E 'UseG1GC.*= false ' zgc-flags.txt
      - name: Full client server build and regression tests before world
        working-directory: production-src
        run: bash gradlew build --console=plain
      - name: Host sampler unit regressions
        run: python3 -m unittest discover -s scripts/ci -p test_host_stall_sampler.py
      - name: Download verified newest126 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40868387122
          name: release126-bounded-thread-snapshots-candidate
          path: verified126-parent
      - name: Validate local revalidation cooperation on verified126 world with127 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_release127_local_revalidation_cooperation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release127-local-revalidation-cooperation-candidate
          path: |
            local-revalidation-cooperation-continuation-20k-candidate/
            !local-revalidation-cooperation-continuation-20k-candidate/parent.zip
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
