name: R1-35 Vertical Entity Refusal Proof

on:
  push:
    branches: [work/r1-35-vertical-entity-refusal-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prove full vertical entity-refusal coverage
        run: python3 scripts/ci/test-r1-35-vertical-entity-refusal.py
      - name: Build and test exact recovery source
        working-directory: runtime-src
        run: ./gradlew --no-daemon --warning-mode=fail build test
      - name: Require read-only validation
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
