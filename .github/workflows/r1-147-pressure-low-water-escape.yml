name: R1-147 Pressure Low Water Repair
on:
  push:
    branches:
      - work/r1-146-pressure-park-liveness
    paths:
      - .github/workflows/r1-147-pressure-low-water-escape.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-146-pressure-park-liveness
          fetch-depth: 0
      - name: Apply bounded scheduler repair
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/r1-147.py
          python3 /tmp/r1-147.py
          python3 scripts/ci/test-r1-146-pressure-park-deadline.py
          python3 scripts/ci/test-r1-147-pressure-low-water-escape.py
          git diff --check
      - name: Commit runtime repair
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java scripts/ci/test-r1-147-pressure-low-water-escape.py
          git commit -m "R1-147 bounded pressure wake escape"
          git push origin HEAD:work/r1-146-pressure-park-liveness
