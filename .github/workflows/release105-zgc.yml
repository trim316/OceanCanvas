name: Saved 20k checkpoint native ZGC latency comparison
on:
  push:
    branches: [work/v105-scale-release-continuation]
    paths: ['.github/workflows/release105-zgc.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: release105-zgc-20k
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCALE: 20k
      PROFILE_MODE: candidate
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original hosted Java identity
        run: java -version 2>&1 | tee java-identity.txt; grep -F '25.0.4.1+1' java-identity.txt
      - name: Verify exact Java ZGC runtime support before world load
        run: |
          java -Xms1G -Xmx14G -XX:+UseZGC -XX:+PrintFlagsFinal -version > zgc-flags.txt 2>&1
          grep -E 'UseZGC.*= true ' zgc-flags.txt
          grep -E 'UseG1GC.*= false ' zgc-flags.txt
      - name: Continue newest verified105world with SAMEJAR and first-failure guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_release105_zgc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release105-zgc-20k-candidate
          path: |
            zgc-continuation-20k-candidate/
            !zgc-continuation-20k-candidate/parent.zip
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
