name: R1-183 Diagnose exact R1-182 throughput failure

on:
  push:
    branches: [work/r1-183-diagnose-r1-182]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact failed evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0afe6a93cfab93118cd2d7c253d6aa07230563fc"
      - name: Download preserved R1-182 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download 38501748712 -n r1-146-exact-throughput-profile-38501748712 -D evidence
          test -n "$(find evidence -type f -print -quit)"
      - name: Extract exact release-critical telemetry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/core-proof
          OUT=recovery/core-proof/R1-183_R1-182_DIAGNOSIS.txt
          {
            echo 'R1-183 exact R1-182 failure diagnosis'
            echo 'source_sha=0afe6a93cfab93118cd2d7c253d6aa07230563fc'
            echo 'run_id=38501748712'
            echo 'artifact_id=11866289263'
            echo 'artifact_digest=sha256:ede1b150262f110385af2f2bee89202a4a4e44e0282b817a27f00b412e056af5'
            echo
            echo '=== matched telemetry ==='
          } > "$OUT"
          python3 - <<'PY' >> "$OUT"
          import gzip, pathlib, re, zipfile
          root=pathlib.Path('evidence')
          keys=re.compile(r'(firstPhysicalProfileMismatch|preLightPhysicalAudit|FAST.CERT|finalizerWallBudgetExhausted|activeWorkBudgetExhausted|wallBudget|workBudget|historicalResidency|residency|lightingBacklog|relight|terrain|effectiveCap|heapEma|throughput|finaliz|budget|pending|confirmed|reschedul|defer|delayed|retry|poll|sampled|due|ticket|release|reacquire|physical.audit|light.sweep|strict.sky|fingerprint)', re.I)
          text_suffix={'.txt','.log','.json','.properties','.csv','.md','.yml','.yaml'}
          hits=0
          def emit(name,text):
              global hits
              for i,line in enumerate(text.splitlines(),1):
                  if keys.search(line):
                      print(f'{name}:{i}:{line}')
                      hits += 1
                      if hits >= 14000: raise SystemExit
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try:
                  if p.suffix == '.gz':
                      with gzip.open(p,'rt',errors='replace') as f: emit(str(p),f.read())
                  elif p.suffix == '.zip':
                      with zipfile.ZipFile(p) as z:
                          for n in z.namelist():
                              if pathlib.Path(n).suffix.lower() in text_suffix:
                                  emit(f'{p}!{n}',z.read(n).decode('utf-8','replace'))
                  elif p.suffix.lower() in text_suffix:
                      emit(str(p),p.read_text(errors='replace'))
              except (UnicodeError,OSError,zipfile.BadZipFile):
                  pass
          if hits == 0:
              raise SystemExit('FAIL: no release-critical telemetry recovered')
          PY
          test $(wc -l < "$OUT") -gt 10
      - name: Persist exact diagnosis only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- production-src)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery/core-proof/R1-183_R1-182_DIAGNOSIS.txt
          git diff --cached --quiet && { echo 'FAIL: empty diagnosis'; exit 1; }
          git commit -m 'R1-183 persist exact R1-182 throughput diagnosis'
          git push origin HEAD:work/r1-183-diagnose-r1-182
