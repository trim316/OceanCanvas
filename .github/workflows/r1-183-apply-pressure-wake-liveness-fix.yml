name: R1-183 Apply Pressure Wake Liveness Fix

on:
  push:
    branches:
      - work/r1-182-retain-current-epoch-physical-proof

permissions:
  contents: write

jobs:
  apply-exact-source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-182-retain-current-epoch-physical-proof
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 tools/r1_183_apply_pressure_wake_liveness_fix.py
      - name: Commit exact source patch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "OceanCanvas release repair"
          git config user.email "actions@users.noreply.github.com"
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m "R1-183: unpin pressure wakes from delayed debt"
          git push origin HEAD:work/r1-182-retain-current-epoch-physical-proof
