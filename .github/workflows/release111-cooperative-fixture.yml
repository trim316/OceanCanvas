name: Targeted cooperative carve interruption and cold recovery
on:
  push:
    branches: [work/v111-cooperative-unstructured-carve]
    paths: ['.github/workflows/release111-cooperative-fixture.yml']
permissions:
  contents: read
concurrency:
  group: release111-cooperative-fixture
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original Java
        run: java -version 2>&1 | tee java-version.txt; grep -F '25.0.4.1+1' java-version.txt
      - name: Full client server build and99 tests plus separate fixture addon
        working-directory: production-src
        run: bash gradlew build -I ../scripts/ci/fixtures/cooperative-carve/build.init.gradle cooperativeFixtureJar --console=plain
      - run: python3 -m pip install nbtlib
      - name: Targeted16block interruption and same saved job addonfree recovery
        env:
          EXPECTED_SOURCE: 612b7693c6fe841d969b510e6b1d3ac47d9c0814
        run: python3 scripts/ci/cooperative-carve-restart-fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release111-cooperative-carve-restart-fixture
          path: cooperative-carve-restart-fixture/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
