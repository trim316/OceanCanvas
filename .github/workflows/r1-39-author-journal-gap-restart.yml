name: R1-39 Author Journal Gap Restart Proof

on:
  push:
    branches: [work/r1-39-author-journal-gap-restart]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prove restart across physical-write journal gap
        working-directory: runtime-src
        run: ./gradlew --no-daemon --warning-mode=fail authorJournalGapRestartSelfTest
      - name: Build and test exact recovery source
        working-directory: runtime-src
        run: ./gradlew --no-daemon --warning-mode=fail build test
      - name: Require read-only validation
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
