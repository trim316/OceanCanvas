name: R1-148 Pressure Resume Water Refill
on:
  push:
    branches:
      - work/r1-148-pressure-resume-water-refill
    paths:
      - .github/workflows/r1-148-pressure-resume-water-refill.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-148-pressure-resume-water-refill
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply measured pressure scheduler repair
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/r1-148.py
          python3 /tmp/r1-148.py
          python3 scripts/ci/test-r1-146-pressure-park-deadline.py
          python3 scripts/ci/test-r1-148-pressure-resume-water-refill.py
          git diff --check
      - name: Compile and test exact repaired source
        working-directory: production-src
        run: ./gradlew test --no-daemon --warning-mode=fail
      - name: Commit implementation and deterministic regression
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java scripts/ci/test-r1-148-pressure-resume-water-refill.py
          git commit -m "R1-148: refill parked pressure debt to resume water"
          git push origin HEAD:work/r1-148-pressure-resume-water-refill
