name: Offline Anvil compiler structural gate
on:
  push:
    branches: [work/perf-transactional-region-architecture-20261116]
    paths:
      - 'scripts/ci/offline_region_packer.py'
      - 'scripts/ci/structural_compiler_benchmark.py'
      - 'scripts/ci/test_structural_compiler_benchmark.py'
      - 'scripts/ci/verified_throughput_gate.py'
      - 'scripts/ci/test_verified_throughput_gate.py'
      - 'scripts/ci/direct_section_nbt.py'
      - 'scripts/ci/test_direct_section_nbt.py'
      - 'scripts/ci/cache_experiment.py'
      - 'scripts/ci/test_cache_experiment.py'
      - 'scripts/ci/section_template_cache.py'
      - 'scripts/ci/test_section_template_cache.py'
      - 'scripts/ci/region_receipts.py'
      - 'scripts/ci/test_region_receipts.py'
      - 'scripts/ci/palette_encoder.py'
      - 'scripts/ci/test_palette_encoder.py'
      - 'scripts/ci/nbt_validator.py'
      - 'scripts/ci/test_offline_region_packer.py'
      - '.github/workflows/offline-region-compiler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-region-packer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete regions and parallel deterministic packaging
        run: python3 -m unittest discover -s scripts/ci -p test_offline_region_packer.py -v
      - name: Verify direct palette encoding
        run: python3 -m unittest discover -s scripts/ci -p test_palette_encoder.py -v
      - name: Detect region corruption and forged receipts
        run: python3 -m unittest discover -s scripts/ci -p test_region_receipts.py -v
      - name: Verify direct NBT and immutable section templates
        run: |
          python3 -m unittest discover -s scripts/ci -p test_direct_section_nbt.py -v
          python3 -m unittest discover -s scripts/ci -p test_section_template_cache.py -v
      - name: Benchmark one-region direct and cached compilation
        run: |
          python3 -m unittest discover -s scripts/ci -p test_structural_compiler_benchmark.py -v
          python3 scripts/ci/structural_compiler_benchmark.py --regions 1 --workers 1
          python3 scripts/ci/structural_compiler_benchmark.py --regions 2 --workers 2
      - name: Compare caching strategies across uniform mixed and unique terrain
        run: |
          python3 -m unittest discover -s scripts/ci -p test_cache_experiment.py -v
          python3 scripts/ci/cache_experiment.py --mode uniform --count 1024
          python3 scripts/ci/cache_experiment.py --mode mixed --count 1024
          python3 scripts/ci/cache_experiment.py --mode unique --count 1024
      - name: Validate strict 500 verified chunks/minute acceptance gate
        run: python3 -m unittest discover -s scripts/ci -p test_verified_throughput_gate.py -v
      - name: Scope
        run: echo "Structural Anvil packaging only; fixture NBT is not a playable Minecraft chunk."
