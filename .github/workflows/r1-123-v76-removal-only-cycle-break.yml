name: R1-123 v76 Removal-only Floor Cycle Repair
on:
  push:
    branches: [work/forever-world-release-push]
    paths:
      - '.github/workflows/r1-123-v76-removal-only-cycle-break.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/forever-world-release-push
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply removal-only local cycle break
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()
          s=s.replace('''\t * section containing the floor. Build74 proved a 9x9 nudge can move the stale\n\t * lateral loop across the adjacent chunk boundary instead of extinguishing it.\n\t * Re-evaluate a bounded 49x49 connected floor band (radius 24) so the entire\n\t * local cycle is invalidated in one public-engine wave. No blocks or SKY storage\n\t * are replaced; the ordinary strict verifier remains the certification authority.</p>''','''\t * section containing the floor. Build75 proved that widening the footprint and\n\t * immediately re-propagating source tables can wake unrelated boundary debt.\n\t * This repair is therefore removal-only: nudge the original bounded 9x9 floor\n\t * band through checkBlock(), do not rebuild/reseed SKY sources, and let the\n\t * threaded engine settle before the ordinary strict verifier runs again. No\n\t * blocks or SKY storage are replaced.</p>''',1)
          if '\t\tjava.util.HashSet<Long> touchedChunks = new java.util.HashSet<>();' not in s: raise SystemExit('v75 touchedChunks declaration not found')
          s=s.replace('\t\tjava.util.HashSet<Long> touchedChunks = new java.util.HashSet<>();\n','',1)
          if '\t\tfinal int radius = 24;' not in s: raise SystemExit('v75 radius not found')
          s=s.replace('\t\tfinal int radius = 24;','\t\tfinal int radius = 4;',1)
          old='''\t\t\t\tlong touchedPacked = ChunkPos.pack(cx, cz);\n\t\t\t\tif (touchedChunks.add(touchedPacked)) chunk.initializeLightSources();\n'''
          if old not in s: raise SystemExit('v75 source-reseed block not found')
          s=s.replace(old,'',1)
          old='''\t\tfor (long touchedPacked : touchedChunks) {\n\t\t\tChunkPos cp = new ChunkPos(ChunkPos.getX(touchedPacked), ChunkPos.getZ(touchedPacked));\n\t\t\tlightEngine.setLightEnabled(cp, true);\n\t\t\tlightEngine.propagateLightSources(cp);\n\t\t\tLevelChunk chunk = world.getChunkSource().getChunkNow(cp.x(), cp.z());\n\t\t\tif (chunk != null) chunk.markUnsaved();\n\t\t}\n'''
          if old not in s: raise SystemExit('v75 post-check propagation block not found')
          s=s.replace(old,'',1)
          p.write_text(s)
          p=Path('production-src/gradle.properties'); s=p.read_text()
          if 'mod_version=26.2-v253.125.75' not in s: raise SystemExit('expected v75 gradle identity')
          p.write_text(s.replace('mod_version=26.2-v253.125.75','mod_version=26.2-v253.125.76',1))
          p=Path('production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java'); s=p.read_text()
          if 'VERSION = "v253.125.75"' not in s: raise SystemExit('expected v75 runtime identity')
          p.write_text(s.replace('VERSION = "v253.125.75"','VERSION = "v253.125.76"',1))
          PY
      - name: Focused lighting regressions
        working-directory: production-src
        run: |
          ./gradlew test --tests net.oceancanvas.mod.worldgen.OceanCanvasFloorBandCycleBreakPolicyTest --tests net.oceancanvas.mod.worldgen.OceanCanvasDeepSeamOwnershipTest --tests net.oceancanvas.mod.worldgen.OceanCanvasSkyPathProofTest --no-daemon
      - name: Full build
        working-directory: production-src
        run: ./gradlew build --no-daemon
      - name: Commit, rebase, push tested v76
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/gradle.properties production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'Make floor-band cycle break removal-only [saved-2k-v76]'
          git fetch origin work/forever-world-release-push
          git rebase origin/work/forever-world-release-push
          git push origin HEAD:work/forever-world-release-push
