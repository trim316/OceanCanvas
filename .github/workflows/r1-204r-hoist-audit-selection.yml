name: R1-204R Hoist Audit Selection Scope
on:
  push:
    branches: [work/r1-204r-hoist-audit-selection]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused production transform
        run: python3 scripts/ci/r1-204r-hoist-audit-selection.py
      - name: Verify exact optimization and authority boundary
        run: python3 scripts/ci/test-r1-204r-hoist-audit-selection.py
      - name: Run existing authority and physical-audit regressions
        run: |
          python3 scripts/ci/test-operation-column-scope.py
          python3 scripts/ci/test-physical-audit-fastpath.py
      - name: Assert focused production delta
        run: |
          changed="$(git diff --name-only -- production-src | wc -l)"
          test "$changed" -le 1
          git diff --check
      - name: Build exact transformed production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build
      - name: Persist exact tested production mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          if ! git diff --cached --quiet; then
            git commit -m 'R1-204R: hoist audit selection authority per slice'
            git push
          fi
