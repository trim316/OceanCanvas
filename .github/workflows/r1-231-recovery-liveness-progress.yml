name: R1-231 recovery liveness progress
on:
  push:
    branches: [work/r1-231-recovery-liveness-progress]
permissions:
  contents: write
concurrency:
  group: r1-231-recovery-liveness-progress
  cancel-in-progress: false
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused product repair once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java')
          s=p.read_text()
          field='        private long lastPerformanceLightPublishCount=OceanCanvasSurfaceFlattener.lightFinalizationPublishCount();\n'
          added=field+'        private int lastPerformanceRecoveryPending=-1;\n'
          if 'lastPerformanceRecoveryPending' not in s:
              if s.count(field)!=1: raise SystemExit('field anchor mismatch')
              s=s.replace(field,added,1)
          old='''            long lightPublishes=OceanCanvasSurfaceFlattener.lightFinalizationPublishCount();\n            if(lightPublishes>lastPerformanceLightPublishCount)rateWindow.noteProgress(now);\n            lastPerformanceLightPublishCount=Math.max(lastPerformanceLightPublishCount,lightPublishes);\n'''
          new='''            long lightPublishes=OceanCanvasSurfaceFlattener.lightFinalizationPublishCount();\n            if(lightPublishes>lastPerformanceLightPublishCount)rateWindow.noteProgress(now);\n            lastPerformanceLightPublishCount=Math.max(lastPerformanceLightPublishCount,lightPublishes);\n            // R1-231: restart recovery can retire strict obligations without incrementing\n            // the ordinary lighting-publication counter (for example an already-sealed\n            // authoritative commit/exemption). That is real forward progress, but the\n            // performance watchdog previously saw only a flat terrain/publication clock\n            // and could report no-progress while the quarantine was rapidly draining.\n            // Observe only a strict decrease in the mandatory recovery set: growth,\n            // re-arm, or a flat set never earns liveness credit and completion semantics\n            // remain entirely unchanged.\n            int recoveryPending=restartRecoveryQuarantinePending.size();\n            if(lastPerformanceRecoveryPending>=0 && recoveryPending<lastPerformanceRecoveryPending)\n                rateWindow.noteProgress(now);\n            lastPerformanceRecoveryPending=recoveryPending;\n'''
          if 'restart recovery can retire strict obligations' not in s:
              if s.count(old)!=1: raise SystemExit('sample anchor mismatch')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Deterministic safety regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java').read_text()
          assert s.count('private int lastPerformanceRecoveryPending=-1;') == 1
          assert s.count('recoveryPending<lastPerformanceRecoveryPending') == 1
          assert s.count('rateWindow.noteProgress(now);') >= 2
          block=s[s.index('private void samplePerformance()'):s.index('private OceanCanvasPregenMetrics.Snapshot performanceSnapshot()')]
          assert 'restartRecoveryQuarantinePending.size()' in block
          assert 'recoveryPending<lastPerformanceRecoveryPending' in block
          assert 'recoveryPending<=lastPerformanceRecoveryPending' not in block
          assert 'restartRecoveryQuarantinePending.clear()' not in block
          assert 'remove(' not in block
          assert 'lightFinalizationPublishCount()' in block
          print('R1-231 regression PASS: only strict recovery-debt decrease can refresh liveness; no completion/authority mutation added')
          PY
      - name: Compile and test production engine
        run: |
          cd production-src
          chmod +x gradlew
          ./gradlew --no-daemon build --warning-mode=fail
      - name: Persist exact tested product commit
        run: |
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java; then
            echo 'Product repair already committed; validation-only rerun.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/pregen/PregenManager.java
          git commit -m 'R1-231: count strict recovery retirement as liveness progress'
          git push origin HEAD:work/r1-231-recovery-liveness-progress
