name: R1-170 Diagnose exact R1-169 throughput failure

on:
  push:
    branches: [work/r1-170-diagnose-r1-169]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact failed evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3dddc5bf9571e08eb640f423d9588130e8675274"
      - name: Download preserved R1-169 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download 38365971645 -n r1-165-exact-throughput-profile-38365971645 -D evidence
          test -n "$(find evidence -type f -print -quit)"
      - name: Extract drain and throughput diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/core-proof
          OUT=recovery/core-proof/R1-170_R1-169_DIAGNOSIS.txt
          {
            echo 'R1-170 exact R1-169 failure diagnosis'
            echo 'source_sha=3dddc5bf9571e08eb640f423d9588130e8675274'
            echo 'run_id=38365971645'
            echo 'artifact_id=11797209493'
            echo 'artifact_digest=sha256:24f8b321b60c4a5ad31327891cb52914faace3a5cd28b6b30ee6c4175c88e45a'
            echo
            echo '=== matched telemetry ==='
          } > "$OUT"
          python3 - <<'PY' >> "$OUT"
          import gzip, pathlib, re
          root=pathlib.Path('evidence')
          keys=re.compile(r'(historicalResidency|residency|pressureFast|lightingBacklog|relight|terrain|effectiveCap|heapEma|capHold|warm|throughput|profile|finaliz|budget|pending|confirmed)', re.I)
          hits=0
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try:
                  f=gzip.open(p,'rt',errors='replace') if p.suffix == '.gz' else p.open('rt',errors='replace')
                  with f:
                      for i,line in enumerate(f,1):
                          if keys.search(line):
                              print(f'{p}:{i}:{line.rstrip()}')
                              hits += 1
                              if hits >= 12000: raise SystemExit
              except (UnicodeError, OSError):
                  pass
          if hits == 0:
              raise SystemExit('FAIL: no release-critical telemetry recovered')
          PY
          test $(wc -l < "$OUT") -gt 10
      - name: Persist exact diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery/core-proof/R1-170_R1-169_DIAGNOSIS.txt
          git diff --cached --quiet && { echo 'FAIL: empty diagnosis'; exit 1; }
          git commit -m 'R1-170 persist exact R1-169 throughput diagnosis'
          git push origin HEAD:work/r1-170-diagnose-r1-169
