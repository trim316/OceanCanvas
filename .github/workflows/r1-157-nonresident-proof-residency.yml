name: R1-157 Nonresident Strict-Proof Residency

on:
  push:
    branches:
      - work/r1-157-nonresident-proof-residency

permissions:
  contents: write

jobs:
  validate-and-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and assert minimal R1-157 repair
        run: python scripts/r1_157_apply.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew --no-daemon clean test
      - name: Commit exact tested R1-157 product source
        shell: bash
        run: |
          set -euo pipefail
          product='production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java'
          if git diff --quiet -- "$product"; then
            echo 'Exact R1-157 product source already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$product"
          git commit -m 'R1-157: bound residency for nonresident strict proof debt'
          git push origin HEAD:${GITHUB_REF_NAME}
