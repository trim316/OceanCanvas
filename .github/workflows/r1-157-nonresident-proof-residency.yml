name: R1-157 Nonresident Strict-Proof Residency

on:
  push:
    branches: [ work/r1-157-nonresident-proof-residency ]

permissions:
  contents: write

jobs:
  validate-and-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal nonresident strict-proof residency repair
        shell: python {0}
        run: |
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()
          old='''\t\t\tLevelChunk live = world.getChunkSource().getChunkNow(ChunkPos.getX(packed), ChunkPos.getZ(packed));
\t\t\tif (live == null) {
\t\t\t\tlong postponed = now + 20L;
\t\t\t\tif (lightRecoverySession().pressureParkUntilTick.replace(packed, due, postponed))
\t\t\t\t\tlightFinalizerSession().retryLedger.offerPressurePark(packed, postponed);
\t\t\t\tcontinue;
\t\t\t}'''
          new='''\t\t\tint cx = ChunkPos.getX(packed), cz = ChunkPos.getZ(packed);
\t\t\tLevelChunk live = world.getChunkSource().getChunkNow(cx, cz);
\t\t\tif (live == null) {
\t\t\t\t// R1-157: the 1k exact-head artifact left a finite tail of strict
\t\t\t\t// LIGHT_ONLY debt permanently nonresident after terrain completion.
\t\t\t\t// Reuse the existing heap-governed, paced, capped historical residency
\t\t\t\t// lane; never synchronously load and never bypass its memory/ticket caps.
\t\t\t\tensureLightRelightResidencyTicket(world, packed, cx, cz);
\t\t\t\tlong postponed = now + 20L;
\t\t\t\tif (lightRecoverySession().pressureParkUntilTick.replace(packed, due, postponed))
\t\t\t\t\tlightFinalizerSession().retryLedger.offerPressurePark(packed, postponed);
\t\t\t\tcontinue;
\t\t\t}'''
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'R1-157 source anchor mismatch: {s.count(old)}')
              s=s.replace(old,new,1)
              p.write_text(s)
          s=p.read_text()
          start=s.index('private static int fastCertifyResidentPressureParked')
          end=s.index('\n\t}', start)+3
          method=s[start:end]
          for required in [
              'int maxScans = Math.max(maxProofs, maxProofs * 4);',
              'while (attempted < maxProofs && scanned < maxScans) {',
              'getChunkNow(cx, cz)',
              'ensureLightRelightResidencyTicket(world, packed, cx, cz)',
              'tryFastCertifyResidentCanvasLighting']:
              if required not in method: raise SystemExit('R1-157 safety regression: '+required)
          if 'getChunk(' in method or 'getChunkFuture' in method:
              raise SystemExit('R1-157 must remain nonblocking/loaded-only at proof point')

          w=Path('.github/workflows/r1-145-exact-throughput.yml')
          ws=w.read_text()
          branch='      - work/r1-157-nonresident-proof-residency\n'
          if branch not in ws:
              anchor='      - work/r1-156-resident-proof-throughput\n'
              if ws.count(anchor)!=1: raise SystemExit('exact-throughput branch anchor mismatch')
              ws=ws.replace(anchor,anchor+branch,1)
              w.write_text(ws)
          print('R1-157 deterministic source/workflow regression PASS')
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew --no-daemon clean test
      - name: Commit exact tested R1-157 product source and exact-head trigger
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java .github/workflows/r1-145-exact-throughput.yml; then
            echo 'Exact R1-157 product source already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java .github/workflows/r1-145-exact-throughput.yml
          git commit -m 'R1-157: bound residency for nonresident strict proof debt'
          git push origin HEAD:${GITHUB_REF_NAME}
