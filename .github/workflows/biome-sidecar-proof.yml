name: Biome sidecar proof

on:
  push:
    branches:
      - work/biome-preimage-sidecar
    paths:
      - 'runtime-src/**'
      - '.github/workflows/biome-sidecar-proof.yml'
  pull_request:
    paths:
      - 'runtime-src/**'
      - '.github/workflows/biome-sidecar-proof.yml'

permissions:
  contents: read

jobs:
  biome-sidecar-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Exact head: $actual"

      - name: Build and run deterministic regressions
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: Pin biome recovery safety contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime-src/src/main/java/net/oceancanvas/core/restore/BiomePreimageStore.java
          test -f runtime-src/src/main/java/net/oceancanvas/mod/server/BiomePreimageAdapter.java
          grep -q 'BiomePreimageStore' runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          grep -q 'BiomePreimageAdapter' runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          grep -q 'blockPreimageSha256' runtime-src/src/main/java/net/oceancanvas/core/restore/BiomePreimageStore.java
          grep -q 'sha256' runtime-src/src/main/java/net/oceancanvas/core/restore/BiomePreimageStore.java
          grep -q 'capture' runtime-src/src/main/java/net/oceancanvas/mod/server/BiomePreimageAdapter.java
          grep -q 'restore' runtime-src/src/main/java/net/oceancanvas/mod/server/BiomePreimageAdapter.java
          echo 'Biome sidecar safety contracts pinned.'
