name: Biome Sidecar Exact-Head Proof

on:
  push:
    branches: [work/biome-preimage-sidecar]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/biome-sidecar-proof.yml'
  pull_request:
    branches: [work/operator-26-3-integration]

permissions:
  contents: read

concurrency:
  group: biome-sidecar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || { echo "exact-head mismatch: expected=$expected actual=$actual" >&2; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and run deterministic regressions
        shell: bash
        run: ./gradlew build --warning-mode=fail --no-daemon
      - name: Pin biome-sidecar safety contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'BiomePreimage' src/main/java src/test/java 2>/dev/null || { echo 'BiomePreimage implementation/tests missing' >&2; exit 1; }
          grep -R -q 'block.*digest\|blockDigest\|blockPreimage' src/main/java src/test/java 2>/dev/null || { echo 'block-preimage binding contract missing' >&2; exit 1; }
          grep -R -q 'checksum\|sha256\|SHA-256' src/main/java src/test/java 2>/dev/null || { echo 'checksum contract missing' >&2; exit 1; }
