name: R1-159 diagnose R1-158 failure

on:
  push:
    branches:
      - work/r1-159-diagnose-r1-158
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact preserved R1-158 failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/11746278182/zip > /tmp/r1-158.zip
          mkdir -p /tmp/r1-158-artifact
          unzip -q /tmp/r1-158.zip -d /tmp/r1-158-artifact

      - name: Extract bounded textual diagnosis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/r1-158-artifact')
          out = Path('diagnostics/r1-159-r1-158-diagnosis.txt')
          out.parent.mkdir(parents=True, exist_ok=True)

          skip_ext = {'.jfr','.mca','.mcc','.dat','.jar','.zip','.gz','.png','.jpg','.jpeg','.class','.nbt'}
          rx = re.compile(r'(pending|pressurepark|pressurefast|pressurewake|backpressure|genericdormant|resident|lighting|light[_ -]?only|submitted|confirmed|terrain|timeout|timed out|completion|failed targets|acceptance|waterfall|vegetation)', re.I)
          inventory = []
          matches = []
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              try:
                  size = p.stat().st_size
              except OSError:
                  continue
              rel = p.relative_to(root)
              inventory.append(f'{rel}\t{size}')
              if p.suffix.lower() in skip_ext or size > 64 * 1024 * 1024:
                  continue
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              sample = data[:8192]
              if sample.count(b'\x00') > 8:
                  continue
              text = data.decode('utf-8', errors='ignore')
              for i, line in enumerate(text.splitlines(), 1):
                  if rx.search(line):
                      matches.append(f'[{rel}:{i}] {line}')

          # Preserve the end of the trajectory if output is huge, while retaining
          # an initial sample for startup/context.
          if len(matches) > 6000:
              selected = matches[:1000] + [f'... {len(matches)-6000} matching lines omitted ...'] + matches[-5000:]
          else:
              selected = matches

          text = []
          text.append('R1-159 DIAGNOSIS OF EXACT R1-158 FAILURE')
          text.append('source run=38245653414')
          text.append('source sha=23bbe8ae4596f615052b964f45f1ef32b08823e6')
          text.append('artifact id=11746278182')
          text.append('artifact sha256=587af44ee019fc37ece007cdc0de3d5ffb9880cba9db38d7da17ae59b52279b0')
          text.append('')
          text.append('ARTIFACT INVENTORY')
          text.extend(inventory)
          text.append('')
          text.append('MATCHED RUNTIME / BACKLOG TRAJECTORY')
          text.extend(selected)
          out.write_text('\n'.join(text) + '\n', encoding='utf-8')
          print(f'wrote {out} with {len(selected)} selected matching lines from {len(matches)} total')
          PY

      - name: Commit diagnosis only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/r1-159-r1-158-diagnosis.txt
          if git diff --cached --quiet; then
            echo 'No diagnostic delta to commit.'
            exit 0
          fi
          git commit -m 'R1-159: persist exact R1-158 failure diagnosis'
          git push origin HEAD:work/r1-159-diagnose-r1-158
