name: Ocean Canvas Import Runtime Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source-capsule/minimal-v0.2.24/**'
      - '.github/workflows/import-runtime-source.yml'

permissions:
  contents: write

concurrency:
  group: oceancanvas-source-import
  cancel-in-progress: true

jobs:
  import:
    name: Verify and publish runtime source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oceancanvas-import
          cat source-capsule/minimal-v0.2.24/part*.b64 > /tmp/oceancanvas-import/source.xz.b64
          base64 --decode /tmp/oceancanvas-import/source.xz.b64 > /tmp/oceancanvas-import/source.tgz.xz
          xz --decompress --stdout /tmp/oceancanvas-import/source.tgz.xz > /tmp/oceancanvas-import/source.tgz
          echo "1058f64aa247dd3fb80b202377d52339aeafab4cd46804c980495b3de03567a8  /tmp/oceancanvas-import/source.tgz" | sha256sum --check -

      - name: Extract and verify source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime-src
          mkdir runtime-src
          tar -xzf /tmp/oceancanvas-import/source.tgz -C runtime-src

          test -f runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          test -f runtime-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java
          test -f runtime-src/build.gradle
          test -f runtime-src/gradle.properties

          grep -q 'MAX_RESIDENCY_REACQUIRE_ATTEMPTS' runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          grep -q 'resident-after-stale-FULL-future' runtime-src/src/main/java/net/oceancanvas/mod/server/SingleChunkWorldPorts.java
          grep -q 'core-v0.2.24' runtime-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java
          grep -q 'mod_version=26.2-core-v0.2.24' runtime-src/gradle.properties

          cat > runtime-src/SOURCE-IMPORT.properties <<EOF
          source_generation=runtime-src-v0.2.24
          capsule_tar_sha256=1058f64aa247dd3fb80b202377d52339aeafab4cd46804c980495b3de03567a8
          known_runtime_fix=g16-full-chunk-residency-reacquire
          import_run_id=$GITHUB_RUN_ID
          EOF

      - name: Commit authoritative source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OceanCanvas Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime-src
          if git diff --cached --quiet; then
            echo 'RUNTIME_SOURCE_ALREADY_CURRENT'
            exit 0
          fi
          git commit -m 'Publish authoritative v0.2.24 runtime source'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'RUNTIME_SOURCE_IMPORT_PASS'
