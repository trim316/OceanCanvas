name: Ocean Canvas Local Modrinth Test
on:
  push:
    branches: [work/forever-world-release-push]
    paths: ['.github/workflows/local-modrinth-production-test.yml', 'scripts/ci/local-modrinth-production.ps1']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: oceancanvas-local-modrinth
  cancel-in-progress: false
jobs:
  local-production:
    name: Exact production JAR on local Modrinth New World
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          run-id: 37306817353
          github-token: ${{ github.token }}
          path: production-candidate
      - name: Back up test save, install exact candidate, launch local Pregen
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ci\local-modrinth-production.ps1 -CandidateDir production-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-modrinth-production-evidence
          path: local-production-evidence/
          if-no-files-found: warn
          retention-days: 30
