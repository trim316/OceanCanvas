name: R1-232 merged-v91 copied 5k revalidation
on:
  push:
    branches: [work/r1-232-revalidate-v91-5k]
    paths: ['.github/workflows/native-snow-source.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: r1-232-v91-5k
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scale: [5k]
        mode: [baseline, candidate]
    env:
      SCALE: ${{ matrix.scale }}
      PROFILE_MODE: ${{ matrix.mode }}
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Refuse product drift from exact merged v91
        run: git diff --exit-code 270c99a9e8c62873606e9358c2eddf28f82e8c9e -- production-src
      - name: Build exact merged v91 candidate
        if: matrix.mode == 'candidate'
        run: |
          cd production-src
          chmod +x gradlew
          ./gradlew --no-daemon build --warning-mode=fail
      - name: Revalidate retained copied 5k failure state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/profile_native_snow_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-232-${{ matrix.scale }}-${{ matrix.mode }}
          path: snow-source-${{ matrix.scale }}-${{ matrix.mode }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn