name: R1-168 Diagnose exact R1-167 throughput failure

on:
  push:
    branches: [work/r1-168-diagnose-r1-167]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact failed evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "83976d94f603aa089894d63a658ba6cb5472a1ea"
      - name: Download preserved R1-167 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download 38348935978 -n r1-167-exact-throughput-profile-38348935978 -D evidence
          test -n "$(find evidence -type f -print -quit)"
      - name: Extract residency and throughput diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/core-proof
          OUT=recovery/core-proof/R1-168_R1-167_DIAGNOSIS.txt
          {
            echo 'R1-168 exact R1-167 failure diagnosis'
            echo 'source_sha=83976d94f603aa089894d63a658ba6cb5472a1ea'
            echo 'run_id=38348935978'
            echo 'artifact_id=11790866962'
            echo 'artifact_digest=sha256:f64270848c2f00179cc2c3ba621fe98d5347905555b37d85cf8d7968d5174647'
            echo
            echo '=== matched telemetry ==='
          } > "$OUT"
          python3 - <<'PY' >> "$OUT"
          import gzip, pathlib, re
          root=pathlib.Path('evidence')
          keys=re.compile(r'(historicalResidency|residency|pressureFast|lightingBacklog|relight|terrain|effectiveCap|heapEma|capHold|warm|throughput|profile)', re.I)
          hits=0
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try:
                  if p.suffix == '.gz':
                      f=gzip.open(p,'rt',errors='replace')
                  else:
                      f=p.open('rt',errors='replace')
                  with f:
                      for i,line in enumerate(f,1):
                          if keys.search(line):
                              print(f'{p}:{i}:{line.rstrip()}')
                              hits += 1
                              if hits >= 12000: raise SystemExit
              except (UnicodeError, OSError):
                  pass
          if hits == 0:
              raise SystemExit('FAIL: no release-critical telemetry recovered')
          PY
          test $(wc -l < "$OUT") -gt 10
      - name: Persist exact diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery/core-proof/R1-168_R1-167_DIAGNOSIS.txt
          git diff --cached --quiet && { echo 'FAIL: empty diagnosis'; exit 1; }
          git commit -m 'R1-168 persist exact R1-167 throughput diagnosis'
          git push origin HEAD:work/r1-168-diagnose-r1-167
