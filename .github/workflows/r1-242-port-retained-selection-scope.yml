name: R1-242 Port Retained Selection Scope

on:
  push:
    branches:
      - work/r1-242-port-retained-selection-scope

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/r1-242-port-retained-selection-scope
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Port exact R1-235 product and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick -n 521a742e8a864654d215f99ffd6da90759b6b3b0
          git cherry-pick -n 93f7334b64da2a1e407c295c15304ea676f07eaa
          git restore --source=HEAD -- production-src/gradle.properties production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java
          git rm .github/workflows/r1-242-port-retained-selection-scope.yml
          python scripts/ci/test-retained-selection-scope.py
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java scripts/ci/test-retained-selection-scope.py
          git commit -m 'R1-242: retain active exact selection through post-job audit'
      - name: Validate exact product source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test-retained-selection-scope.py
          cd production-src
          ./gradlew --no-daemon test build
      - name: Push validated product head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/r1-242-port-retained-selection-scope
