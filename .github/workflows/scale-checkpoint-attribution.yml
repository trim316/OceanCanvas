name: Scale checkpoint phase latency attribution
on:
  push:
    branches: [work/v89-checkpoint-tail]
    paths: ['.github/workflows/scale-checkpoint-attribution.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: scale-checkpoint-attribution
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scale: [5k, 20k]
    env:
      SCALE: ${{ matrix.scale }}
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build frozen telemetry candidate
        run: |
          cd production-src
          chmod +x gradlew
          ./gradlew --no-daemon build --warning-mode=fail
      - name: Diagnose first latency failure on immutable checkpoint copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/profile_checkpoint_attribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-attribution-${{ matrix.scale }}
          path: latency-${{ matrix.scale }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
