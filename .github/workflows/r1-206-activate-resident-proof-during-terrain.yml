name: R1-206 Activate Resident Proof During Terrain
on:
  push:
    branches: [work/r1-206-activate-resident-proof-during-terrain]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply exact R1-206 product mutation
        run: python3 tools/r1_206_activate_resident_proof_patch.py
      - name: Require caller activation and safety boundaries
        run: python3 tools/test_r1_206_activate_resident_proof.py
      - name: Compile and test production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build test
      - name: Persist tested product mutation if needed
        run: |
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java; then
            echo 'Exact product mutation already committed; validation-only pass.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'R1-206: activate resident ticket proof during terrain'
          git push origin HEAD:work/r1-206-activate-resident-proof-during-terrain
