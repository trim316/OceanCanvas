name: R1-206 Activate Resident Proof During Terrain
on:
  push:
    branches: [work/r1-206-activate-resident-proof-during-terrain]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Require exact R1-206 product mutation and safety boundaries
        run: python3 tools/test_r1_206_activate_resident_proof.py
      - name: Compile and test exact production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build test
      - name: Require validation to be read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
