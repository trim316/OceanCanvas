name: R1-228 v88 bounded performance extraction

on:
  push:
    branches:
      - work/r1-228-v88-perf-extract

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refuse source drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9eb3c8d5f49f5dce213f624b8e514049208d09d9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r1-228-v88-perf-extract.yml"
      - name: Download retained candidate diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir retained
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12297647419/zip > candidate.zip
          unzip -q candidate.zip -d retained
          rm candidate.zip
      - name: Extract bounded performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('retained')
          out = Path('r1-228-v88-performance.txt')
          suffixes = {'.log', '.txt', '.json', '.properties', '.csv'}
          needles = re.compile(r'(performance|budget|finaliz|physical|lighting|pending|seal|latency|tick|backlog|pressure|slow)', re.I)
          files = []
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in suffixes:
                  files.append(p)
          files.sort(key=lambda p: (p.stat().st_size, str(p)))
          lines = []
          total_matches = 0
          for p in files:
              size = p.stat().st_size
              # Read only text-like files no larger than 32 MiB; for larger logs stream the tail.
              try:
                  if size <= 32 * 1024 * 1024:
                      text = p.read_text(errors='replace').splitlines()
                  else:
                      with p.open('rb') as f:
                          f.seek(max(0, size - 8 * 1024 * 1024))
                          text = f.read().decode(errors='replace').splitlines()
              except OSError:
                  continue
              matches = [ln for ln in text if needles.search(ln)]
              if not matches:
                  continue
              lines.append(f'### {p.relative_to(root)} size={size} matches={len(matches)}')
              # Preserve first and last evidence without creating another huge artifact.
              chosen = matches[:120]
              if len(matches) > 240:
                  chosen += ['... bounded middle omitted ...'] + matches[-120:]
              elif len(matches) > 120:
                  chosen += matches[120:]
              lines.extend(chosen)
              total_matches += len(matches)
              if len(lines) >= 12000:
                  lines.append('... global bounded extraction limit reached ...')
                  break
          header = [
              'R1-228 read-only bounded extraction',
              'source_run=39492068954',
              'source_artifact=12297647419',
              'source_sha=9eb3c8d5f49f5dce213f624b8e514049208d09d9',
              f'text_files_considered={len(files)}',
              f'matching_lines_observed={total_matches}',
              '',
          ]
          out.write_text('\n'.join(header + lines) + '\n')
          if total_matches == 0:
              raise SystemExit('no performance-bearing text evidence found')
          PY
      - name: Upload bounded extraction only
        uses: actions/upload-artifact@v4
        with:
          name: r1-228-v88-performance
          path: r1-228-v88-performance.txt
          retention-days: 14
          if-no-files-found: error
