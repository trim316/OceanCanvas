name: Physical radius ladder controller
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-controller
  cancel-in-progress: false
jobs:
  continue-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPECTED_BUILD: v253.125.139
      EXPECTED_SOURCE_COMMIT: fb84e2d10722ccb30ea2f67f192678dc81c76bc4
      EXPECTED_JAR_SHA256: e11c4944a852ccfeac84960cbb3716fe3b47b8a8ae035330e0e01f7472c0010f
      CONTROLLER_LINEAGE_ROOT: 53df6f65305e650a6dc104ce5cbcc9e4cba5a8ec
      OC_LADDER_PARENT: verified-ladder-parent
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Refuse overlap with an active physical ladder or correction segment
        id: overlap
        shell: bash
        run: |
          active=$(gh api --paginate repos/${{ github.repository }}/actions/runs \
            --jq '.workflow_runs[] | select(.status=="in_progress" or .status=="queued") | select(.name|test("^Physical radius ")) | select(.name!="Physical radius ladder controller") | .id' | head -1)
          if [ -n "$active" ]; then
            echo "Physical ladder/correction run $active is still active; controller will not race it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve newest authoritative ladder checkpoint artifact
        if: steps.overlap.outputs.skip != 'true'
        id: checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          current_run=int(os.environ['GITHUB_RUN_ID'])
          lineage_root=os.environ['CONTROLLER_LINEAGE_ROOT']
          raw=subprocess.check_output(['gh','api','--paginate',f'repos/{repo}/actions/artifacts'], text=True)
          dec=json.JSONDecoder(); i=0; artifacts=[]
          while i < len(raw):
              while i < len(raw) and raw[i].isspace(): i+=1
              if i>=len(raw): break
              obj,j=dec.raw_decode(raw,i); i=j; artifacts.extend(obj.get('artifacts',[]))
          usable=[]
          for a in artifacts:
              if a.get('expired'): continue
              run_id=int(a.get('workflow_run',{}).get('id',-1))
              if run_id == current_run: continue
              name=a.get('name','')
              if re.match(r'^physical-radius-1k-v139(?:-s\d+)?-candidate$',name):
                  usable.append(a); continue
              if name!='physical-radius-ladder-checkpoint': continue
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}'], text=True))
              head_sha=str(run.get('head_sha','')).strip()
              if not head_sha: continue
              ancestry=subprocess.run(['git','merge-base','--is-ancestor',lineage_root,head_sha], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if ancestry.returncode == 0: usable.append(a)
          if not usable:
              raise SystemExit('No authoritative v139 predecessor checkpoint artifact found; refusing to synthesize a fresh campaign')
          usable.sort(key=lambda a:a['created_at'], reverse=True)
          a=usable[0]; run_id=a['workflow_run']['id']
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}'], text=True))
          conclusion=run.get('conclusion') or 'unknown'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"artifact_id={a['id']}\nartifact_name={a['name']}\nsource_run={run_id}\nsource_conclusion={conclusion}\n")
          print(json.dumps({'artifact':a['name'],'id':a['id'],'sourceRun':run_id,'sourceConclusion':conclusion,'createdAt':a['created_at'],'lineageRoot':lineage_root}))
          PY
      - name: Download exact predecessor artifact
        if: steps.overlap.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p verified-ladder-parent
          gh api repos/${{ github.repository }}/actions/artifacts/${{ steps.checkpoint.outputs.artifact_id }}/zip > /tmp/ladder-parent.zip
          unzip -q /tmp/ladder-parent.zip -d verified-ladder-parent
      - name: Verify, classify, continue or promote exact ladder state
        if: steps.overlap.outputs.skip != 'true'
        run: python3 scripts/ci/physical_ladder_controller.py
      - name: Preserve controller checkpoint
        if: steps.overlap.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-radius-ladder-checkpoint
          path: |
            physical-radius-1k-evidence/
            physical-radius-2k-evidence/
            physical-radius-5k-evidence/
            physical-radius-10k-evidence/
            production-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
