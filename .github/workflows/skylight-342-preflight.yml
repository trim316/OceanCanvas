name: Skylight failure 342 disposable diagnostic preflight
on:
  push:
    branches: [work/lighting-failure-context-342]
    paths:
      - '.github/workflows/skylight-342-preflight.yml'
      - 'runtime-src/**'
      - 'scripts/ci/hosted-performance-preflight.py'
  pull_request:
    paths:
      - '.github/workflows/skylight-342-preflight.yml'
      - 'runtime-src/**'
      - 'scripts/ci/hosted-performance-preflight.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skylight-342-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact diagnostic source
        run: git rev-parse HEAD | tee DIAGNOSTIC_SOURCE_SHA.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile Minecraft adapter and run focused tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
          sha256sum build/libs/*.jar | tee ../DIAGNOSTIC_JAR_SHA256.txt
      - name: Short disposable production-path preflight
        run: |
          python3 -m py_compile scripts/ci/hosted-performance-preflight.py
          python3 scripts/ci/hosted-performance-preflight.py
      - name: Fail closed on absent or failed preflight verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('hosted-performance-preflight/VERDICT.json')
          if not p.is_file():
              raise SystemExit('No preflight verdict; no promotion')
          d=json.loads(p.read_text())
          print(json.dumps({k:d.get(k) for k in ('verdict','source_sha','elapsed_s','chunk_throughput_per_min','max_no_progress_s','peak_sampled_java_rss_kib')},sort_keys=True))
          if d.get('verdict')!='PASS':
              raise SystemExit('Short preflight failed; no promotion')
          PY
      - name: Preserve first failure, exact source, jar and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skylight-342-diagnostic-preflight
          path: |
            DIAGNOSTIC_SOURCE_SHA.txt
            DIAGNOSTIC_JAR_SHA256.txt
            hosted-performance-preflight/
            runtime-src/run/logs/latest.log
            runtime-src/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  geometry-342:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile exact diagnostic runtime
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
          git rev-parse HEAD > ../DIAGNOSTIC_SOURCE_SHA.txt
          sha256sum build/libs/*.jar > ../DIAGNOSTIC_JAR_SHA256.txt
      - name: Probe failing chunk coordinates in fresh disposable world
        env:
          OCEANCANVAS_PROBE_GEOMETRY: skylight-342
        run: python3 scripts/ci/hosted-performance-preflight.py
      - name: Require strict geometry verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('hosted-performance-preflight/VERDICT.json')
          if not p.exists(): raise SystemExit('Missing geometry verdict')
          d=json.loads(p.read_text())
          if d.get('verdict')!='PASS' or d.get('workload',{}).get('geometry')!='skylight-342':
              raise SystemExit('Skylight geometry preflight failed; release remains blocked')
          PY
      - name: Retain exact source, jar, metrics and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skylight-342-geometry-preflight
          path: |
            DIAGNOSTIC_SOURCE_SHA.txt
            DIAGNOSTIC_JAR_SHA256.txt
            hosted-performance-preflight/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14

  geometry-342-neighbors:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile exact diagnostic runtime
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
          git rev-parse HEAD > ../DIAGNOSTIC_SOURCE_SHA.txt
          sha256sum build/libs/*.jar > ../DIAGNOSTIC_JAR_SHA256.txt
      - name: Probe nine neighboring chunks in fresh disposable world
        env:
          OCEANCANVAS_PROBE_GEOMETRY: skylight-342-neighbors
        run: python3 scripts/ci/hosted-performance-preflight.py
      - name: Require strict geometry verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('hosted-performance-preflight/VERDICT.json')
          if not p.exists(): raise SystemExit('Missing geometry verdict')
          d=json.loads(p.read_text())
          if d.get('verdict')!='PASS' or d.get('workload',{}).get('geometry')!='skylight-342-neighbors':
              raise SystemExit('Skylight geometry preflight failed; release remains blocked')
          PY
      - name: Retain exact source, jar, metrics and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skylight-342-neighbor-geometry-preflight
          path: |
            DIAGNOSTIC_SOURCE_SHA.txt
            DIAGNOSTIC_JAR_SHA256.txt
            hosted-performance-preflight/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
