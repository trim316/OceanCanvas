name: Saved 20k release-blocker checkpoint continuation 105
on:
  push:
    branches: [work/v105-scale-release-continuation]
    paths: ['.github/workflows/release105.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: release105-20k
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCALE: 20k
      PROFILE_MODE: candidate
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original hosted Java identity
        run: java -version 2>&1 | tee java-identity.txt; grep -F '25.0.4.1+1' java-identity.txt
      - name: Build frozen 105 candidate and all client/server tests
        run: |
          cd production-src
          chmod +x gradlew
          ./gradlew --no-daemon build --warning-mode=fail
      - name: Continue newest verified 97 world with first-failure guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_release105.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release105-20k-candidate
          path: |
            release-continuation-20k-candidate/
            !release-continuation-20k-candidate/parent.zip
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
