name: Short exact-source performance A/B screening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/short-performance-ab-screen.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: short-performance-ab-screen
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-v142, combined-plus]
        trial: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin runtime and trusted benchmark sources
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          git fetch origin main work/perf-combined-plus-rebased-20261111
          HARNESS_SHA=$(git rev-parse origin/main)
          if [ "$VARIANT" = baseline-v142 ]; then
            RUNTIME_SHA=7ca560ce5c9d5375c3ce6fb2fb8a637c8c31004c
          else
            RUNTIME_SHA=$(git rev-parse FETCH_HEAD)
            # FETCH_HEAD is not an authority for branch identity: resolve the explicit ref.
            RUNTIME_SHA=$(git ls-remote origin refs/heads/work/perf-combined-plus-rebased-20261111 | cut -f1)
          fi
          test -n "$RUNTIME_SHA"
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git checkout --detach "$RUNTIME_SHA"
          git archive "$HARNESS_SHA" scripts/ci | tar -x -C .
          printf '%s\n' "$RUNTIME_SHA" > RUNTIME_SOURCE_SHA.txt
          printf '%s\n' "$HARNESS_SHA" > HARNESS_SOURCE_SHA.txt
          git diff --quiet "$RUNTIME_SHA" -- runtime-src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact runtime
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
          sha256sum build/libs/*.jar > ../RUNTIME_JAR_SHA256.txt
      - name: Run disposable 128-block benchmark
        env:
          OC_BENCH_NAME: ${{ matrix.variant }}
          OC_BENCH_CANVAS: '128'
          OC_BENCH_SEED: '4182042'
          OC_BENCH_WRITES: '4096'
          OC_BENCH_CHECKS: '16384'
          OC_BENCH_WALL_US: '15000'
          OC_BENCH_PHYSICAL_TICKS: '2'
          OC_BENCH_LIGHT_TICKS: '20'
        run: |
          python3 -m py_compile scripts/ci/full-canvas-throughput-benchmark.py
          python3 scripts/ci/full-canvas-throughput-benchmark.py
      - name: Preserve exact-source and first-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-ab-${{ matrix.variant }}-trial-${{ matrix.trial }}
          path: |
            RUNTIME_SOURCE_SHA.txt
            HARNESS_SOURCE_SHA.txt
            RUNTIME_JAR_SHA256.txt
            throughput-benchmark-${{ matrix.variant }}/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
  compare:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: short-ab-*
          path: ab-results
      - name: Fail closed on incomplete evidence; screen only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('ab-results')
          data={}
          for trial in (1,2):
              for name in ('baseline-v142','combined-plus'):
                  folder=root/f'short-ab-{name}-trial-{trial}'
                  files=list(folder.glob('throughput-benchmark-*/result.json'))
                  if len(files)!=1:
                      raise SystemExit(f'{name} trial {trial}: missing/ambiguous evidence')
                  r=json.loads(files[0].read_text())
                  evidence={}
                  for filename in ('RUNTIME_SOURCE_SHA.txt','HARNESS_SOURCE_SHA.txt','RUNTIME_JAR_SHA256.txt'):
                      p=folder/filename
                      if not p.is_file() or not p.read_text().strip():
                          raise SystemExit(f'{name} trial {trial}: missing {filename}')
                      evidence[filename]=p.read_text().strip()
                  if r.get('verdict')!='PASS' or r.get('chunks',0)<=0 or r.get('verified_journals')!=r.get('chunks'):
                      raise SystemExit(f'{name} trial {trial}: correctness/integrity not proven')
                  if r.get('source')!=evidence['RUNTIME_SOURCE_SHA.txt']:
                      raise SystemExit(f'{name} trial {trial}: benchmark runtime source mismatch')
                  if name=='baseline-v142' and r['source']!='7ca560ce5c9d5375c3ce6fb2fb8a637c8c31004c':
                      raise SystemExit('baseline source mismatch')
                  if not math.isfinite(r.get('throughput_chunks_per_min',float('nan'))) or r['throughput_chunks_per_min']<=0:
                      raise SystemExit('missing throughput')
                  if r.get('peak_java_rss_kib',0)<=0 or not math.isfinite(r.get('max_no_progress_s',float('nan'))):
                      raise SystemExit('missing memory/no-progress evidence')
                  data[(name,trial)]=(r,evidence)
          for name in ('baseline-v142','combined-plus'):
              first=data[(name,1)][1]
              second=data[(name,2)][1]
              if first!=second:
                  raise SystemExit(f'{name}: runtime/JAR/harness provenance changed between repeats')
          for trial in (1,2):
              a,ae=data[('baseline-v142',trial)]
              b,be=data[('combined-plus',trial)]
              if ae['HARNESS_SOURCE_SHA.txt']!=be['HARNESS_SOURCE_SHA.txt']:
                  raise SystemExit('noncomparable harness source')
              for field in ('canvas_blocks','chunks','heap','writes_per_tick','checks_per_tick','wall_budget_us','physical_settle_ticks','light_settle_ticks'):
                  if a.get(field)!=b.get(field):
                      raise SystemExit(f'noncomparable {field}')
              gain=b['throughput_chunks_per_min']/a['throughput_chunks_per_min']-1
              print(f'trial={trial} baseline={a["throughput_chunks_per_min"]:.3f} candidate={b["throughput_chunks_per_min"]:.3f} chunks/min gain={gain:.1%} baseline_rss={a["peak_java_rss_kib"]} candidate_rss={b["peak_java_rss_kib"]} baseline_gap={a["max_no_progress_s"]:.3f} candidate_gap={b["max_no_progress_s"]:.3f}')
              if gain < 0.15:
                  raise SystemExit(f'trial {trial}: candidate below 15% improvement')
          print('REPEATED SHORT SCREEN PASS ONLY: no 1k gate or release promotion authorized.')
          PY
