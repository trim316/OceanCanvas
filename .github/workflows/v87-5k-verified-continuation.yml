name: Continue verified 5k exact v87 checkpoint segment2
on:
  push:
    branches: [work/v87-5k-verified-continuation]
    paths: ['.github/workflows/v87-5k-verified-continuation.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v87-5k-verified-continuation
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate]
    env:
      PROFILE_MODE: ${{ matrix.mode }}
    steps:
      - name: Refuse blind rerun
        run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Profile immutable failed checkpoint copy at original 14 GiB heap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_5k_exact_v87.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v87-5k-verified-continuation-${{ matrix.mode }}-14g
          path: profile-${{ matrix.mode }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
