name: Ocean Canvas Parallel Saved-World Replays
on:
  push:
    branches: [work/release-test-pipeline]
    paths: ['release-tests/active-replay.json']
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Run containing a stopped-world replay manifest
        required: true
        type: string
      parent_artifact:
        description: Artifact name, such as diagnostic-controlled-waterfall-inflow
        required: true
        type: string
      candidates:
        description: 'JSON array: [{"name":"fix","run":"123","source":"40-character SHA","build":"v253.125.80"}]'
        required: true
        type: string
      seconds:
        description: Observation seconds per isolated copy (1-1800)
        default: '180'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: replay-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parent_run_id: ${{ steps.request.outputs.parent_run_id }}
      parent_artifact: ${{ steps.request.outputs.parent_artifact }}
      seconds: ${{ steps.request.outputs.seconds }}
      candidates: ${{ steps.request.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        env:
          REPLAY_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/ci/replay_request.py
  replay:
    needs: plan
    name: Replay saved failure / ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.plan.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.parent_artifact }}
          run-id: ${{ needs.plan.outputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: parent-snapshot
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          run-id: ${{ matrix.candidate.run }}
          github-token: ${{ github.token }}
          path: production-candidate
      - name: Observe each candidate on its own immutable-parent copy
        env:
          REPLAY_BUILD: ${{ matrix.candidate.build }}
          REPLAY_SOURCE: ${{ matrix.candidate.source }}
          REPLAY_SECONDS: ${{ needs.plan.outputs.seconds }}
        run: |
          python3 scripts/ci/snapshot_replay.py --parent parent-snapshot --out replay-evidence \
            --candidate production-candidate --build "$REPLAY_BUILD" --source "$REPLAY_SOURCE" \
            --seconds "$REPLAY_SECONDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ strategy.job-index }}
          path: |
            replay-evidence/*.json
            replay-evidence/*.log
            replay-evidence/*.jfr
            replay-evidence/*.zip
            replay-evidence/server/world/
            replay-evidence/server/config/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
