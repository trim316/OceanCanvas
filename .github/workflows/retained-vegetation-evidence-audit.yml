name: Retained vegetation evidence audit
on:
  push:
    branches: [work/forever-world-release-push]
    paths: ['.github/workflows/retained-vegetation-evidence-audit.yml']
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 37715525517
          name: r1-136-ocean-vegetation-1k-regression
          github-token: ${{ github.token }}
          path: retained
      - run: python3 -m pip install --quiet nbtlib
      - name: Verify retained exact candidate and inspect saved evidence
        run: |
          python3 - <<'PY'
          import pathlib, json, hashlib, io, gzip, zlib
          import nbtlib
          root=pathlib.Path('retained')
          identity_path=next(root.rglob('identity.json'))
          evidence=identity_path.parent
          identity=json.loads(identity_path.read_text())
          assert identity['sourceCommit']=='9229b551d8b8071d696bc06bcd3307be01130194', identity
          assert identity['javaMaxHeapGiB']==14, identity
          jars=[p for p in root.rglob('oceancanvas-26.2-v253.125.79.jar')]
          assert jars, 'candidate/installed JAR missing'
          for p in jars:
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert digest==identity['jarSha256'], (str(p),digest)
          print('EXACT_IDENTITY', json.dumps(identity,sort_keys=True))
          for name in ('acceptance.json','restart.json'):
              p=evidence/name
              print(name,p.read_text())
          for name in ('console.log','restart.log'):
              lines=(evidence/name).read_text(errors='replace').splitlines()
              warnings=[l for l in lines if 'BLOCKS_CHANGED_DURING_LIGHT_SETTLE' in l]
              failures=[l for l in lines if 'OCEAN-VEGETATION-FAILED' in l]
              print(name,'mutationWarnings',len(warnings),'vegetationFailures',len(failures))
              print('\n'.join(warnings[:5]))
          regions=[p for p in evidence.rglob('r.*.*.mca') if p.parent.name=='region']
          print('REGION_PATHS', [str(p.relative_to(evidence)) for p in regions[:5]])
          assert regions, 'saved region evidence missing'
          print('SAVED_REGIONS',len(regions),'bytes',sum(p.stat().st_size for p in regions))
          counts={name:0 for name in ('minecraft:seagrass','minecraft:tall_seagrass','minecraft:kelp','minecraft:kelp_plant')}
          samples=[]
          unsupported=[]
          samplecoords={(x,z) for x in (-31,-16,0,16,30) for z in (-31,-16,0,16,30)}
          for region in regions:
              data=region.read_bytes()
              for i in range(1024):
                  sector=int.from_bytes(data[i*4:i*4+3],'big')
                  if not sector: continue
                  at=sector*4096
                  size=int.from_bytes(data[at:at+4],'big')
                  codec=data[at+4]
                  raw=data[at+5:at+4+size]
                  raw=gzip.decompress(raw) if codec==1 else zlib.decompress(raw) if codec==2 else raw
                  chunk=nbtlib.File.parse(io.BytesIO(raw))
                  cx,cz=int(chunk.get('xPos',9999)),int(chunk.get('zPos',9999))
                  if (cx,cz) in samplecoords:
                      sections={int(sec['Y']):sec for sec in chunk.get('sections',[])}
                      def block(x,y,z):
                          sec=sections.get(y//16)
                          if sec is None: return {'Name':'minecraft:air'}
                          states=sec.get('block_states',{})
                          palette=states.get('palette',[])
                          if not palette: return {'Name':'minecraft:air'}
                          if len(palette)==1: return palette[0]
                          bits=max(4,(len(palette)-1).bit_length())
                          per=64//bits
                          index=((y%16)*256+z*16+x)
                          words=states.get('data',[])
                          word=int(words[index//per]) & ((1<<64)-1)
                          return palette[(word>>((index%per)*bits))&((1<<bits)-1)]
                      found=0
                      for sy in sections:
                          for y in range(sy*16,sy*16+16):
                              if y < -40 or y > 62: continue
                              for z in range(16):
                                  for x in range(16):
                                      entry=block(x,y,z)
                                      name=str(entry.get('Name',''))
                                      if name not in counts: continue
                                      found+=1
                                      props=entry.get('Properties',{})
                                      if name=='minecraft:tall_seagrass' and str(props.get('half',''))=='upper': continue
                                      below=str(block(x,y-1,z).get('Name',''))
                                      if below in ('minecraft:air','minecraft:water'):
                                          unsupported.append([cx*16+x,y,cz*16+z,name,below])
                      samples.append({'chunk':[cx,cz],'plantBlocks':found})
                  for section in chunk.get('sections',[]):
                      for entry in section.get('block_states',{}).get('palette',[]):
                          name=str(entry.get('Name',''))
                          if name in counts: counts[name]+=1
          print('VEGETATION_PALETTE_PRESENCE',json.dumps(counts,sort_keys=True))
          print('SAMPLED_SUPPORT',json.dumps({'samples':samples,'unsupportedAirWaterSupports':unsupported},sort_keys=True))
          assert not unsupported, 'sampled plants have air/water support'
          PY
