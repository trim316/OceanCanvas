name: R1-180 Attribute cooperative phase pressure
on:
  push:
    branches: [work/r1-180-cooperative-phase-attribution]
permissions:
  contents: write
jobs:
  attribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require diagnostic-only branch
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/core-proof/R1-179_R1-176_WALL_ATTRIBUTION.txt
          test -f recovery/core-proof/r1_180_cooperative_phase_attribution.py
          if git diff --name-only 011e99942a1a709fc3b0c740f1299c641cfeb914...HEAD | grep '^production-src/'; then
            echo 'R1-180 must not change production source' >&2
            exit 1
          fi
      - name: Build bounded attribution
        run: python3 recovery/core-proof/r1_180_cooperative_phase_attribution.py
      - name: Persist exact attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/core-proof/R1-180_R1-176_COOPERATIVE_PHASE_ATTRIBUTION.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'persist exact R1-176 cooperative phase attribution'
          git push origin HEAD:work/r1-180-cooperative-phase-attribution
