name: Saved 20k checkpoint aged native FULL admission
on:
  push:
    branches: [work/v112-aged-native-full-admission]
    paths: ['.github/workflows/release112-aged-native-full.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: release112-aged-native-full-20k
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCALE: 20k
      PROFILE_MODE: candidate
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original hosted Java identity
        run: java -version 2>&1 | tee java-identity.txt; grep -F '25.0.4.1+1' java-identity.txt
      - name: Verify exact Java ZGC runtime support before world load
        run: |
          java -Xms1G -Xmx14G -XX:+UseZGC -XX:+PrintFlagsFinal -version > zgc-flags.txt 2>&1
          grep -E 'UseZGC.*= true ' zgc-flags.txt
          grep -E 'UseG1GC.*= false ' zgc-flags.txt
      - name: Full client server build and regression tests before world
        working-directory: production-src
        run: bash gradlew build --console=plain
      - name: Download verified newest111 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40794921496
          name: release111-cooperative-20k-candidate
          path: verified111-parent
      - name: Continue newest verified111 world with112 admission candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_release112_aged_native_full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release112-aged-native-full-candidate
          path: |
            aged-native-full-continuation-20k-candidate/
            !aged-native-full-continuation-20k-candidate/parent.zip
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
