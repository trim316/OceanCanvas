name: Saved 20k checkpoint G1 young-generation bound
on:
  push:
    branches: [work/v105-scale-release-continuation]
    paths: ['.github/workflows/release105-young-bound.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: release105-young-bound-20k
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCALE: 20k
      PROFILE_MODE: candidate
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original hosted Java identity
        run: java -version 2>&1 | tee java-identity.txt; grep -F '25.0.4.1+1' java-identity.txt
      - name: Verify bounded automatic G1 runtime flags
        run: |
          java -Xms1G -Xmx14G -XX:+UnlockExperimentalVMOptions -XX:G1MaxNewSizePercent=20 -XX:+PrintFlagsFinal -version > young-bound-flags.txt 2>&1
          grep -E 'G1MaxNewSizePercent.*= 20 ' young-bound-flags.txt
          grep -E 'UseG1GC.*= true ' young-bound-flags.txt
      - name: Continue newest verified105world with SAMEJAR and first-failure guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_release105_young_bound.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release105-young-bound-20k-candidate
          path: |
            young-bound-continuation-20k-candidate/
            !young-bound-continuation-20k-candidate/parent.zip
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
