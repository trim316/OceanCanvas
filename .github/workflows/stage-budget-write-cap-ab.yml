name: Experimental stage budget and write-cap A/B
on:
  workflow_dispatch:
  push:
    branches: [work/perf-direct-cost-scale-20261116]
    paths: ['.github/workflows/stage-budget-write-cap-ab.yml']
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            writes: '4096'
            wall: '15000'
          - mode: higher-write-cap
            writes: '8192'
            wall: '15000'
          - mode: longer-stage-budget
            writes: '4096'
            wall: '30000'
          - mode: both
            writes: '8192'
            wall: '30000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin experimental runtime and main CI harness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main work/perf-direct-cost-scale-20261116
          HARNESS_SHA=$(git rev-parse origin/main)
          RUNTIME_SHA=$(git rev-parse origin/work/perf-direct-cost-scale-20261116)
          git checkout --detach "$RUNTIME_SHA"
          git archive "$HARNESS_SHA" scripts/ci | tar -x -C .
          git checkout "$RUNTIME_SHA" -- scripts/ci/full-canvas-throughput-benchmark.py
          echo "$RUNTIME_SHA" > RUNTIME_SOURCE_SHA.txt
          echo "$HARNESS_SHA" > HARNESS_SOURCE_SHA.txt
          git diff --quiet "$RUNTIME_SHA" -- runtime-src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact runtime
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
          sha256sum build/libs/*.jar > ../RUNTIME_JAR_SHA256.txt
      - name: Verify full 256 chunk disposable geometry and timing
        env:
          OC_BENCH_NAME: stage-budget-${{ matrix.mode }}
          JAVA_TOOL_OPTIONS: -Doceancanvas.experimentalDirectSectionAuthor=false
          OC_BENCH_CANVAS: '256'
          OC_BENCH_SEED: '742881'
          OC_BENCH_WRITES: ${{ matrix.writes }}
          OC_BENCH_CHECKS: '16384'
          OC_BENCH_WALL_US: ${{ matrix.wall }}
          OC_BENCH_PHYSICAL_TICKS: '2'
          OC_BENCH_LIGHT_TICKS: '20'
        run: python3 scripts/ci/full-canvas-throughput-benchmark.py
      - name: Preserve verification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-budget-${{ matrix.mode }}
          path: |
            RUNTIME_SOURCE_SHA.txt
            HARNESS_SOURCE_SHA.txt
            RUNTIME_JAR_SHA256.txt
            throughput-benchmark-stage-budget-${{ matrix.mode }}/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
