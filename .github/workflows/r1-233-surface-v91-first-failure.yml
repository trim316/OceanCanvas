name: R1-233 surface retained v91 first failure
on:
  push:
    branches: [work/r1-233-surface-v91-first-failure]
    paths: ['.github/workflows/r1-233-surface-v91-first-failure.yml']
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      first: ${{ steps.read.outputs.first }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse product drift from exact v91
        run: git diff --exit-code 270c99a9e8c62873606e9358c2eddf28f82e8c9e -- production-src
      - name: Read retained bounded evidence
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12342603430/zip" \
            -o retained.zip
          echo "bcd8f6277b9d552db2dddf3f6c368dbd716afd02f8b2ab1dd17d78723ce1f3e1  retained.zip" | sha256sum --check --strict
          unzip -p retained.zip summary.json > summary.json
          first="$(jq -r '.firstPerformanceFailure // "NONE"' summary.json | tr '\n' ' ' | cut -c1-180)"
          printf 'first=%s\n' "$first" >> "$GITHUB_OUTPUT"
  surface:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    name: "first: ${{ needs.extract.outputs.first }}"
    steps:
      - run: test -n '${{ needs.extract.outputs.first }}'
