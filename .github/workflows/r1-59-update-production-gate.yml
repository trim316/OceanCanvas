name: R1-59 Focused Production Validation

on:
  push:
    branches:
      - work/r1-59-sky-reset-threshold

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify v253.125.57 gate identity
        run: |
          grep -qx 'mod_version=26.2-v253.125.57' production-src/gradle.properties
          grep -q 'oceancanvas-26.2-v253.125.57.jar' .github/workflows/production-scale-release-gate.yml
          grep -q 'EXPECTED_BUILD: v253.125.57' .github/workflows/production-scale-release-gate.yml
      - name: Compile and run deterministic production tests
        working-directory: production-src
        run: ./gradlew build --warning-mode=fail
