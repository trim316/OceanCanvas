name: Changed146 completed-main LIGHT_ONLY proof with exact partial-edge scope
on:
  push:
    branches: [work/upper-sky146-main-light-proof]
    paths: ['.github/workflows/upper-sky146-main-light-proof.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  light146:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 7a328516c47b93ef209ea79737183851703a3edc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - name: Build changed146 and direct native regressions once
        run: |
          set -euo pipefail
          chmod +x production-src/gradlew
          (cd production-src && ./gradlew build --console=plain) 2>&1 | tee production-build.log
          python3 scripts/ci/prepare_completed_light_candidate146.py
      - name: Compile scope-only test driver against exact candidate
        env:
          OC_UPPER_CANDIDATE_JAR: ${{ github.workspace }}/production-candidate/oceancanvas-26.2-v253.125.146.jar
        run: (cd production-src && ./gradlew -I ../scripts/ci/fixtures/upper-sky-readout/build.init.gradle upperSkyReadoutJar --console=plain)
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore exact completed saved main world, no generation replay
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41190073161
          name: post142-cold-managed-evidence
          path: verified-light146-parent
      - name: Bounded nondestructive native LIGHT_ONLY proof segment
        run: python3 scripts/ci/completed142-light146.py
      - name: Preserve full source, failed input receipt and resulting saved world
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-sky146-main-light-proof
          path: |
            upper-sky146-evidence/
            production-candidate/
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
            scripts/ci/light146-completed-parent.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
