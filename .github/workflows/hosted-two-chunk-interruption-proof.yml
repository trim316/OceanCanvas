name: Ocean Canvas Disposable Two-Chunk Interruption Proof

# Disposable GitHub-hosted Minecraft only. Test exact combined pair-identity
# candidate; never run against a local Minecraft profile or production world.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-two-chunk-interruption-proof.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-disposable-two-chunk-interruption
  cancel-in-progress: false

jobs:
  second-chunk-interruption:
    name: Kill and resume second chunk with immutable first archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCEANCANVAS_TWO_CHUNK_SEED: '4182031'
      OCEANCANVAS_TWO_CHUNK_INTERRUPT_SECOND_AFTER: 'PREIMAGE_CAPTURED'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8a74ca25ab4ed8db37b11bef64bb77e8b0cb5ba2
          persist-credentials: false

      - name: Assert exact test source
        run: |
          test "$(git rev-parse HEAD)" = 8a74ca25ab4ed8db37b11bef64bb77e8b0cb5ba2
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile exact Fabric candidate and self-test
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Prove actual isolated second-chunk crash and two-archive cold restart
        run: |
          python3 -m py_compile scripts/ci/hosted-two-chunk-proof.py
          python3 scripts/ci/hosted-two-chunk-proof.py

      - name: Preserve all first-failure and cold-restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-two-chunk-interruption
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-two-chunk-proof/
            hosted-minecraft-proof/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
