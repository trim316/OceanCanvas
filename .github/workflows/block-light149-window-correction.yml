name: Correct bounded LIGHT_ONLY producer global-debt cycle; same hosted149 binary
on:
  push:
    branches: [work/block-light149-window-correction]
    paths: ['.github/workflows/block-light149-window-correction.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  light146:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: 53c463584f6949624472c248a7623fe03737f9a7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
      - run: python3 -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Restore exact completed saved main world, no generation replay
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41271926195
          name: block-light149-s2-proof
          path: verified-light149-parent
      - name: Compile corrected bounded producer against exact already-passed hosted149 binary
        env:
          OC_UPPER_CANDIDATE_JAR: ${{ github.workspace }}/verified-light149-parent/production-candidate/oceancanvas-26.2-v253.125.149.jar
        run: (cd production-src && chmod +x gradlew && ./gradlew -I ../scripts/ci/fixtures/upper-sky-readout/build.init.gradle upperSkyReadoutJar --console=plain)
      - name: Bounded nondestructive native LIGHT_ONLY proof segment
        run: python3 scripts/ci/completed-light149-window.py
      - name: Preserve full source, failed input receipt and resulting saved world
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-light149-window-proof
          path: |
            block-light149-window-evidence/
            production-candidate/
            production-src/build/test-results/test/
            production-build.log
            java-identity.txt
            scripts/ci/light149-window-parent.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
