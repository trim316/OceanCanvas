name: R1-257 Pressure Park Reservation Rollback
on:
  push:
    branches:
      - work/r1-257-pressure-park-reservation-rollback
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-257-pressure-park-reservation-rollback
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused reservation rollback repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          s=p.read_text()
          old='''\t\t\tif (session.pendingTicks.remove(packed) == OceanCanvasPrimitiveLongIntMap.ABSENT) {\n\t\t\t\tsession.pendingWorkOrder.offer(packed);\n\t\t\t\tcontinue;\n\t\t\t}\n'''
          new='''\t\t\tif (session.pendingTicks.remove(packed) == OceanCanvasPrimitiveLongIntMap.ABSENT) {\n\t\t\t\t// R1-257: putIfAbsent above reserved authoritative pressure debt before\n\t\t\t\t// we proved this pending entry could actually be retired. If that retirement\n\t\t\t\t// loses its race, roll back only the reservation created by this attempt.\n\t\t\t\t// Otherwise pressureParkUntilTick can retain a chunk with no matching heap\n\t\t\t\t// node, making the debt permanently unwakeable. Existing reservations are\n\t\t\t\t// never removed here because their scheduler node remains authoritative.\n\t\t\t\tif (previous == OceanCanvasPrimitiveLongLongMap.ABSENT) {\n\t\t\t\t\tlightRecoverySession().pressureParkUntilTick.remove(packed, due);\n\t\t\t\t}\n\t\t\t\tsession.pendingWorkOrder.offer(packed);\n\t\t\t\tcontinue;\n\t\t\t}\n'''
          if new in s:
              print('R1-257 source already present')
          else:
              n=s.count(old)
              if n != 1: raise SystemExit(f'expected exactly one generic pressure reservation failure path, found {n}')
              p.write_text(s.replace(old,new,1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java').read_text()
          anchor='if (session.pendingTicks.remove(packed) == OceanCanvasPrimitiveLongIntMap.ABSENT) {'
          assert s.count(anchor) >= 1
          start=s.index(anchor)
          block=s[start:start+1400]
          assert 'previous == OceanCanvasPrimitiveLongLongMap.ABSENT' in block
          assert 'pressureParkUntilTick.remove(packed, due)' in block
          assert block.index('pressureParkUntilTick.remove(packed, due)') < block.index('session.pendingWorkOrder.offer(packed)')
          assert 'if (previous == OceanCanvasPrimitiveLongLongMap.ABSENT) session.retryLedger.offerPressurePark(packed, due);' in s
          print('R1-257 reservation rollback regression PASS')
          PY
          git diff --check
      - name: Compile and run production regressions
        working-directory: production-src
        run: ./gradlew --no-daemon test
      - name: Persist exact tested product source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java; then
            echo 'No product delta to commit'
            exit 0
          fi
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'R1-257: rollback unbacked pressure reservations'
          git push origin HEAD:work/r1-257-pressure-park-reservation-rollback
