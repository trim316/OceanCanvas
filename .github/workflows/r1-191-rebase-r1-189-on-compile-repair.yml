name: R1-191 Rebase proof reuse on delayed-count compile repair

on:
  push:
    branches: [work/r1-191-rebase-r1-189-on-compile-repair]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply focused R1-191 product change
        run: python3 scripts/ci/r1-191-reuse-pregen-physical-epoch.py
      - name: Assert compile repair and proof authority remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          f=production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          ! grep -q 'pendingTicks.countValuesAtLeast(' "$f"
          grep -q 'pendingTicks.sumKeys(' "$f"
          grep -q 'pendingTicks.get(packed)' "$f"
          grep -q 'R1-191: tryCompletePregenTarget' "$f"
          grep -q 'preLightPhysicalAuditComplete.remove(packed)' "$f"
          grep -q 'preLightPhysicalAuditComplete.contains(packed)' "$f"
          grep -q 'LIGHT_FINALIZER_TICK_BUDGET_NANOS = 8_000_000L' "$f"
          git diff --check
      - name: Compile and test production engine
        working-directory: production-src
        run: ./gradlew build --warning-mode=fail
      - name: Persist exact tested product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git diff --cached --check
          git diff --cached --quiet && { echo 'no product delta to persist'; exit 1; }
          git commit -m 'R1-191: reuse fresh Pregen physical proof after compile repair'
          git push origin HEAD:work/r1-191-rebase-r1-189-on-compile-repair
