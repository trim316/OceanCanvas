name: Rebased combined-plus 256-block safety screen

on:
  push:
    branches:
      - work/perf-combined-plus-rebased-20261111
    paths:
      - 'runtime-src/**'
      - 'scripts/ci/full-canvas-throughput-benchmark.py'
      - '.github/workflows/rebased-combined-plus-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebased-combined-plus-validation
  cancel-in-progress: false

jobs:
  corrected-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OC_BENCH_NAME: rebased-combined-plus-256-screen
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '256'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: '-Doceancanvas.flattenInflight=8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record candidate source
        run: git rev-parse HEAD | tee REBASED_COMBINED_PLUS_SOURCE.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Build rebased runtime
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
          sha256sum build/libs/*.jar | tee ../REBASED_COMBINED_PLUS_JAR_SHA256.txt
      - name: Run corrected current throughput harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/full-canvas-throughput-benchmark.py
          python3 scripts/ci/full-canvas-throughput-benchmark.py
      - name: Fail closed on exact 256-block screening evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          result = Path('throughput-benchmark-rebased-combined-plus-256-screen/result.json')
          if not result.is_file():
              raise SystemExit('Missing benchmark result; 256-block screen not certified')
          data = json.loads(result.read_text())
          source = Path('REBASED_COMBINED_PLUS_SOURCE.txt').read_text().strip()
          jars = Path('REBASED_COMBINED_PLUS_JAR_SHA256.txt').read_text().splitlines()
          if not source or data.get('source') != source:
              raise SystemExit('Runtime source mismatch')
          if not jars or any(len(line.split()) != 2 or len(line.split()[0]) != 64 for line in jars):
              raise SystemExit('Missing or malformed JAR provenance')
          if data.get('verdict') != 'PASS' or data.get('canvas_blocks') != 256:
              raise SystemExit('Not a successful exact 256-block workload')
          if data.get('chunks') != 256 or data.get('verified_journals') != 256:
              raise SystemExit('Incomplete chunk journals')
          for field in ('throughput_chunks_per_min', 'peak_java_rss_kib', 'max_no_progress_s'):
              value = data.get(field)
              if not isinstance(value, (int, float)) or not math.isfinite(value) or value < 0:
                  raise SystemExit('Invalid measurement: ' + field)
          if data['throughput_chunks_per_min'] <= 0 or data['peak_java_rss_kib'] <= 0:
              raise SystemExit('No positive throughput or memory sample')
          stages = data.get('stage_timing_ms', {})
          for stage in ('PHYSICAL_AUTHORED', 'PHYSICAL_SETTLED', 'PERSISTED', 'LIGHTING_SETTLED', 'VERIFIED'):
              sample = stages.get(stage, {})
              if sample.get('count') != 256:
                  raise SystemExit('Missing stage timing for ' + stage)
              for key in ('avg', 'p50', 'p95'):
                  v = sample.get(key)
                  if not isinstance(v, (int, float)) or not math.isfinite(v) or v < 0:
                      raise SystemExit('Invalid stage timing: ' + stage + '.' + key)
          print('256-block short screen evidence complete; NOT a restart, 1k, or release gate')
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebased-combined-plus-256-screen
          path: |
            REBASED_COMBINED_PLUS_SOURCE.txt
            REBASED_COMBINED_PLUS_JAR_SHA256.txt
            throughput-benchmark-rebased-combined-plus-256-screen/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
