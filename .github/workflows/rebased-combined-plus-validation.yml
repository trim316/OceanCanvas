name: Rebased combined-plus 256-block safety screen

on:
  push:
    branches:
      - work/perf-combined-plus-rebased-20261111
    paths:
      - 'runtime-src/**'
      - 'scripts/ci/full-canvas-throughput-benchmark.py'
      - '.github/workflows/rebased-combined-plus-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebased-combined-plus-validation
  cancel-in-progress: true

jobs:
  corrected-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OC_BENCH_NAME: rebased-combined-plus-256-screen
      OC_BENCH_HEAP: default
      OC_BENCH_WRITES: '4096'
      OC_BENCH_CHECKS: '16384'
      OC_BENCH_WALL_US: '15000'
      OC_BENCH_CANVAS: '256'
      OC_BENCH_LIGHT_TICKS: '20'
      OC_BENCH_PHYSICAL_TICKS: '2'
      OC_BENCH_SEED: '4182042'
      JAVA_TOOL_OPTIONS: '-Doceancanvas.flattenInflight=8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record candidate source
        run: git rev-parse HEAD | tee REBASED_COMBINED_PLUS_SOURCE.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Build rebased runtime
        working-directory: runtime-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
      - name: Run corrected current throughput harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/full-canvas-throughput-benchmark.py
          python3 scripts/ci/full-canvas-throughput-benchmark.py
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebased-combined-plus-256-screen
          path: |
            REBASED_COMBINED_PLUS_SOURCE.txt
            throughput-benchmark-rebased-combined-plus-256-screen/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
