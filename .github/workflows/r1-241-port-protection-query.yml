name: R1-241 Port Protection Query
on:
  push:
    branches: [work/r1-241-port-protection-query]
permissions:
  contents: read
jobs:
  validate-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert focused production delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3c1027c9f2291d5fde6b731b518b8a41c3c756ec HEAD
          test -f production-src/src/test/java/net/oceancanvas/mod/worldgen/ProtectionQuerySnapshotTest.java
          grep -q 'protectionQuerySnapshot' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasProtectedData.java
          grep -q 'snapshotRetainsMutableBoxGeometryAndReplacements' production-src/src/test/java/net/oceancanvas/mod/worldgen/ProtectionQuerySnapshotTest.java
      - name: Java 25 production tests and build
        shell: bash
        run: |
          set -euo pipefail
          cd production-src
          chmod +x gradlew
          ./gradlew --no-daemon test build
