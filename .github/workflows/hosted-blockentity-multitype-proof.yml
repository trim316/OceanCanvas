name: Ocean Canvas Disposable Multi-Type Block-Entity Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-blockentity-multitype-proof.yml'

permissions:
  contents: read

jobs:
  multitype:
    name: Restore chest and barrel NBT and cold reopen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 876cece2389f8960ec56ccc447b24cc83ddcd485
          persist-credentials: false
      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = 876cece2389f8960ec56ccc447b24cc83ddcd485
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail
      - name: Prove exact multi-type restore and immutable cold reopen
        run: |
          python3 -m py_compile scripts/ci/hosted-blockentity-multitype-proof.py
          python3 scripts/ci/hosted-blockentity-multitype-proof.py
      - name: Preserve exact proof and first-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-blockentity-multitype-proof
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-blockentity-multitype-proof/
            runtime-src/run/world/oceancanvas-core/single-chunk/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
