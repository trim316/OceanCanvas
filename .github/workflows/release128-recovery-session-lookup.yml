name: Saved 20k checkpoint recovery session lookup
on:
  push:
    branches: [work/v128-recovery-session-lookup]
    paths: ['.github/workflows/release128-recovery-session-lookup.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: release128-recovery-session-lookup-20k
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCALE: 20k
      PROFILE_MODE: candidate
    steps:
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify original hosted Java identity
        run: java -version 2>&1 | tee java-identity.txt; grep -F '25.0.4.1+1' java-identity.txt
      - name: Verify exact Java ZGC runtime support before world load
        run: |
          java -Xms1G -Xmx14G -XX:+UseZGC -XX:+PrintFlagsFinal -version > zgc-flags.txt 2>&1
          grep -E 'UseZGC.*= true ' zgc-flags.txt
          grep -E 'UseG1GC.*= false ' zgc-flags.txt
      - name: Full client server build and regression tests before world
        working-directory: production-src
        run: bash gradlew build --console=plain
      - name: Host sampler unit regressions
        run: python3 -m unittest discover -s scripts/ci -p test_host_stall_sampler.py
      - name: Download verified newest127 S3 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40883186589
          name: release127-cooperation-continuation-s3-candidate
          path: verified127-s3-parent
      - name: Validate recovery session lookups on verified127 S3 world with128 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/continue_release128_recovery_session_lookup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release128-recovery-session-lookup-candidate
          path: |
            recovery-session-lookup-continuation-20k-candidate/
            !recovery-session-lookup-continuation-20k-candidate/parent.zip
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
