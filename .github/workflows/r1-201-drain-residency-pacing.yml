name: R1-201 Drain Residency Pacing

on:
  push:
    branches: [work/r1-201-drain-residency-pacing]

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test automatic runtime handoff
        run: python3 scripts/ci/test-runtime-handoff.py
      - name: Apply focused product transform
        run: python3 scripts/ci/r1-201-drain-residency-pacing.py
      - name: Verify pressure-tail wake liveness and debt retention
        run: python3 scripts/ci/test-pressure-wake.py
      - name: Verify owned proof residency survives pressure parking
        run: python3 scripts/ci/test-pressure-parking-residency.py
      - name: Verify physical audit fast paths retain protection semantics
        run: python3 scripts/ci/test-physical-audit-fastpath.py
      - name: Verify partial-edge falling placement authority
        run: python3 scripts/ci/test-falling-edge-authority.py
      - name: Verify cooperative slices retain owned residency
        run: python3 scripts/ci/test-cooperative-yield-residency.py
      - name: Verify scan-local selection scope
        run: python3 scripts/ci/test-selection-scan-scope.py
      - name: Assert focused production delta
        run: |
          test "$(git diff --name-only -- production-src | wc -l)" -le 1
          git diff --check
          grep -q 'LIGHT_RELIGHT_RESIDENCY_TICKET_MAX = 48' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          grep -q 'LIGHT_HISTORICAL_RESIDENCY_HEAP_HOLD_FRACTION = 0.88D' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          grep -q 'LIGHT_FINALIZER_TICK_TIME_BUDGET_NS = 8_000_000L' production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
      - name: Build and test exact transformed production source
        working-directory: production-src
        run: ./gradlew --no-daemon --warning-mode=fail build
      - name: Persist exact tested product mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          if ! git diff --cached --quiet; then
            git commit -m 'R1-201: accelerate bounded historical residency during drain'
          fi
          git push
      - name: Start runtime validation or retain equivalent active runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/dispatch-runtime-after-build.py
