name: Transactional cohort receipt crash tests
on:
  push:
    branches: [work/perf-transactional-region-architecture-20261116]
    paths:
      - 'runtime-src/src/main/java/net/oceancanvas/mod/server/ChunkCohortBarrier.java'
      - 'scripts/ci/ChunkCohortBarrierSmokeTest.java'
      - 'scripts/ci/expansion_registry.py'
      - 'scripts/ci/test_expansion_registry.py'
      - 'scripts/ci/expansion_region_planner.py'
      - 'scripts/ci/test_expansion_region_planner.py'
      - 'scripts/ci/anvil_region_probe.py'
      - 'scripts/ci/test_anvil_region_probe.py'
      - 'scripts/ci/cohort_manifest.py'
      - 'scripts/ci/test_cohort_manifest.py'
      - '.github/workflows/cohort-receipt-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-crash-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute Java cohort barrier smoke test
        run: |
          mkdir -p /tmp/oceancanvas-cohort-classes
          javac -d /tmp/oceancanvas-cohort-classes runtime-src/src/main/java/net/oceancanvas/mod/server/ChunkCohortBarrier.java scripts/ci/ChunkCohortBarrierSmokeTest.java
          java -cp /tmp/oceancanvas-cohort-classes net.oceancanvas.mod.server.ChunkCohortBarrierSmokeTest
      - name: Validate persistent expansion registry
        run: python3 -m unittest discover -s scripts/ci -p test_expansion_registry.py -v
      - name: Validate expandable canvas region planner
        run: python3 -m unittest discover -s scripts/ci -p test_expansion_region_planner.py -v
      - name: Validate read-only Anvil region inspection
        run: python3 -m unittest discover -s scripts/ci -p test_anvil_region_probe.py -v
      - name: Check crash recovery and receipt invariants
        run: python3 -m unittest discover -s scripts/ci -p test_cohort_manifest.py -v
