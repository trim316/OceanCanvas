name: Ocean Canvas Bounded Staged Scale
on:
  workflow_call:
    inputs:
      candidate_run_id: {required: true, type: string}
      expected_build: {required: true, type: string}
      expected_source_commit: {required: true, type: string}
      width: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  segment:
    name: Bounded ${{ inputs.width }}-block segment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_source_commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: oceancanvas-production-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: production-candidate
      - name: Run a bounded fresh-world segment
        env:
          EXPECTED_BUILD: ${{ inputs.expected_build }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          OC_TEST_WIDTH: ${{ inputs.width }}
          OC_STAGE_SECONDS: '1800'
          OC_NATURAL_BORDER: 'true'
        run: python3 scripts/ci/production-scale.py
      - name: Summarize lighting backlog
        if: always() && hashFiles('production-runtime-evidence/console.log') != ''
        run: python3 scripts/ci/backlog-report.py production-runtime-evidence/console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endurance-checkpoint-${{ inputs.width }}
          path: |
            production-runtime-evidence/*.log
            production-runtime-evidence/*.json
            production-runtime-evidence/*.zip
            production-runtime-evidence/server/world/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
