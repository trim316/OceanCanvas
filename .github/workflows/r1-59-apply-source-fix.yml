name: R1-59 Apply Sky Reset Threshold Fix

on:
  push:
    branches:
      - work/r1-59-sky-reset-threshold

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/r1-59-sky-reset-threshold
      - name: Apply exact production call-site repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java')
          text = path.read_text()
          old = ('\t\t\t\tif (escalation >= LIGHT_HARD_SKY_RESET_ESCALATION\n'
                 '\t\t\t\t\t\t&& ((escalation - LIGHT_HARD_SKY_RESET_ESCALATION) % LIGHT_HARD_SKY_RESET_INTERVAL) == 0) {')
          new = ('\t\t\t\tif (OceanCanvasLightRecoveryPolicy.hardResetDue(\n'
                 '\t\t\t\t\t\tescalation, hardResetsThisEpoch,\n'
                 '\t\t\t\t\t\tLIGHT_HARD_SKY_RESET_ESCALATION, LIGHT_HARD_SKY_RESET_INTERVAL,\n'
                 '\t\t\t\t\t\tLIGHT_MAX_HARD_SKY_RESETS_PER_PHYSICAL_EPOCH)) {')
          if new in text:
              print('R1-59 production call-site already repaired; no-op')
              raise SystemExit(0)
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'fail closed: expected exactly one old hard-reset predicate, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repaired production source if changed
        run: |
          if git diff --quiet -- production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java
          git commit -m 'R1-59: prevent skipped hard-reset milestone livelock'
          git push origin HEAD:work/r1-59-sky-reset-threshold
