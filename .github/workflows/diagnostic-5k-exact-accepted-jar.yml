name: Diagnostic 5k exact fresh-accepted v87 JAR
on:
  push:
    branches: [work/v87-exact-accepted-jar]
    paths: ['.github/workflows/diagnostic-5k-exact-accepted-jar.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-5k-exact-accepted-jar
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate]
    env:
      PROFILE_MODE: ${{ matrix.mode }}
    steps:
      - name: Refuse blind rerun
        run: test '${{ github.run_attempt }}' = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Profile immutable failed checkpoint copy at original 14 GiB heap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/profile_5k_exact_accepted_jar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-5k-exact-accepted-jar-${{ matrix.mode }}-14g
          path: profile-${{ matrix.mode }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
