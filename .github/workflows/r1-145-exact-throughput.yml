name: R1-146 Exact Throughput Gate

on:
  push:
    branches:
      - work/r1-146-pressure-park-liveness
      - work/r1-148-pressure-resume-water-refill
      - work/r1-149-pressure-resume-drain-target
      - work/r1-150-pressure-wake-high-water-headroom
      - work/r1-151-pressure-wake-microband
      - work/r1-153-resident-proof-batch
      - work/r1-154-resident-proof-generic-dormant
      - work/r1-155-bound-resident-dormant-scan
      - work/r1-156-resident-proof-throughput
      - work/r1-158-resident-scan-density
      - work/r1-171-finalizer-budget-attribution
      - work/r1-172-stop-wall-budget-reschedule-churn
      - work/r1-174-wall-exhaustion-tail-fairness
      - work/r1-176-release-delayed-residency
      - work/r1-192-validate-pregen-proof-reuse
      - work/r1-197-validate-post-retirement-proof
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  throughput-profile:
    name: Exact runtime source / throughput-profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build exact production candidate
        working-directory: production-src
        run: ./gradlew build --warning-mode=fail
      - name: Bind exact candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          JAR="$(find production-src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          sha256sum "$JAR" | tee exact-candidate-jar.sha256
      - name: Run existing production throughput contract unchanged
        shell: bash
        env:
          OC_STAGE_SECONDS: '900'
          OC_PROFILE_WIDTH: '1000'
          OC_NATURAL_BORDER: 'true'
        run: bash scripts/ci/r1-145-exact-throughput.sh
      - name: Summarize preserved throughput evidence
        if: always()
        shell: bash
        run: |
          mkdir -p throughput-evidence
          cp -f exact-candidate-jar.sha256 throughput-evidence/ 2>/dev/null || true
          find . -maxdepth 4 -type f \( -name '*throughput*' -o -name '*backlog*' -o -name '*jfr*' -o -name '*.log' \) -size -250M -print0 | xargs -0 -r cp -t throughput-evidence/ 2>/dev/null || true
      - name: Upload first-failure and profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-197-exact-throughput-${{ github.run_id }}
          path: throughput-evidence
          if-no-files-found: warn
          retention-days: 30
