name: R1-146 Exact Throughput Gate

on:
  push:
    branches:
      - work/r1-146-pressure-park-liveness
      - work/r1-148-pressure-resume-water-refill
      - work/r1-149-pressure-resume-drain-target
      - work/r1-150-pressure-wake-high-water-headroom
      - work/r1-151-pressure-wake-microband
      - work/r1-153-resident-proof-batch
      - work/r1-154-resident-proof-generic-dormant
      - work/r1-155-bound-resident-dormant-scan
      - work/r1-156-resident-proof-throughput
      - work/r1-158-resident-scan-density
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  throughput-profile:
    name: Exact runtime source / throughput-profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('production-src/**/*.gradle*', 'production-src/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Compile and test exact production source
        working-directory: production-src
        run: ./gradlew test --no-daemon --stacktrace
      - name: Build exact candidate jar
        working-directory: production-src
        run: ./gradlew build --no-daemon --stacktrace
      - name: Bind exact candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-src/build/libs
          JAR="$(find production-src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          echo "candidate_sha=${CANDIDATE_SHA}"
          sha256sum "$JAR"
      - name: Run existing production throughput contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-production-throughput-profile.sh --width 1000 --center-x 0 --center-z 0 --profile --natural-border --timeout-seconds 900
      - name: Upload first-failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r1-158-throughput-first-failure-${{ github.sha }}
          path: |
            production-src/run/**
            production-src/build/reports/**
            build/**
            diagnostics/**
          if-no-files-found: ignore
          retention-days: 30
