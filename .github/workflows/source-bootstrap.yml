name: Ocean Canvas Source Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/source-bootstrap-trigger.txt'
      - '.github/workflows/source-bootstrap.yml'
      - 'scripts/ci/bootstrap-runtime-source.ps1'

permissions:
  contents: write

concurrency:
  group: oceancanvas-source-bootstrap
  cancel-in-progress: true

jobs:
  preflight:
    name: Bootstrap control-plane preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bootstrap script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/ci/bootstrap-runtime-source.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Bootstrap PowerShell parser preflight failed.'
          }
          Write-Host 'BOOTSTRAP PARSE PASS'

  publish-source:
    name: Publish authoritative runtime source
    needs: preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish runtime source
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ci\bootstrap-runtime-source.ps1
