name: Ocean Canvas Source Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/source-bootstrap-trigger.txt'
      - '.github/workflows/source-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: oceancanvas-source-bootstrap
  cancel-in-progress: true

jobs:
  publish-source:
    name: Publish authoritative runtime source
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and publish source workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          $dest = Join-Path $repo 'runtime-src'
          $patterns = @(
            (Join-Path $env:USERPROFILE 'Downloads\OceanCanvas_Restart_Workspace_v0.2.23*.zip'),
            (Join-Path $env:USERPROFILE 'Desktop\OceanCanvas_Restart_Workspace_v0.2.23*.zip'),
            (Join-Path $env:USERPROFILE 'Downloads\OceanCanvas_Restart_Workspace_v0.2.26*.zip'),
            (Join-Path $env:USERPROFILE 'Desktop\OceanCanvas_Restart_Workspace_v0.2.26*.zip')
          )
          $sourceZip = $null
          foreach ($pattern in $patterns) {
            $hit = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($hit) { $sourceZip = $hit.FullName; break }
          }
          if (-not $sourceZip) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OceanCanvas'),
              (Join-Path $env:USERPROFILE 'Downloads'),
              (Join-Path $env:USERPROFILE 'Desktop')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Filter 'OceanCanvas_Restart_Workspace_v0.2.*.zip' -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($hit) { $sourceZip = $hit.FullName; break }
            }
          }
          if (-not $sourceZip) {
            throw 'Could not locate an OceanCanvas_Restart_Workspace_v0.2.x.zip source workspace on this PC.'
          }
          Write-Host "SOURCE_BOOTSTRAP_FOUND=$sourceZip"

          $stage = Join-Path $env:RUNNER_TEMP 'oceancanvas-source-bootstrap'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $stage -Force

          $root = $stage
          if (-not (Test-Path (Join-Path $root 'src\main\java'))) {
            $candidate = Get-ChildItem $stage -Directory | Where-Object {
              Test-Path (Join-Path $_.FullName 'src\main\java')
            } | Select-Object -First 1
            if ($candidate) { $root = $candidate.FullName }
          }
          if (-not (Test-Path (Join-Path $root 'src\main\java'))) {
            throw "Located ZIP does not contain the expected source tree: $sourceZip"
          }

          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $include = @('src','recovery','scripts','gradle','build.gradle','gradle.properties','settings.gradle','gradlew','gradlew.bat','LICENSE','BUILD-ID.txt','LINEAGE.json','README.md','WORKSPACE-ID.txt')
          foreach ($name in $include) {
            $p = Join-Path $root $name
            if (Test-Path $p) { Copy-Item $p (Join-Path $dest $name) -Recurse -Force }
          }

          # Apply the known G16 residency repair in the authoritative source if needed.
          $ports = Join-Path $dest 'src\main\java\net\oceancanvas\mod\server\SingleChunkWorldPorts.java'
          $ocean = Join-Path $dest 'src\main\java\net\oceancanvas\mod\OceanCanvas.java'
          $props = Join-Path $dest 'gradle.properties'
          foreach ($required in @($ports,$ocean,$props)) {
            if (-not (Test-Path $required)) { throw "Required source file missing after bootstrap: $required" }
          }

          $text = Get-Content $ports -Raw
          if ($text -notmatch 'MAX_RESIDENCY_REACQUIRE_ATTEMPTS') {
            $text = $text.Replace(
              '    private static final int MAX_PHYSICAL_RECONCILIATION_PASSES = 3;',
              "    private static final int MAX_PHYSICAL_RECONCILIATION_PASSES = 3;`r`n    private static final int MAX_RESIDENCY_REACQUIRE_ATTEMPTS = 8;`r`n    private static final long MAX_RESIDENCY_RETRY_DELAY_TICKS = 20L;"
            )
            $text = $text.Replace(
              "    private LevelChunk chunk;`r`n",
              "    private LevelChunk chunk;`r`n    private int residencyReacquireAttempts;`r`n    private long residencyRetryNotBeforeTick = Long.MIN_VALUE;`r`n"
            )
            $old = @'
            if (loadFuture == null) {
                loadFuture = world.getChunkSource().getChunkFuture(key.x(), key.z(), ChunkStatus.FULL, false);
                return StageActionResult.waiting("FULL chunk future requested");
            }
            if (!loadFuture.isDone()) return StageActionResult.waiting("waiting for FULL chunk future");
            ChunkResult<ChunkAccess> result = loadFuture.join();
            ChunkAccess access = result.orElse(null);
            if (!(access instanceof LevelChunk live)) {
                return StageActionResult.failure("FULL chunk future completed without LevelChunk: " + result.getError());
            }
            chunk = live;
            receipts.append(ReceiptKind.CHUNK_RESIDENT, key, "resident-via-FULL-future");
            return StageActionResult.success("FULL chunk resident");
'@
            $new = @'
            if (loadFuture == null) {
                if (world.getGameTime() < residencyRetryNotBeforeTick) {
                    return StageActionResult.waiting("bounded FULL chunk residency reacquire backoff attempt="
                            + residencyReacquireAttempts + "/" + MAX_RESIDENCY_REACQUIRE_ATTEMPTS);
                }
                loadFuture = world.getChunkSource().getChunkFuture(key.x(), key.z(), ChunkStatus.FULL, false);
                return StageActionResult.waiting("FULL chunk future requested attempt="
                        + (residencyReacquireAttempts + 1) + "/" + (MAX_RESIDENCY_REACQUIRE_ATTEMPTS + 1));
            }
            if (!loadFuture.isDone()) return StageActionResult.waiting("waiting for FULL chunk future");
            ChunkResult<ChunkAccess> result = loadFuture.join();
            ChunkAccess access = result.orElse(null);
            if (!(access instanceof LevelChunk live)) {
                LevelChunk recovered = world.getChunkSource().getChunkNow(key.x(), key.z());
                if (recovered != null) {
                    chunk = recovered;
                    loadFuture = null;
                    residencyReacquireAttempts = 0;
                    residencyRetryNotBeforeTick = Long.MIN_VALUE;
                    receipts.append(ReceiptKind.CHUNK_RESIDENT, key, "resident-after-stale-FULL-future");
                    return StageActionResult.success("FULL chunk resident after stale future");
                }
                String error = String.valueOf(result.getError());
                if (residencyReacquireAttempts >= MAX_RESIDENCY_REACQUIRE_ATTEMPTS) {
                    return StageActionResult.failure("FULL chunk residency could not be reacquired after "
                            + MAX_RESIDENCY_REACQUIRE_ATTEMPTS + " stale/unloaded future completions: " + error);
                }
                residencyReacquireAttempts++;
                long delay = Math.min(MAX_RESIDENCY_RETRY_DELAY_TICKS, 1L << Math.min(4, residencyReacquireAttempts - 1));
                residencyRetryNotBeforeTick = world.getGameTime() + delay;
                loadFuture = null;
                world.getChunkSource().addTicketWithRadius(TicketType.FORCED, pos, 0);
                return StageActionResult.waiting("FULL chunk future completed transiently unavailable; reacquire attempt="
                        + residencyReacquireAttempts + "/" + MAX_RESIDENCY_REACQUIRE_ATTEMPTS
                        + " retryInTicks=" + delay + " error=" + error);
            }
            chunk = live;
            loadFuture = null;
            residencyReacquireAttempts = 0;
            residencyRetryNotBeforeTick = Long.MIN_VALUE;
            receipts.append(ReceiptKind.CHUNK_RESIDENT, key, "resident-via-FULL-future");
            return StageActionResult.success("FULL chunk resident");
'@
            if (-not $text.Contains($old)) { throw 'Expected v0.2.23 residency block not found; refusing fuzzy source mutation.' }
            $text = $text.Replace($old,$new)
            Set-Content $ports $text -Encoding UTF8
          }

          (Get-Content $ocean -Raw).Replace('core-v0.2.23','core-v0.2.24') | Set-Content $ocean -Encoding UTF8
          (Get-Content $props -Raw).Replace('mod_version=26.2-core-v0.2.23','mod_version=26.2-core-v0.2.24') | Set-Content $props -Encoding ASCII

          $manifest = @(
            'source_generation=runtime-src-v0.2.24',
            "bootstrap_source=$sourceZip",
            "bootstrap_source_sha256=$((Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant())",
            "published_at=$(Get-Date -Format o)",
            'known_runtime_fix=g16-full-chunk-residency-reacquire'
          )
          $manifest | Set-Content (Join-Path $dest 'SOURCE-BOOTSTRAP.properties') -Encoding UTF8

          git config user.name 'OceanCanvas Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime-src
          if (-not (git status --porcelain runtime-src)) {
            Write-Host 'SOURCE_BOOTSTRAP_ALREADY_CURRENT'
            exit 0
          }
          git commit -m 'Publish authoritative Ocean Canvas runtime source'
          git push origin HEAD:main
          Write-Host 'SOURCE_BOOTSTRAP_PASS'
