name: R1-119 Strict Source Proof Audit
on:
  push:
    branches: [work/forever-world-release-push]
    paths: ['tools/r1_119_patch.py', '.github/workflows/r1-119-lateral-floor-light-fix.yml']
permissions:
  contents: read
jobs:
  proof-audit:
    if: contains(github.event.head_commit.message, '[r1-119-proof-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify strict proof and replay preserved saved faults without source changes
        run: python3 tools/r1_119_patch.py
