name: R1-211 Fastlane Failed-Only Retry

# R1-214 corrected-v81 exact-source execution gate.
on:
  push:
    branches:
      - work/r1-211-fastlane-failed-only-retry
    paths:
      - '.github/workflows/r1-211-fastlane-failed-only-retry.yml'
  workflow_dispatch:

env:
  CANDIDATE_SOURCE: 9d6048f356f981e670556b2d07e5adec7147fe57
  EXPECTED_BUILD: v253.125.80
  PRIOR_RUN_ID: '39032710433'
  CHECKPOINT_RUN_ID: '39226170335'

permissions:
  contents: write
  actions: read

jobs:
  retry-2k-segment:
    if: ${{ !contains(github.event.head_commit.message, '[r1-214-execute]') }}
    name: Resume only incomplete 2k exact-candidate checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: candidate-source/.runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: r1-210-retained-v80-candidate
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ github.token }}
          path: candidate-source/production-candidate
      - name: Restore exact 2k checkpoint from prior bounded segment
        uses: actions/download-artifact@v4
        with:
          name: r1-211-fresh-2k-checkpoint-s66
          run-id: ${{ env.CHECKPOINT_RUN_ID }}
          github-token: ${{ github.token }}
          path: candidate-source/production-runtime-evidence
      - name: Overlay current resumable harness only; keep product source immutable
        run: |
          set -euo pipefail
          for f in production-scale.py production-acceptance.py runtime_support.py runtime_stall.py candidate_verifier.py scale_evidence.py scale_geometry.py checkpoint_bundle.py; do
            cp "harness/scripts/ci/$f" "candidate-source/scripts/ci/$f"
          done
      - name: Resume 2k campaign for one bounded segment
        working-directory: candidate-source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.CANDIDATE_SOURCE }}
          OC_TEST_WIDTH: '2000'
          OC_STAGE_SECONDS: '900'
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_REQUIRE_CHECKPOINT_MANIFEST: 'true'
          OC_RESUME: 'true'
        run: python3 scripts/ci/production-scale.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-211-fresh-2k-checkpoint-s67
          path: candidate-source/production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  repair-v81:
    if: ${{ contains(github.event.head_commit.message, '[r1-214-execute]') }}
    name: Patch, regress, build and bind v81 once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r1-214-v81-clean-resume-physical-authority
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply operation-scoped clean-resume authority and fail-closed checkpoint fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          oc=Path('production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java'); t=oc.read_text(); assert 'VERSION = "v253.125.80"' in t; oc.write_text(t.replace('VERSION = "v253.125.80"','VERSION = "v253.125.81"',1))
          gp=Path('production-src/gradle.properties'); t=gp.read_text(); assert 'mod_version=26.2-v253.125.80' in t; gp.write_text(t.replace('mod_version=26.2-v253.125.80','mod_version=26.2-v253.125.81',1))
          sf=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java'); t=sf.read_text()
          old='''\t\tpregenSession().PREGEN_CRASH_RECOVERY_PHYSICAL_TRACKED.forEachLong(scratch::add);\n\t\tLongArrayList out = new LongArrayList(scratch.size());'''
          new='''\t\tpregenSession().PREGEN_CRASH_RECOVERY_PHYSICAL_TRACKED.forEachLong(scratch::add);\n\t\t// v253.125.81: preserve only this Pregen session's authored landing guards\n\t\t// that still carry explicit physical mutation authority. The guard is cleared\n\t\t// by beginPregenSession, so historical LIGHT_ONLY debt and unrelated terrain\n\t\t// cannot acquire block-mutation authority across a graceful checkpoint.\n\t\tlightFinalizerSession().authoredWaterLandingGuard.forEachLong(packed -> {\n\t\t\tif (lightFinalizerSession().allowPhysicalRepair.contains(packed)) scratch.add(packed);\n\t\t});\n\t\tLongArrayList out = new LongArrayList(scratch.size());'''
          assert old in t; sf.write_text(t.replace(old,new,1))
          ps=Path('scripts/ci/production-scale.py'); t=ps.read_text()
          old="""    except TimeoutError:\n        if os.environ.get('OC_CHECKPOINT_SEGMENT') != 'true':\n            raise\n        segment_saved = True\n        print('CHECKPOINT_SEGMENT_PENDING: completion not observed; save and resume the same world', flush=True)\n        raise SystemExit(0)"""
          new="""    except TimeoutError:\n        if os.environ.get('OC_CHECKPOINT_SEGMENT') != 'true':\n            raise\n        live_text = ''.join(lines)\n        if re.search(r'P2 performance budget assertion: no-progress=FAIL', live_text):\n            raise RuntimeError('Checkpoint rejected: product reported no-progress=FAIL')\n        gate_bad = re.search(r'POST-JOB-PHYSICAL-GATE[^\\n]*physicalBad=([1-9][0-9]*)', live_text)\n        unauthorized_hold = 'repairAuthorized=false action=hold-completion-without-physical-authority' in live_text\n        if gate_bad and unauthorized_hold:\n            raise RuntimeError('Checkpoint rejected: post-job physical violations remain without repair authority')\n        segment_saved = True\n        print('CHECKPOINT_SEGMENT_PENDING: completion not observed; save and resume the same world', flush=True)\n        raise SystemExit(0)"""
          assert old in t; ps.write_text(t.replace(old,new,1))
          PY
      - name: Assert narrow authority and fail-closed contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sf=Path('production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java').read_text()
          assert 'authoredWaterLandingGuard.forEachLong' in sf and 'allowPhysicalRepair.contains(packed)' in sf
          begin=sf.index('beginPregenSession(ServerLevel world)'); assert 'authoredWaterLandingGuard.clear()' in sf[begin:begin+3000]
          ps=Path('scripts/ci/production-scale.py').read_text(); assert 'Checkpoint rejected: product reported no-progress=FAIL' in ps; assert 'Checkpoint rejected: post-job physical violations remain without repair authority' in ps
          print('R1_214_AUTHORITY_REGRESSION_PASS')
          PY
          python3 scripts/ci/test-runtime-stall.py
          python3 scripts/ci/test-checkpoint-bundle.py
          python3 scripts/ci/test-scale-evidence.py
          python3 scripts/ci/test-scale-candidate.py
      - name: Compile production engine
        working-directory: production-src
        run: ./gradlew build --warning-mode=fail
      - name: Commit tested v81 source
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OceanCanvas Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add production-src/src/main/java/net/oceancanvas/mod/OceanCanvas.java production-src/gradle.properties production-src/src/main/java/net/oceancanvas/mod/worldgen/OceanCanvasSurfaceFlattener.java scripts/ci/production-scale.py
          git commit -m 'R1-214: preserve operation-scoped physical authority across clean resume'
          git push origin HEAD:work/r1-214-v81-clean-resume-physical-authority
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bind exact v81 candidate
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD); jar='production-src/build/libs/oceancanvas-26.2-v253.125.81.jar'; test -f "$jar"
          mkdir -p production-candidate; cp "$jar" production-candidate/; sha256sum "$jar" > production-candidate/JAR-SHA256.txt
          printf 'sourceCommit=%s\nbuildRunId=%s\nruntimeBuild=v253.125.81\nreleaseStatus=HOLD\n' "$sha" "$GITHUB_RUN_ID" > production-candidate/candidate.properties
      - uses: actions/upload-artifact@v4
        with:
          name: r1-214-v81-production-candidate
          path: production-candidate/
          if-no-files-found: error
          retention-days: 30

  validate-v81-scales:
    name: Fresh exact v81 ${{ matrix.width }}-block checkpointed campaign
    if: ${{ contains(github.event.head_commit.message, '[r1-214-execute]') }}
    needs: repair-v81
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {width: 2000, seconds: 900, timeout: 45}
          - {width: 5000, seconds: 9600, timeout: 180}
          - {width: 20000, seconds: 19800, timeout: 360}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair-v81.outputs.source_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: r1-214-v81-production-candidate
          path: production-candidate
      - name: Run fresh exact v81 scale campaign
        env:
          EXPECTED_BUILD: v253.125.81
          EXPECTED_SOURCE_COMMIT: ${{ needs.repair-v81.outputs.source_sha }}
          OC_TEST_WIDTH: ${{ matrix.width }}
          OC_STAGE_SECONDS: ${{ matrix.seconds }}
          OC_CHECKPOINT_SEGMENT: 'true'
        run: python3 scripts/ci/production-scale.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-214-v81-scale-${{ matrix.width }}-s1
          path: production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
