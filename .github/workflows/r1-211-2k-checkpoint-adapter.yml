name: R1-211 Resumable 2k Checkpoint Lane

on:
  push:
    branches:
      - work/r1-211-2k-checkpoint-adapter
    paths:
      - '.github/workflows/r1-211-2k-checkpoint-adapter.yml'
  workflow_dispatch:

env:
  CANDIDATE_SOURCE: 9d6048f356f981e670556b2d07e5adec7147fe57
  CANDIDATE_RUN_ID: '39026358556'
  CANDIDATE_ARTIFACT: r1-138-ocean-vegetation-1k-39026358556
  EXPECTED_BUILD: v253.125.80

concurrency:
  group: r1-211-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Reuse exact v80 candidate without rebuilding it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-source
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: retained
      - name: Verify retained product identity and accepted 1k proof
        shell: bash
        run: |
          set -euo pipefail
          cp -a retained/production-candidate candidate-source/production-candidate
          cd candidate-source
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts/ci')
          from candidate_verifier import verify_candidate
          _, digest = verify_candidate(pathlib.Path('production-candidate'), os.environ['EXPECTED_BUILD'], os.environ['CANDIDATE_SOURCE'])
          root = pathlib.Path('../retained/production-runtime-evidence')
          for name in ('acceptance.json','restart.json','vegetation-persistence.json'):
              assert json.loads((root/name).read_text()).get('passed') is True, name
          ident = json.loads((root/'identity.json').read_text())
          assert ident.get('sourceCommit') == os.environ['CANDIDATE_SOURCE'], ident
          assert ident.get('jarSha256') == digest, ident
          assert int(ident.get('requestedBlocks', 0)) == 1000, ident
          print('R1_211_RETAINED_CANDIDATE_PASS', digest)
          PY
      - name: Stage only the immutable candidate
        run: |
          mkdir -p candidate
          cp -a retained/production-candidate/. candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: r1-211-v80-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  segment-1:
    name: Fresh 2k / bounded segment 1
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      complete: ${{ steps.state.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: candidate-source/.runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: r1-211-v80-candidate
          path: candidate-source/production-candidate
      - name: Overlay checkpoint harness only; product source remains exact v80
        run: |
          for f in production-scale.py production-acceptance.py runtime_support.py runtime_stall.py candidate_verifier.py scale_evidence.py scale_geometry.py checkpoint_bundle.py; do
            cp "harness/scripts/ci/$f" "candidate-source/scripts/ci/$f"
          done
      - name: Start one fresh 2k campaign for one bounded segment
        working-directory: candidate-source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.CANDIDATE_SOURCE }}
          OC_TEST_WIDTH: '2000'
          OC_STAGE_SECONDS: '900'
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_REQUIRE_CHECKPOINT_MANIFEST: 'true'
        run: python3 scripts/ci/production-scale.py
      - name: Classify completed certification vs healthy saved checkpoint
        id: state
        working-directory: candidate-source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          root = pathlib.Path('production-runtime-evidence')
          a, r = root/'acceptance.json', root/'restart.json'
          complete = a.is_file() and r.is_file() and json.loads(a.read_text()).get('passed') is True and json.loads(r.read_text()).get('passed') is True
          if not complete:
              status = json.loads((root/'checkpoint-status.json').read_text())
              assert status.get('savedWorldPresent') is True, status
              assert status.get('segmentPending') is True, status
              assert (root/'checkpoint-manifest.json').is_file()
          print('complete=' + ('true' if complete else 'false'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-211-2k-checkpoint-s1
          path: candidate-source/production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  segment-2:
    name: 2k / resume segment 2 only if needed
    needs: [prepare, segment-1]
    if: ${{ always() && needs.prepare.result == 'success' && needs.segment-1.result == 'success' && needs.segment-1.outputs.complete != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      complete: ${{ steps.state.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: candidate-source/.runtime-cache
          key: fabric-runtime-${{ runner.os }}-26.2-0.19.3-v1
      - uses: actions/download-artifact@v4
        with:
          name: r1-211-v80-candidate
          path: candidate-source/production-candidate
      - uses: actions/download-artifact@v4
        with:
          name: r1-211-2k-checkpoint-s1
          path: candidate-source/production-runtime-evidence
      - name: Overlay checkpoint harness only
        run: |
          for f in production-scale.py production-acceptance.py runtime_support.py runtime_stall.py candidate_verifier.py scale_evidence.py scale_geometry.py checkpoint_bundle.py; do
            cp "harness/scripts/ci/$f" "candidate-source/scripts/ci/$f"
          done
      - name: Resume exact 2k saved world; never regenerate segment 1
        working-directory: candidate-source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.CANDIDATE_SOURCE }}
          OC_TEST_WIDTH: '2000'
          OC_STAGE_SECONDS: '900'
          OC_CHECKPOINT_SEGMENT: 'true'
          OC_REQUIRE_CHECKPOINT_MANIFEST: 'true'
          OC_RESUME: 'true'
        run: python3 scripts/ci/production-scale.py
      - name: Classify completed certification vs next healthy checkpoint
        id: state
        working-directory: candidate-source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          root = pathlib.Path('production-runtime-evidence')
          a, r = root/'acceptance.json', root/'restart.json'
          complete = a.is_file() and r.is_file() and json.loads(a.read_text()).get('passed') is True and json.loads(r.read_text()).get('passed') is True
          if not complete:
              status = json.loads((root/'checkpoint-status.json').read_text())
              assert status.get('savedWorldPresent') is True, status
              assert status.get('segmentPending') is True, status
              assert (root/'checkpoint-manifest.json').is_file()
          print('complete=' + ('true' if complete else 'false'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-211-2k-checkpoint-s2
          path: candidate-source/production-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  ledger:
    name: 2k checkpoint ledger
    needs: [prepare, segment-1, segment-2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record progress without treating incomplete stress as failure
        env:
          PREPARE: ${{ needs.prepare.result }}
          S1: ${{ needs.segment-1.result }}
          S1_COMPLETE: ${{ needs.segment-1.outputs.complete }}
          S2: ${{ needs.segment-2.result }}
          S2_COMPLETE: ${{ needs.segment-2.outputs.complete }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          failed = os.environ['PREPARE'] != 'success' or os.environ['S1'] == 'failure' or os.environ['S2'] == 'failure'
          complete = os.environ['S1_COMPLETE'] == 'true' or os.environ['S2_COMPLETE'] == 'true'
          state = 'CERTIFIED_2K' if complete else ('FAILED' if failed else 'CHECKPOINTED_PENDING')
          data = {
            'candidateSource': os.environ['CANDIDATE_SOURCE'],
            'runtimeBuild': os.environ['EXPECTED_BUILD'],
            'state': state,
            'segment1': os.environ['S1'],
            'segment2': os.environ['S2'],
            'resumePolicy': 'continue from latest saved 2k checkpoint; never replay completed segments',
            'releasePolicy': '2k stress is additional evidence and does not invalidate the established 1k release tier when merely pending'
          }
          pathlib.Path('r1-211-2k-ledger.json').write_text(json.dumps(data, indent=2) + '\n')
          print(json.dumps(data, indent=2))
          if failed:
              raise SystemExit('2k checkpoint lane failed; repair only failed stage')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-211-2k-ledger
          path: r1-211-2k-ledger.json
          if-no-files-found: error
          retention-days: 30
