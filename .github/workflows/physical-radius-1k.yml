name: Physical radius 1k disposable validation
on:
  push:
    branches: [work/physical-radius-ladder-validation]
    paths: ['.github/workflows/physical-radius-1k.yml']
permissions:
  contents: read
concurrency:
  group: physical-radius-ladder-1k
  cancel-in-progress: false
jobs:
  physical-1k:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_BUILD: v253.125.135
      EXPECTED_SOURCE_COMMIT: 3d2e0b73dbf06681b033f042dc65efe51fd40552
      OC_TEST_WIDTH: '2000'
      OC_EVIDENCE_DIR: physical-radius-1k-evidence
      OC_STAGE_SECONDS: '1200'
      OC_CHECKPOINT_SEGMENT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test '${{ github.run_attempt }}' = 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Verify pinned runtime and collector
        run: |
          java -version 2>&1 | tee java-identity.txt
          grep -F '25.0.4.1+1' java-identity.txt
          java -Xms1G -Xmx14G -XX:+UseZGC -XX:+PrintFlagsFinal -version > zgc-flags.txt 2>&1
          grep -E 'UseZGC.*= true ' zgc-flags.txt
          grep -E 'UseG1GC.*= false ' zgc-flags.txt
      - name: Build frozen production candidate and regressions
        working-directory: production-src
        run: bash gradlew build --console=plain
      - name: Prove exact radius and original first-failure boundary
        run: |
          python3 scripts/ci/test-scale-geometry.py
          python3 scripts/ci/test-scale-first-failure.py
          python3 -m unittest discover -s scripts/ci -p test_host_stall_sampler.py
      - name: Bind exact production candidate
        run: python3 scripts/ci/prepare_physical_ladder_candidate.py
      - name: Generate and physically finalize disposable 1000-radius world
        run: python3 scripts/ci/production-scale.py
      - name: Record explicit promotion hold
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('physical-radius-1k-evidence');root.mkdir(exist_ok=True)
          checkpoint=json.loads((root/'checkpoint-status.json').read_text()) if (root/'checkpoint-status.json').exists() else {}
          status={'radiusBlocks':1000,'widthBlocks':2000,'targetChunks':15876,'sourceCommit':'3d2e0b73dbf06681b033f042dc65efe51fd40552','promotion':'HOLD','scaleAccepted':False,'independentVerificationPending':True,'completionObserved':checkpoint.get('completionObserved',False),'requiredProofs':['physical flatten completion','lighting finalization','save/restart integrity','protection behavior','structures','recovery evidence'],'reason':'Retain exact world for independent physical and six-category evidence verification; no larger scale authorized by this job result'}
          (root/'ladder-status.json').write_text(json.dumps(status,indent=2))
          PY
      - name: Preserve full disposable checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-radius-1k-candidate
          path: |
            physical-radius-1k-evidence/
            production-candidate/
            java-identity.txt
            zgc-flags.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
