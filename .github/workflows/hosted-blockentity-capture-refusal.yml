name: Ocean Canvas Disposable Block-Entity Capture Refusal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-blockentity-capture-refusal.yml'

permissions:
  contents: read

concurrency:
  group: oceancanvas-disposable-blockentity-capture
  cancel-in-progress: false

jobs:
  capture-and-refuse:
    name: Capture real chest NBT sidecar and keep mutation disabled
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9054fdfa6aed22d39ed7a228b75a39f9882ec4fb
          persist-credentials: false

      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = 9054fdfa6aed22d39ed7a228b75a39f9882ec4fb
          git rev-parse HEAD | tee HOSTED_SOURCE_SHA.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build exact Fabric candidate and deterministic tests
        working-directory: runtime-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --warning-mode=fail

      - name: Capture real chest NBT then prove mutation remains disabled
        run: |
          python3 -m py_compile scripts/ci/hosted-blockentity-capture-refusal.py
          python3 scripts/ci/hosted-blockentity-capture-refusal.py

      - name: Preserve sidecar and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceancanvas-blockentity-capture-refusal
          path: |
            HOSTED_SOURCE_SHA.txt
            hosted-blockentity-capture-refusal/
            runtime-src/run/world/oceancanvas-core/single-chunk/
            runtime-src/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 30
