# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop for the current recommended set
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Mod Properties
mod_version=26.2-v253.125.56
maven_group=net.oceancanvas
archives_base_name=oceancanvas

# Dependencies
# check the current recommended Fabric API build for 26.2 at
# https://fabricmc.net/develop and https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api
fabric_version=0.156.0+26.2

# Optional (compileOnly-only, see build.gradle) - the in-game config
# screen feature. Confirmed directly against the real Maven listings
# (not guessed) via web search this round:
#   - modmenu_version=20.0.1 is the newest release on
#     https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/
#     tagged as a stable "Release" (not alpha/beta/rc) supporting
#     Minecraft 26.2 on Fabric/Quilt.
#     - Cloth Config's own versioning now tracks the Minecraft version
#     it targets, and 26.2.155 is the entry for 26.2.
# Still worth a quick sanity check against those two URLs before
# relying on this in production - Maven listings change - but these
# are real, resolvable coordinates, not placeholders.
modmenu_version=20.0.1

# Required (see build.gradle) - CommandSourceStack#hasPermission(int) is
# gone in 26.2; the real replacement is Fabric API's own permission-check
# system, but its concrete Permissions utility class is a separate
# third-party library (me.lucko:fabric-permissions-api), not part of the
# fabric-api umbrella jar. 0.7.0 is the current real version confirmed
# directly on Maven Central (central.sonatype.com/artifact/me.lucko/
# fabric-permissions-api) - the library's own documented version matrix
# lists 0.7.0 as the entry for Minecraft 26.1, and no newer version has
# been published specifically for 26.2 as of this check.
fabric_permissions_api_version=0.7.0
