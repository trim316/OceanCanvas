plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom already adds the Fabric/Mojang repositories it needs.
	// Add extra repositories here only if you depend on another mod
	// that isn't hosted on Modrinth/CurseForge/Fabric's maven.

	// Needed for optional Mod Menu integration.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	// fabric-permissions-api (see the dependencies block below) is
	// published to plain Maven Central - confirmed directly on
	// central.sonatype.com, not guessed.
	mavenCentral()

}

loom {
	splitEnvironmentSourceSets()

	mods {
		"oceancanvas" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	client {
		java {
			// OceanCanvasModMenuIntegration.java is no longer excluded -
			// see the "Mod Menu integration" comment block
			// in the dependencies section below for the real, confirmed
			// Maven coordinates now backing it (modmenu_version in gradle.properties).

			// OceanCanvasBoundaryHud.java is no longer excluded - it was
			// migrated this round off the (likely-removed-by-now)
			// deprecated HudRenderCallback hook onto the current
			// HudElementRegistry API. See that class's doc comment for
			// exactly which parts of that migration are confirmed
			// against Fabric's own published docs versus translated
			// from Yarn mapping names using well-established naming
			// pairs - real, meaningfully reduced risk, but still this
			// project's first-ever client rendering code and not
			// verified against an actual 26.2 compile in this sandbox.
		}
	}
}

dependencies {
	// Minecraft 26.1+ ships unobfuscated - there's no obfuscation to map
	// against in the first place, so (unlike older versions) no
	// `mappings` line is needed here at all. Loom errors if you try to
	// call officialMojangMappings()/Yarn on an already-unobfuscated
	// version - that's what "Cannot use Mojang mappings in a
	// non-obfuscated environment" means.
	//
	// Same reason `modImplementation`/`modApi`/etc. don't exist anymore
	// either: those configurations existed so Loom could remap a mod
	// dependency's obfuscated references to match your dev mappings.
	// With nothing obfuscated, there's nothing to remap, so it's just
	// plain `implementation` like any other Gradle project.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// --- Permission checks (net.oceancanvas.mod.command.*) ---
	// CommandSourceStack#hasPermission(int) is gone in 26.2 - the class
	// now implements Fabric API's own PermissionContextOwner interface,
	// but the actual Permissions utility class isn't part of the
	// fabric-api umbrella jar above at all: it's a separate third-party
	// library by lucko, confirmed directly on Maven Central
	// (central.sonatype.com/artifact/me.lucko/fabric-permissions-api),
	// not bundled with Fabric API despite sharing its package namespace.
	// include(...) bundles its ~12KB into our own mod jar so server
	// owners never need to install it themselves - matches this
	// project's stated "interfere with as little as possible, stay
	// self-contained" philosophy. Real version confirmed on Central,
	// matching the library's own documented compatibility for 26.1+.
	//
	// Plain `implementation`, not modImplementation: an actual
	// `gradle runClient` run in this sandbox failed with "Could not find
	// method modImplementation() for arguments [...]" - on this
	// unobfuscated 26.2 setup Loom does not register the
	// modImplementation/modApi/modCompileOnly configurations at all, so
	// the previous round's claim that they're "still real, active Loom
	// configs" here was wrong (that claim was itself a course-correction
	// off an even earlier, differently-wrong guess - this is the one
	// actually confirmed by a real build). fabric-permissions-api still
	// ships its own fabric.mod.json, but with nothing to remap on an
	// unobfuscated version there's no remapping step for `include` to
	// need modImplementation for - plain `implementation` is enough for
	// `include` to bundle it into the mod jar.
	include(implementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))

	// --- Mod Menu integration (see
	// net.oceancanvas.mod.integration.OceanCanvasModMenuIntegration for
	// the feature itself) ---
	// Enabled this round: modmenu_version in
	// gradle.properties were resolved this round against the real Maven
	// listings (maven.terraformersmc.com and maven.shedaniel.me - see
	// that file's comment for the exact directories checked), not
	// guessed. modCompileOnly (not plain compileOnly, and not
	// implementation) - this stays an optional, soft dependency; see
	// OceanCanvasModMenuIntegration's class doc for why that's safe
	// (only ever loaded by Mod Menu's own entrypoint). Switched from
	// plain compileOnly to modCompileOnly alongside the
	// fabric-permissions-api fix above and then back again: a real
	// `gradle runClient` run in this sandbox proved modCompileOnly
	// doesn't exist on this unobfuscated 26.2 setup either (see the
	// include(implementation(...)) comment above for the actual error).
	// Plain `compileOnly` is correct here.
	// Still genuinely a first real build attempt with both libraries on
	// the classpath - flagging honestly that "the coordinates resolve"
	// and "the actual API calls in OceanCanvasModMenuIntegration compile
	// clean against them" are two different claims, and only the
	// dependency-resolution mechanics could be checked as this comment
	// was written.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"


	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	// Real fix for "Could not start Gradle Test Executor... Failed to
	// load JUnit Platform" - recent Gradle versions (matches the "Gradle
	// 10" deprecation warning seen alongside this exact error) no longer
	// pull the platform launcher in automatically just from having
	// junit-jupiter on the classpath; it needs to be declared explicitly.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

test {
	useJUnitPlatform()
}

def resourceVersion = project.version.toString()
def licenseArchiveName = base.archivesName.get()
def mixinConfigFile = layout.projectDirectory.file("src/main/resources/oceancanvas.mixins.json").asFile

processResources {
	inputs.property "version", resourceVersion

	filesMatching("fabric.mod.json") {
		expand "version": resourceVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${licenseArchiveName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add a repository here (e.g. Modrinth via minotaur, or a local maven)
		// once you're ready to publish builds.
	}
}

// v253.69.5: never publish/install a jar whose mixin config names a class that
// is absent from the finished artifact. This exact packaging defect previously
// survived source/static checks and only failed during Fabric/C2ME preLaunch.
tasks.named("jar", Jar).configure {
	doLast {
		def configFile = mixinConfigFile
		def config = new groovy.json.JsonSlurper().parse(configFile)
		def packagePath = String.valueOf(config.package).replace('.', '/')
		def configuredMixins = []
		["mixins", "client", "server"].each { key ->
			def entries = config[key]
			if (entries instanceof Collection) configuredMixins.addAll(entries)
		}
		def jarFile = archiveFile.get().asFile
		def missingMixins = []
		def zip = new java.util.zip.ZipFile(jarFile)
		try {
			configuredMixins.each { mixinName ->
				def classEntry = packagePath + "/" + String.valueOf(mixinName).replace('.', '/') + ".class"
				if (zip.getEntry(classEntry) == null) missingMixins.add(classEntry)
			}
		} finally {
			zip.close()
		}
		if (!missingMixins.isEmpty()) {
			jarFile.delete() // do not leave an installable-looking broken artifact behind
			throw new GradleException("Ocean Canvas mixin packaging failure: ${missingMixins.join(', ')} referenced by oceancanvas.mixins.json but missing from the finished jar")
		}
		logger.lifecycle("Ocean Canvas mixin jar audit passed: ${configuredMixins.size()} configured mixin classes packaged")
	}
}
