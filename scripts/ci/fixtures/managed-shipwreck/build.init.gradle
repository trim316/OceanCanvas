allprojects { afterEvaluate {
 def root=new File(project.projectDir.parentFile,'scripts/ci/fixtures/managed-shipwreck')
 def classes=new File(project.buildDir,'managed-shipwreck-fixture-classes')
 tasks.register('managedShipwreckFixtureCompile',JavaCompile) {
  source=fileTree(new File(root,'src')) {include '**/*.java'}
  def candidate=System.getenv('OC_MANAGED_CANDIDATE_JAR')
  if(candidate==null || !new File(candidate).isFile())throw new GradleException('Exact verified hosted candidate JAR required; no product rebuild permitted')
  classpath=sourceSets.main.compileClasspath+files(candidate);destinationDirectory=classes;options.release=25
 }
 tasks.register('managedShipwreckFixtureJar',Jar) {
  dependsOn 'managedShipwreckFixtureCompile';archiveFileName='managed-shipwreck-fixture.jar';destinationDirectory=new File(project.buildDir,'fixture-libs');from(classes)
  doFirst {
   new File(classes,'fabric.mod.json').text='{"schemaVersion":1,"id":"ocmanagedshipwreckfixture","version":"1","environment":"server","entrypoints":{"main":["net.oceancanvas.probe.managed.ManagedShipwreckSnapshot"]},"mixins":["managed-shipwreck-fixture.mixins.json"]}'
   new File(classes,'managed-shipwreck-fixture.mixins.json').text='{"required":true,"package":"net.oceancanvas.probe.managed.mixin","compatibilityLevel":"JAVA_25","mixins":["ManagedShipwreckObserver"],"injectors":{"defaultRequire":1}}'
  }
 }
} }
