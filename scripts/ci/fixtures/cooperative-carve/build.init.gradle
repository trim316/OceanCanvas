allprojects { afterEvaluate {
    def fixtureRoot = new File(project.projectDir.parentFile, 'scripts/ci/fixtures/cooperative-carve')
    def classes = new File(project.buildDir, 'cooperative-fixture-classes')
    tasks.register('cooperativeFixtureCompile', JavaCompile) {
        dependsOn 'classes'
        source = fileTree(new File(fixtureRoot, 'src')) { include '**/*.java' }
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDirectory = classes
        options.release = 25
    }
    tasks.register('cooperativeFixtureJar', Jar) {
        dependsOn 'cooperativeFixtureCompile'
        archiveFileName = 'cooperative-deadline-fixture.jar'
        destinationDirectory = new File(project.buildDir, 'fixture-libs')
        from(classes)
        doFirst {
            new File(classes, 'fabric.mod.json').text = '{"schemaVersion":1,"id":"occooperativedeadlinefixture","version":"1","environment":"server","mixins":["cooperative-deadline-fixture.mixins.json"]}'
            new File(classes, 'cooperative-deadline-fixture.mixins.json').text = '{"required":true,"package":"net.oceancanvas.probe.mixin","compatibilityLevel":"JAVA_25","mixins":["CarveDeadlineMixin"],"injectors":{"defaultRequire":1}}'
        }
    }
} }
