allprojects { afterEvaluate {
 def root=new File(project.projectDir.parentFile,'scripts/ci/fixtures/fresh-checkpoint')
 def classes=new File(project.buildDir,'fresh-checkpoint-fixture-classes')
 tasks.register('freshCheckpointFixtureCompile',JavaCompile) {
  dependsOn 'classes';source=fileTree(new File(root,'src')) {include '**/*.java'}
  classpath=sourceSets.main.compileClasspath+sourceSets.main.output;destinationDirectory=classes;options.release=25
 }
 tasks.register('freshCheckpointFixtureJar',Jar) {
  dependsOn 'freshCheckpointFixtureCompile';archiveFileName='fresh-checkpoint-fixture.jar';destinationDirectory=new File(project.buildDir,'fixture-libs');from(classes)
  doFirst {
   new File(classes,'fabric.mod.json').text='{"schemaVersion":1,"id":"ocfreshcheckpointfixture","version":"1","environment":"server","entrypoints":{"main":["net.oceancanvas.probe.FreshCheckpointFixture"]},"mixins":["fresh-checkpoint-fixture.mixins.json"]}'
   new File(classes,'fresh-checkpoint-fixture.mixins.json').text='{"required":true,"package":"net.oceancanvas.probe.mixin","compatibilityLevel":"JAVA_25","mixins":["FreshCheckpointMixin"],"injectors":{"defaultRequire":1}}'
  }
 }
} }
