plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
def resolvedModVersion = version.toString()
def resolvedArchiveName = base.archivesName.get()
processResources {
    inputs.property "version", resolvedModVersion
    filesMatching("fabric.mod.json") { expand "version": resolvedModVersion }
}
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 25 }
jar { from("LICENSE") { rename { "${it}_${resolvedArchiveName}" } } }
tasks.named('test') { failOnNoDiscoveredTests = false }
def coreSelfTestRuntime = sourceSets.test.runtimeClasspath

def javaSelfTests = [
    coreSelfTest: 'net.oceancanvas.core.CoreSelfTest',
    preimageSchemaSelfTest: 'net.oceancanvas.core.restore.BlockStatePreimageSchemaSelfTest',
    failureEvidenceSnapshotSelfTest: 'net.oceancanvas.core.receipt.FailureEvidenceSnapshotSelfTest',
    acceptanceReceiptRecorderSelfTest: 'net.oceancanvas.core.acceptance.AcceptanceReceiptRecorderSelfTest',
    duplicateStageAcknowledgementSelfTest: 'net.oceancanvas.core.pipeline.DuplicateStageAcknowledgementSelfTest',
    restoreVerifiedReleaseRestartSelfTest: 'net.oceancanvas.core.pipeline.RestoreVerifiedReleaseRestartSelfTest',
    settlementWaitRestartSelfTest: 'net.oceancanvas.core.pipeline.SettlementWaitRestartSelfTest',
    authorJournalGapRestartSelfTest: 'net.oceancanvas.core.pipeline.AuthorJournalGapRestartSelfTest',
    startupAuthorityOrphanEvidenceSelfTest: 'net.oceancanvas.core.pipeline.StartupAuthorityOrphanEvidenceSelfTest',
    releaseArchiveCertificateSelfTest: 'net.oceancanvas.core.acceptance.ReleaseArchiveCertificateSelfTest',
    blockEntitySidecarArchiveDigestSelfTest: 'net.oceancanvas.core.restore.BlockEntitySidecarArchiveDigestSelfTest',
    postCompleteRecoveryProofDigestSelfTest: 'net.oceancanvas.core.acceptance.PostCompleteRecoveryProofDigestSelfTest',
    operationManifestFsyncFailureSelfTest: 'net.oceancanvas.core.pipeline.OperationManifestFsyncFailureSelfTest',
    blockStatePreimageFsyncFailureSelfTest: 'net.oceancanvas.core.restore.BlockStatePreimageFsyncFailureSelfTest',
    coreJournalFsyncFailureSelfTest: 'net.oceancanvas.core.journal.CoreJournalFsyncFailureSelfTest',
    runtimeReceiptFsyncFailureSelfTest: 'net.oceancanvas.core.receipt.RuntimeReceiptFsyncFailureSelfTest',
    restorePreflightGateSelfTest: 'net.oceancanvas.core.restore.RestorePreflightGateSelfTest',
    operationManifestBoundedReadSelfTest: 'net.oceancanvas.core.pipeline.OperationManifestBoundedReadSelfTest',
    boundedCampaignIdentityBoundedReadSelfTest: 'net.oceancanvas.core.expansion.BoundedCampaignIdentityBoundedReadSelfTest'
]
javaSelfTests.each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = coreSelfTestRuntime
        mainClass = className
    }
}
tasks.register('hostedFailureEvidenceSelfTest', Exec) {
    workingDir projectDir
    commandLine 'python3', '../scripts/ci/test-preserve-hosted-failure-evidence.py'
}
tasks.named('check') {
    javaSelfTests.keySet().each { dependsOn tasks.named(it) }
    dependsOn tasks.named('hostedFailureEvidenceSelfTest')
}
