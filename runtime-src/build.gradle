plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

// Resolve values during configuration. Gradle 9.5 warns when task actions or
// nested execution-time closures access Task.project; --warning-mode=fail then
// correctly turns that warning into a failed build.
def resolvedModVersion = version.toString()
def resolvedArchiveName = base.archivesName.get()

processResources {
    inputs.property "version", resolvedModVersion
    filesMatching("fabric.mod.json") { expand "version": resolvedModVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

jar {
    from("LICENSE") { rename { "${it}_${resolvedArchiveName}" } }
}

// CoreSelfTest is intentionally a plain Java executable so it can run both in
// Gradle and in the offline source-validation harness. Gradle 9.5 fails Test
// when test classes exist but no framework discovers tests, so state that intent
// explicitly and make the executable self-test part of `check`/`build`.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

def coreSelfTestRuntime = sourceSets.test.runtimeClasspath

tasks.register('coreSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.CoreSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('coreSelfTest')
}
