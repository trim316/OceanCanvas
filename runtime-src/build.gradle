plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

def resolvedModVersion = version.toString()
def resolvedArchiveName = base.archivesName.get()

processResources {
    inputs.property "version", resolvedModVersion
    filesMatching("fabric.mod.json") { expand "version": resolvedModVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

jar {
    from("LICENSE") { rename { "${it}_${resolvedArchiveName}" } }
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

def coreSelfTestRuntime = sourceSets.test.runtimeClasspath

tasks.register('coreSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.CoreSelfTest'
}

