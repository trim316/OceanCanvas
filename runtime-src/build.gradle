plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

// Resolve values during configuration. Gradle 9.5 warns when task actions or
// nested execution-time closures access Task.project; --warning-mode=fail then
// correctly turns that warning into a failed build.
def resolvedModVersion = version.toString()
def resolvedArchiveName = base.archivesName.get()

processResources {
    inputs.property "version", resolvedModVersion
    filesMatching("fabric.mod.json") { expand "version": resolvedModVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

jar {
    from("LICENSE") { rename { "${it}_${resolvedArchiveName}" } }
}

// CoreSelfTest is intentionally a plain Java executable so it can run both in
// Gradle and in the offline source-validation harness. Gradle 9.5 fails Test
// when test classes exist but no framework discovers tests, so state that intent
// explicitly and make the executable self-test part of `check`/`build`.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

def coreSelfTestRuntime = sourceSets.test.runtimeClasspath

tasks.register('coreSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.CoreSelfTest'
}

// R1-42 is kept as a focused executable regression rather than inflating the
// monolithic CoreSelfTest. It proves checksum-valid future preimage formats are
// refused before any replacement stage can mutate authoritative evidence.
tasks.register('preimageSchemaSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.restore.BlockStatePreimageSchemaSelfTest'
}

// R1-07 proves failed-stage evidence is copied independently, immutably and
// within a strict per-file bound even when the forensic receipt append fails.
tasks.register('failureEvidenceSnapshotSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.receipt.FailureEvidenceSnapshotSelfTest'
}

// R1-20 proves the durable acceptance restart gate remains authoritative when
// non-authoritative forensic receipts are absent or torn, without repairing
// corrupt forensic evidence.
tasks.register('acceptanceReceiptRecorderSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.acceptance.AcceptanceReceiptRecorderSelfTest'
}

// R1-47 proves a successful stage acknowledgement that already reached the
// authoritative journal is never dispatched again after a process restart.
tasks.register('duplicateStageAcknowledgementSelfTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = coreSelfTestRuntime
    mainClass = 'net.oceancanvas.core.pipeline.DuplicateStageAcknowledgementSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('coreSelfTest')
    dependsOn tasks.named('preimageSchemaSelfTest')
    dependsOn tasks.named('failureEvidenceSnapshotSelfTest')
    dependsOn tasks.named('acceptanceReceiptRecorderSelfTest')
    dependsOn tasks.named('duplicateStageAcknowledgementSelfTest')
}
