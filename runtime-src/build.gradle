plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
def resolvedModVersion = version.toString()
def resolvedArchiveName = base.archivesName.get()
processResources { inputs.property "version", resolvedModVersion; filesMatching("fabric.mod.json") { expand "version": resolvedModVersion } }
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 25 }
jar { from("LICENSE") { rename { "${it}_${resolvedArchiveName}" } } }
tasks.named('test') { failOnNoDiscoveredTests = false }
def coreSelfTestRuntime = sourceSets.test.runtimeClasspath

def javaSelfTest = { String taskName, String className ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = coreSelfTestRuntime
        mainClass = className
    }
}

javaSelfTest('coreSelfTest', 'net.oceancanvas.core.CoreSelfTest')
javaSelfTest('preimageSchemaSelfTest', 'net.oceancanvas.core.restore.BlockStatePreimageSchemaSelfTest')
javaSelfTest('failureEvidenceSnapshotSelfTest', 'net.oceancanvas.core.receipt.FailureEvidenceSnapshotSelfTest')
javaSelfTest('acceptanceReceiptRecorderSelfTest', 'net.oceancanvas.core.acceptance.AcceptanceReceiptRecorderSelfTest')
javaSelfTest('duplicateStageAcknowledgementSelfTest', 'net.oceancanvas.core.pipeline.DuplicateStageAcknowledgementSelfTest')
javaSelfTest('restoreVerifiedReleaseRestartSelfTest', 'net.oceancanvas.core.pipeline.RestoreVerifiedReleaseRestartSelfTest')
javaSelfTest('settlementWaitRestartSelfTest', 'net.oceancanvas.core.pipeline.SettlementWaitRestartSelfTest')
javaSelfTest('authorJournalGapRestartSelfTest', 'net.oceancanvas.core.pipeline.AuthorJournalGapRestartSelfTest')
javaSelfTest('startupAuthorityOrphanEvidenceSelfTest', 'net.oceancanvas.core.pipeline.StartupAuthorityOrphanEvidenceSelfTest')
javaSelfTest('releaseArchiveCertificateSelfTest', 'net.oceancanvas.core.acceptance.ReleaseArchiveCertificateSelfTest')
javaSelfTest('blockEntitySidecarArchiveDigestSelfTest', 'net.oceancanvas.core.restore.BlockEntitySidecarArchiveDigestSelfTest')
javaSelfTest('postCompleteRecoveryProofDigestSelfTest', 'net.oceancanvas.core.acceptance.PostCompleteRecoveryProofDigestSelfTest')
javaSelfTest('operationManifestFsyncFailureSelfTest', 'net.oceancanvas.core.pipeline.OperationManifestFsyncFailureSelfTest')
javaSelfTest('blockStatePreimageFsyncFailureSelfTest', 'net.oceancanvas.core.restore.BlockStatePreimageFsyncFailureSelfTest')
javaSelfTest('coreJournalFsyncFailureSelfTest', 'net.oceancanvas.core.journal.CoreJournalFsyncFailureSelfTest')
javaSelfTest('runtimeReceiptFsyncFailureSelfTest', 'net.oceancanvas.core.receipt.RuntimeReceiptFsyncFailureSelfTest')
javaSelfTest('runtimeReceiptBoundedReadSelfTest', 'net.oceancanvas.core.receipt.RuntimeReceiptBoundedReadSelfTest')
javaSelfTest('restorePreflightGateSelfTest', 'net.oceancanvas.core.restore.RestorePreflightGateSelfTest')
javaSelfTest('operationManifestBoundedReadSelfTest', 'net.oceancanvas.core.pipeline.OperationManifestBoundedReadSelfTest')
javaSelfTest('twoChunkCanaryIdentityBoundedReadSelfTest', 'net.oceancanvas.core.expansion.TwoChunkCanaryIdentityBoundedReadSelfTest')
javaSelfTest('nineChunkCanaryIdentityBoundedReadSelfTest', 'net.oceancanvas.core.expansion.NineChunkCanaryIdentityBoundedReadSelfTest')
javaSelfTest('sixteenChunkCanaryIdentityBoundedReadSelfTest', 'net.oceancanvas.core.expansion.SixteenChunkCanaryIdentityBoundedReadSelfTest')
javaSelfTest('blockStateRegistryIdentityRegularFileSelfTest', 'net.oceancanvas.core.restore.BlockStateRegistryIdentityRegularFileSelfTest')
javaSelfTest('blockEntitySidecarBoundedReadSelfTest', 'net.oceancanvas.core.restore.BlockEntitySidecarBoundedReadSelfTest')
javaSelfTest('blockStatePreimageBoundedReadSelfTest', 'net.oceancanvas.core.restore.BlockStatePreimageBoundedReadSelfTest')

tasks.register('hostedFailureEvidenceSelfTest', Exec) {
    workingDir projectDir
    commandLine 'python3', '../scripts/ci/test-preserve-hosted-failure-evidence.py'
}

tasks.named('check') {
    dependsOn tasks.named('coreSelfTest')
    dependsOn tasks.named('preimageSchemaSelfTest')
    dependsOn tasks.named('failureEvidenceSnapshotSelfTest')
    dependsOn tasks.named('acceptanceReceiptRecorderSelfTest')
    dependsOn tasks.named('duplicateStageAcknowledgementSelfTest')
    dependsOn tasks.named('restoreVerifiedReleaseRestartSelfTest')
    dependsOn tasks.named('hostedFailureEvidenceSelfTest')
    dependsOn tasks.named('settlementWaitRestartSelfTest')
    dependsOn tasks.named('authorJournalGapRestartSelfTest')
    dependsOn tasks.named('startupAuthorityOrphanEvidenceSelfTest')
    dependsOn tasks.named('releaseArchiveCertificateSelfTest')
    dependsOn tasks.named('blockEntitySidecarArchiveDigestSelfTest')
    dependsOn tasks.named('postCompleteRecoveryProofDigestSelfTest')
    dependsOn tasks.named('operationManifestFsyncFailureSelfTest')
    dependsOn tasks.named('blockStatePreimageFsyncFailureSelfTest')
    dependsOn tasks.named('coreJournalFsyncFailureSelfTest')
    dependsOn tasks.named('runtimeReceiptFsyncFailureSelfTest')
    dependsOn tasks.named('runtimeReceiptBoundedReadSelfTest')
    dependsOn tasks.named('restorePreflightGateSelfTest')
    dependsOn tasks.named('operationManifestBoundedReadSelfTest')
    dependsOn tasks.named('twoChunkCanaryIdentityBoundedReadSelfTest')
    dependsOn tasks.named('nineChunkCanaryIdentityBoundedReadSelfTest')
    dependsOn tasks.named('sixteenChunkCanaryIdentityBoundedReadSelfTest')
    dependsOn tasks.named('blockStateRegistryIdentityRegularFileSelfTest')
    dependsOn tasks.named('blockEntitySidecarBoundedReadSelfTest')
    dependsOn tasks.named('blockStatePreimageBoundedReadSelfTest')
}
